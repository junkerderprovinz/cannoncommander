http:
  port: 80
  baseURL: "/"
server:
  cacheDir: "/config/cache"
  logging:
    - levels: "info|error|warning"
  sources:
    - path: "/mnt/user"
      name: "Shares"
    # Remotes are browsed live, indexing them would read whole clouds.
    - path: "/mnt/remotes"
      name: "Fernziele"
      config:
        rules:
          - folderPath: "/"
            viewable: true
auth:
  methods:
    password:
      enabled: true
      minLength: 8
      signup: false

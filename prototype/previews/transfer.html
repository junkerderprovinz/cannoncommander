<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übertragung</title>
<style>
/*TOKENS*/
:root { --radius-control: 12px; --radius-card: 22px; --radius-pill: 999px; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--carbon-bg); color: var(--carbon-text); font: 14px/1.45 var(--font-sans, system-ui, sans-serif); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; }
.stage { min-height: 100vh; display: grid; place-items: center; padding: 6rem 1rem 8rem; position: relative; }
.stage::before { content: ""; position: fixed; inset: 0; background: radial-gradient(60rem 40rem at 50% 40%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%); pointer-events: none; }

.bar { position: fixed; top: 1rem; left: 50%; translate: -50% 0; display: flex; gap: .5rem; align-items: center; z-index: 5; flex-wrap: wrap; justify-content: center; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-pill); background: var(--carbon-surface); box-shadow: var(--hairline); }
.seg button { height: 2rem; padding: 0 .9rem; border-radius: var(--radius-pill); color: var(--carbon-text-sub); display: inline-flex; align-items: center; gap: .45rem; }
.seg button svg { width: .95rem; height: .95rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-contrast); }
.chip { height: 2.3rem; padding: 0 1rem; border-radius: var(--radius-pill); background: var(--carbon-surface); box-shadow: var(--hairline); color: var(--carbon-text-sub); display: inline-flex; align-items: center; gap: .45rem; }
.chip svg { width: .95rem; height: .95rem; }

.win { --tone: var(--accent); position: relative; width: min(38rem, 100%); padding: 1.6rem 1.25rem 1.1rem; border-radius: var(--radius-card); background: var(--carbon-surface); box-shadow: var(--elevation), var(--hairline); }
.win.failed { --tone: var(--status-fail-solid); }
.notch { position: absolute; top: 0; left: 1.25rem; transform: translateY(-50%); height: 1.6rem; padding: 0 .8rem; border-radius: var(--radius-pill); background: var(--tone); color: var(--accent-contrast); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: .5rem; transition: background .3s; }
.failed .notch { color: #fff; }
.notch .of { font-weight: 500; letter-spacing: 0; text-transform: none; opacity: .75; }

/* The speed graph grows from left to right as the job advances, as in the Windows copy window. */
.graph { position: relative; height: 7.5rem; margin-top: .3rem; border-radius: var(--radius-control); background: color-mix(in srgb, var(--carbon-surface2) 75%, transparent); overflow: hidden; }
.graph::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, transparent 0 calc(25% - 1px), color-mix(in srgb, var(--carbon-text) 6%, transparent) calc(25% - 1px) 25%); }
.graph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.graph .area { fill: color-mix(in srgb, var(--tone) 28%, transparent); }
.graph .edge { fill: none; stroke: var(--tone); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.graph .now { stroke: color-mix(in srgb, var(--carbon-text) 55%, transparent); stroke-width: 1; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
.rate { position: absolute; right: .6rem; translate: 0 -120%; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--carbon-text-sub); transition: top .25s linear; }
.pct { position: absolute; left: .8rem; top: .55rem; font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.pct small { font-size: 1rem; font-weight: 600; color: var(--carbon-text-sub); margin-left: .1rem; }

/* One flat row: the files slide from the source to the target, each with the glyph of its own type. */
.lane { display: flex; align-items: center; gap: .6rem; height: 2.6rem; margin-top: .55rem; }
.place { display: flex; align-items: center; gap: .4rem; flex: none; max-width: 8.5rem; font-size: 12px; color: var(--carbon-text-muted); }
.place .ic { width: 1.25rem; height: 1.25rem; display: grid; place-items: center; flex: none; transition: opacity .3s; }
.place .ic svg { width: 1.25rem; height: 1.25rem; color: var(--accent-glyph); }
.place span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.to .ic.catch { animation: catch .3s ease-out; }
@keyframes catch { 40% { transform: scale(1.18); } }
.from.empty .ic { opacity: .4; }
.to .ic.ok svg { color: var(--accent); animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
.failed .to .ic svg { color: var(--status-fail-solid); }
@keyframes pop { from { transform: scale(.3); } }
.track { position: relative; flex: 1; min-width: 0; height: 100%; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dotted color-mix(in srgb, var(--carbon-text) 14%, transparent); }
.paper { position: absolute; left: 0; top: 50%; margin-top: -.55rem; z-index: 2; pointer-events: none; }
.paper svg { width: 1.1rem; height: 1.1rem; color: var(--accent-glyph); }
.spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); pointer-events: none; animation: spark .5s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; } }
.done .paper, .failed .paper, .cancelled .paper { opacity: 0; transition: opacity .3s; }

.file { display: flex; align-items: center; gap: .5rem; font-size: 13px; color: var(--carbon-text-sub); }
.file svg { width: .9rem; height: .9rem; color: var(--accent-glyph); flex: none; }
.failed .file, .failed .file svg { color: var(--status-fail-text); }
.ticker { position: relative; flex: 1; min-width: 0; height: 1.3rem; overflow: hidden; }
.ticker span { position: absolute; inset: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: tickin .3s ease-out; }
.ticker span.out { animation: tickout .3s ease-in forwards; }
@keyframes tickin { from { translate: 0 100%; opacity: 0; } }
@keyframes tickout { to { translate: 0 -100%; opacity: 0; } }
.file .count { font-size: 12px; color: var(--carbon-text-muted); font-variant-numeric: tabular-nums; flex: none; }

.facts { display: grid; grid-template-columns: 1fr 1fr 1.7fr 1fr; gap: .5rem; margin-top: .9rem; padding-top: .8rem; border-top: 1px solid color-mix(in srgb, var(--carbon-text) 8%, transparent); }
.facts div { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.facts small { font-size: 11px; color: var(--carbon-text-muted); }
.facts b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.foot { display: flex; align-items: center; justify-content: flex-end; gap: .5rem; margin-top: 1.1rem; }
.btn { white-space: nowrap; flex: none; height: 2.3rem; padding: 0 1rem; border-radius: var(--radius-pill); background: var(--carbon-surface2); display: inline-flex; align-items: center; gap: .45rem; }
.btn svg { width: .95rem; height: .95rem; }
.btn:hover { background: var(--carbon-surface3); }
.btn.primary { background: var(--accent); color: var(--accent-contrast); }
.btn.primary:hover { background: var(--accent-hover); }

@media (prefers-reduced-motion: reduce) {
  .spark, .ticker span { animation: none !important; }
  .paper { display: none; }
}
@media (max-width: 520px) {
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: .7rem; }
  .place { max-width: 5.5rem; }
}
</style>
</head>
<body>
<div class="bar">
  <div class="seg" id="modes" role="group" aria-label="Vorgang"></div>
  <button class="chip" id="again" type="button"><span data-g="IconRefresh"></span>Neu starten</button>
  <button class="chip" id="theme" type="button"><span data-g="IconTabLook"></span>Hell oder dunkel</button>
</div>

<main class="stage">
  <section class="win" id="win" aria-live="polite">
    <span class="notch"><span id="verb">Kopieren</span><span class="of" id="of"></span></span>
    <div class="graph">
      <svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="area"/><path class="edge" id="edge"/><line class="now" id="now" x1="0" x2="1000"/></svg>
      <div class="pct"><span id="pct">0</span><small>%</small></div>
      <span class="rate" id="rate"></span>
    </div>
    <div class="lane">
      <div class="place from" id="from"><span class="ic"></span><span></span></div>
      <div class="track" id="track"></div>
      <div class="place to" id="to"><span class="ic"></span><span></span></div>
    </div>
    <div class="file"><span id="nowg"></span><div class="ticker" id="ticker"></div><span class="count" id="count"></span></div>
    <div class="facts">
      <div><small id="leftl">Restzeit</small><b id="left">…</b></div>
      <div><small>Dateien</small><b id="files"></b></div>
      <div><small>Daten</small><b id="bytes"></b></div>
      <div><small id="speedl">Tempo</small><b id="speed"></b></div>
    </div>
    <div class="foot" id="foot"></div>
  </section>
</main>

<script>
const GLYPHS = /*GLYPHS*/;
const g = (n) => { const x = GLYPHS[n]; return x ? `<svg viewBox="${x.viewBox}" fill="currentColor" aria-hidden="true">${x.svg}</svg>` : ''; };
const $ = (s) => document.querySelector(s);
document.querySelectorAll('[data-g]').forEach(el => { el.outerHTML = g(el.dataset.g); });

const FILES = [
  ['IconFileVideo', 'Big Buck Bunny (2008).mkv', 1.4e9], ['IconFileVideo', 'Sintel (2010).mkv', 2.2e9], ['IconFileImage', 'IMG_0203.jpg', 5.8e6],
  ['IconFileAudio', 'album.flac', 41e6], ['IconFilePdf', 'Rechnung-Oktober.pdf', 212e3], ['IconFileImage', 'IMG_0204.jpg', 2.8e6],
  ['IconFileVideo', 'Elephants Dream (2006).mkv', 922e6], ['IconFileDoc', 'Bewerbung.docx', 140e3], ['IconArchive', 'Fotos-Urlaub-2026.zip', 842e6],
  ['IconFileImage', 'IMG_0205.jpg', 5.6e6], ['IconDisc', 'debian-13.1.0-amd64-netinst.iso', 754e6], ['IconFileText', 'setup-notes.md', 4e3],
];
const MODES = {
  copy:   { verb: 'Kopieren', g: 'IconCopy', from: ['IconFolderOpen', 'downloads'], to: ['IconFolder', 'backups'], mbs: 112, secs: 30, done: 'Alles kopiert' },
  move:   { verb: 'Verschieben', g: 'IconMove', from: ['IconFolderOpen', 'downloads'], to: ['IconFolder', 'filme'], mbs: 180, secs: 22, done: 'Alles verschoben' },
  delete: { verb: 'Löschen', g: 'IconTrash', from: ['IconFolderOpen', 'downloads'], to: ['IconTrash', 'Papierkorb'], mbs: 900, secs: 12, done: 'Alles im Papierkorb' },
  pack:   { verb: 'Verpacken', g: 'IconArchive', from: ['IconFolderOpen', 'fotos'], to: ['IconArchive', 'Urlaub-2026.zip'], mbs: 64, secs: 34, done: 'Archiv ist fertig' },
  fail:   { verb: 'Kopieren', label: 'Fehler', g: 'IconWarning', from: ['IconFolderOpen', 'downloads'], to: ['IconFolder', 'backups'], mbs: 112, secs: 30, failAt: 6,
            why: 'backups ist voll, Elephants Dream (2006).mkv passt nicht mehr' },
};
const fmt = (b) => b >= 1e9 ? (b / 1e9).toFixed(2).replace('.', ',') + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1).replace('.', ',') + ' MB' : b >= 1e3 ? Math.round(b / 1e3) + ' KB' : b + ' B';
const dur = (s) => s >= 60 ? `${Math.floor(s / 60)} Min. ${Math.round(s % 60)} s` : `${Math.max(1, Math.round(s))} s`;
const motion = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;

let mode = 'copy', st;
$('#modes').innerHTML = Object.entries(MODES).map(([k, m]) => `<button type="button" data-mode="${k}" aria-pressed="${k === mode}">${g(m.g)}${m.label || m.verb}</button>`).join('');
$('#modes').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) { mode = b.dataset.mode; start(); } });
$('#again').onclick = () => start();
$('#theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light'; };

function buttons(list) {
  $('#foot').innerHTML = list.map(([id, glyph, label, primary]) => `<button class="btn ${primary ? 'primary' : ''}" id="${id}" type="button">${g(glyph)}<span>${label}</span></button>`).join('');
}
$('#foot').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'pause') return pause(!st.paused);
  if (b.id === 'cancel') return stop();
  start();
});
const running = () => buttons([['pause', 'IconPause', 'Pausieren'], ['cancel', 'IconClose', 'Abbrechen'], ['bg', 'IconCheck', 'Im Hintergrund', true]]);

// Pausing holds the clock, the progress and every file in flight where it is.
function pause(on) {
  st.paused = on;
  $('#win').classList.toggle('paused', on);
  document.querySelectorAll('.paper').forEach(p => p.getAnimations().forEach(a => on ? a.pause() : a.play()));
  $('#pause').innerHTML = g(on ? 'IconPlay' : 'IconPause') + `<span>${on ? 'Fortsetzen' : 'Pausieren'}</span>`;
  $('#left').textContent = on ? 'pausiert' : $('#left').textContent;
}

function launch(glyph) {
  if (!motion()) return;
  const track = $('#track'), p = document.createElement('div'), w = track.clientWidth - 18;
  p.className = 'paper';
  p.innerHTML = g(glyph);
  track.appendChild(p);
  const shrink = mode === 'delete';
  const a = p.animate([
    { transform: 'translateX(0) scale(.6)', opacity: 0 },
    { transform: `translateX(${w * .12}px) scale(1)`, opacity: 1, offset: .12 },
    { transform: `translateX(${w * .88}px) scale(${shrink ? .7 : 1})`, opacity: 1, offset: .88 },
    { transform: `translateX(${w}px) scale(${shrink ? .3 : .6})`, opacity: 0 },
  ], { duration: shrink ? 650 : 1000, easing: 'cubic-bezier(.4, 0, .3, 1)', fill: 'forwards' });
  a.onfinish = () => {
    p.remove();
    const to = $('#to .ic');
    to.classList.remove('catch'); void to.offsetWidth; to.classList.add('catch');
    if (shrink) sparks(track.clientWidth, track.clientHeight / 2);
  };
}
function sparks(x, y) {
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span'), a = Math.random() * Math.PI * 2, d = 10 + Math.random() * 12;
    s.className = 'spark';
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--x', Math.cos(a) * d + 'px'); s.style.setProperty('--y', Math.sin(a) * d + 'px');
    $('#track').appendChild(s);
    setTimeout(() => s.remove(), 550);
  }
}

function ticker(name) {
  const t = $('#ticker'), old = t.querySelector('span:not(.out)');
  if (old) { old.classList.add('out'); setTimeout(() => old.remove(), 320); }
  const s = document.createElement('span');
  s.textContent = name;
  t.appendChild(s);
}

function graph(mbs) {
  // The curve keeps to the lower part so the percentage in the corner stays readable.
  const top = MODES[mode].mbs * 1.4, y = (v) => (100 - Math.min(v / top, 1) * 62).toFixed(1);
  const pts = st.samples.map(([p, v]) => `${(p * 1000).toFixed(1)},${y(v)}`);
  if (!pts.length) return;
  const last = st.samples.at(-1)[0] * 1000;
  $('#edge').setAttribute('d', 'M' + pts.join(' L'));
  $('#area').setAttribute('d', `M0,100 L${pts.join(' L')} L${last.toFixed(1)},100 Z`);
  const ny = y(mbs);
  $('#now').setAttribute('y1', ny); $('#now').setAttribute('y2', ny);
  $('#rate').style.top = ny + '%';
  $('#rate').textContent = `${Math.round(mbs)} MB/s`;
}

function start() {
  clearInterval(st?.timer);
  const m = MODES[mode];
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  $('#win').className = `win mode-${mode}`;
  $('#verb').textContent = m.verb;
  $('#from').classList.remove('empty');
  $('#from .ic').style.opacity = '';
  $('#from .ic').innerHTML = g(m.from[0]); $('#from span:last-child').textContent = m.from[1];
  $('#to .ic').className = 'ic';
  $('#to .ic').innerHTML = g(m.to[0]); $('#to span:last-child').textContent = m.to[1];
  $('#leftl').textContent = 'Restzeit'; $('#speedl').textContent = 'Tempo';
  document.querySelectorAll('.paper, .spark').forEach(x => x.remove());
  $('#ticker').innerHTML = '';
  ['#area', '#edge'].forEach(s => $(s).removeAttribute('d'));
  $('#rate').textContent = '';
  const total = FILES.reduce((a, f) => a + f[2], 0);
  // The demo squeezes the job into m.secs seconds while showing real speeds; pace converts between the two.
  st = { i: 0, done: 0, fileDone: 0, total, pace: total / (m.mbs * 1e6 * m.secs), paused: false, t: 0, sent: -9, queue: [], samples: [[0, 0]] };
  running();
  next();
  st.timer = setInterval(tick, 120);
}
function next() {
  const f = FILES[st.i];
  $('#nowg').innerHTML = g(f[0]);
  ticker(f[1]);
  $('#of').textContent = `${st.i + 1} von ${FILES.length}`;
  $('#count').textContent = fmt(f[2]);
  $('#files').textContent = `${st.i} von ${FILES.length}`;
  st.queue.push(f[0]);
}
function tick() {
  if (st.paused || st.finished) return;
  const m = MODES[mode];
  st.t++;
  // Each file that starts sends its glyph across; a long file sends another now and then while it runs.
  if (!st.queue.length && st.t - st.sent >= 7) st.queue.push(FILES[st.i][0]);
  if (st.queue.length && st.t - st.sent >= 2) { launch(st.queue.shift()); st.sent = st.t; st.queue.length = Math.min(st.queue.length, 3); }
  // The speed wanders a little, the way a real disk does.
  st.mbs = (st.mbs ?? m.mbs * .8) * .8 + m.mbs * (0.75 + 0.25 * Math.sin(st.t / 9) + 0.15 * Math.random()) * .2;
  const mbs = st.mbs;
  const pace = st.pace, step = mbs * 1e6 * 0.12 * pace;
  let left = step;
  while (left > 0 && st.i < FILES.length) {
    const need = FILES[st.i][2] - st.fileDone;
    if (m.failAt === st.i && st.fileDone + left >= need / 2) { st.done += need / 2 - st.fileDone; st.fileDone = need / 2; return fail(mbs); }
    if (left >= need) { left -= need; st.done += need; st.fileDone = 0; st.i++; if (st.i < FILES.length) next(); }
    else { st.fileDone += left; st.done += left; left = 0; }
  }
  const p = Math.min(1, st.done / st.total);
  st.samples.push([p, mbs]);
  graph(mbs);
  $('#pct').textContent = Math.floor(p * 100);
  if (mode !== 'copy' && mode !== 'fail') $('#from .ic').style.opacity = (1 - p * .55).toFixed(2);
  $('#bytes').textContent = `${fmt(st.done)} von ${fmt(st.total)}`;
  $('#speed').textContent = `${Math.round(mbs)} MB/s`;
  $('#left').textContent = dur((st.total - st.done) / (mbs * 1e6 * pace));
  if (st.i >= FILES.length) finish();
}
const real = () => st.t * .12 * st.pace;
function settle(state) {
  st.finished = true;
  clearInterval(st.timer);
  st.queue = [];
  $('#win').classList.add(state);
}
function finish() {
  const m = MODES[mode];
  settle('done');
  if (mode !== 'copy') $('#from').classList.add('empty');
  $('#pct').textContent = '100';
  $('#to .ic').className = 'ic ok';
  $('#to .ic').innerHTML = g('IconCheck');
  $('#of').textContent = `${FILES.length} Dateien`;
  $('#files').textContent = `${FILES.length} von ${FILES.length}`;
  $('#leftl').textContent = 'Dauer'; $('#left').textContent = dur(real());
  $('#speedl').textContent = 'Schnitt'; $('#speed').textContent = `${Math.round(st.total / real() / 1e6)} MB/s`;
  $('#rate').textContent = '';
  $('#nowg').innerHTML = g('IconCheck');
  ticker(m.done);
  $('#count').textContent = fmt(st.total);
  buttons([['close', 'IconCheck', 'Schließen', true]]);
}
function fail(mbs) {
  settle('failed');
  st.samples.push([st.done / st.total, mbs * .3], [st.done / st.total, 0]);
  graph(0);
  $('#rate').textContent = '';
  $('#to .ic').innerHTML = g('IconWarning');
  $('#nowg').innerHTML = g('IconWarning');
  ticker(MODES[mode].why);
  $('#count').textContent = '';
  $('#leftl').textContent = 'Gestoppt nach'; $('#left').textContent = dur(real());
  $('#files').textContent = `${st.i} von ${FILES.length}`;
  $('#bytes').textContent = `${fmt(st.done)} von ${fmt(st.total)}`;
  $('#speed').textContent = '0 MB/s';
  buttons([['close', 'IconClose', 'Schließen'], ['retry', 'IconRetry', 'Nochmal', true]]);
}
function stop() {
  settle('cancelled');
  $('#rate').textContent = '';
  $('#nowg').innerHTML = g('IconClose');
  ticker(`Abgebrochen, ${st.i} von ${FILES.length} Dateien sind schon drüben`);
  $('#count').textContent = '';
  $('#leftl').textContent = 'Gelaufen'; $('#left').textContent = dur(real());
  $('#speed').textContent = '0 MB/s';
  buttons([['close', 'IconCheck', 'Schließen', true]]);
}
start();
</script>
<!--PINNWAND 3-->
</body>
</html>

<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übertragung</title>
<style>
/*TOKENS*/
:root { --radius-control: 12px; --radius-card: 22px; --radius-pill: 999px; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--carbon-bg); color: var(--carbon-text); font: 14px/1.45 var(--font-sans, system-ui, sans-serif); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; }
.stage { min-height: 100vh; display: grid; place-items: center; padding: 6rem 1rem 8rem; position: relative; }
.stage::before { content: ""; position: fixed; inset: 0; background: radial-gradient(60rem 40rem at 50% 40%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%); pointer-events: none; }

.bar { position: fixed; top: 1rem; left: 50%; translate: -50% 0; display: flex; gap: .5rem; align-items: center; z-index: 5; flex-wrap: wrap; justify-content: center; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-pill); background: var(--carbon-surface); box-shadow: var(--hairline); }
.seg button { height: 2rem; padding: 0 .9rem; border-radius: var(--radius-pill); color: var(--carbon-text-sub); display: inline-flex; align-items: center; gap: .45rem; }
.seg button svg { width: .95rem; height: .95rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-contrast); }
.chip { height: 2.3rem; padding: 0 1rem; border-radius: var(--radius-pill); background: var(--carbon-surface); box-shadow: var(--hairline); color: var(--carbon-text-sub); display: inline-flex; align-items: center; gap: .45rem; }
.chip svg { width: .95rem; height: .95rem; }

.win { position: relative; width: min(38rem, 100%); padding: 1.6rem 1.25rem 1.1rem; border-radius: var(--radius-card); background: var(--carbon-surface); box-shadow: var(--elevation), var(--hairline); }
.notch { position: absolute; top: 0; left: 1.25rem; transform: translateY(-50%); height: 1.6rem; padding: 0 .8rem; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-contrast); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: .5rem; }
.notch .of { font-weight: 500; letter-spacing: 0; text-transform: none; opacity: .75; }

/* The flight: from one place to the other, the files arc across. */
.flight { position: relative; height: 9.5rem; margin: .2rem 0 1rem; border-radius: calc(var(--radius-card) - 6px); background: color-mix(in srgb, var(--carbon-surface2) 70%, transparent); overflow: hidden; }
.place { position: absolute; top: 50%; translate: 0 -50%; width: 5.2rem; display: flex; flex-direction: column; align-items: center; gap: .35rem; z-index: 2; }
.place.from { left: 1.4rem; } .place.to { right: 1.4rem; }
.place .ic { width: 3.6rem; height: 3.6rem; border-radius: 1.1rem; display: grid; place-items: center; background: var(--carbon-surface); box-shadow: var(--hairline); transition: transform .3s; }
.place .ic svg { width: 1.9rem; height: 1.9rem; color: var(--accent-glyph); }
.place small { font-size: 11px; color: var(--carbon-text-muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.to .ic.catch { animation: catch .35s ease-out; }
/* The target fills up as a ring; the source empties for moves, deletes and packing. */
.place .ic { position: relative; }
.to .ic::before { content: ""; position: absolute; inset: -5px; border-radius: 1.35rem; padding: 3px; background: conic-gradient(var(--accent) var(--p, 0%), color-mix(in srgb, var(--carbon-text) 10%, transparent) 0); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; transition: --p .25s; }
.from .ic { transition: opacity .3s; }
@keyframes catch { 40% { transform: scale(1.12); } }
.from.empty .ic { opacity: .45; }

.lane { position: absolute; inset: 0; pointer-events: none; }
.lane path { fill: none; stroke: color-mix(in srgb, var(--carbon-text) 12%, transparent); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.paper { position: absolute; left: 0; top: 0; width: 1.7rem; height: 2.1rem; border-radius: .4rem; display: grid; place-items: center; background: var(--carbon-surface); box-shadow: 0 4px 14px rgb(0 0 0 / .25), var(--hairline); offset-path: var(--route); offset-rotate: 0deg; animation: fly var(--d, 1.6s) cubic-bezier(.45, .05, .35, 1) forwards; z-index: 3; }
.paper svg { width: .95rem; height: .95rem; color: var(--accent-glyph); }
@keyframes fly {
  0% { offset-distance: 0%; opacity: 0; scale: .6; rotate: -8deg; }
  12% { opacity: 1; scale: 1; }
  50% { rotate: 6deg; }
  88% { opacity: 1; scale: 1; }
  100% { offset-distance: 100%; opacity: 0; scale: .5; rotate: 0deg; }
}
.mode-delete .paper { animation-name: drop; }
@keyframes drop {
  0% { offset-distance: 0%; opacity: 0; scale: .6; }
  12% { opacity: 1; scale: 1; }
  75% { opacity: 1; scale: .9; filter: none; }
  100% { offset-distance: 100%; opacity: 0; scale: .2; filter: blur(2px); }
}
.spark { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); z-index: 4; pointer-events: none; animation: spark .6s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; } }

.big { display: flex; align-items: baseline; gap: .75rem; }
.pct { font-size: 2.6rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.pct small { font-size: 1.2rem; font-weight: 600; color: var(--carbon-text-sub); margin-left: .1rem; }
.facts { margin-left: auto; text-align: right; font-size: 13px; color: var(--carbon-text-sub); font-variant-numeric: tabular-nums; line-height: 1.5; }
.facts b { color: var(--carbon-text); font-weight: 600; }
.track { position: relative; height: .6rem; margin: .9rem 0 .2rem; border-radius: var(--radius-pill); background: var(--carbon-surface3); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--accent); transition: width .25s linear; overflow: hidden; }
.fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgb(255 255 255 / .45) 50%, transparent 80%); translate: -100% 0; animation: shine 1.6s ease-in-out infinite; }
@keyframes shine { to { translate: 100% 0; } }
.paused .fill::after, .done .fill::after { animation: none; }

.speed { height: 2.6rem; margin-top: .6rem; }
.speed svg { width: 100%; height: 100%; overflow: visible; }
.speed .area { fill: color-mix(in srgb, var(--accent) 16%, transparent); }
.speed .line { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; }
.speed .dot { fill: var(--accent); }

.now { display: flex; align-items: center; gap: .6rem; margin-top: .9rem; padding: .55rem .7rem; border-radius: var(--radius-control); background: var(--carbon-surface2); min-height: 2.6rem; overflow: hidden; }
.nowg { flex: none; }
.now svg { width: 1rem; height: 1rem; color: var(--accent-glyph); flex: none; }
.ticker { position: relative; flex: 1; min-width: 0; height: 1.3rem; overflow: hidden; }
.ticker span { position: absolute; inset: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: tickin .35s ease-out; }
.ticker span.out { animation: tickout .35s ease-in forwards; }
@keyframes tickin { from { translate: 0 100%; opacity: 0; } }
@keyframes tickout { to { translate: 0 -100%; opacity: 0; } }
.now .count { font-size: 12px; color: var(--carbon-text-muted); font-variant-numeric: tabular-nums; flex: none; }

.foot { display: flex; align-items: center; gap: .5rem; margin-top: 1.1rem; }
.hint { margin: .6rem .2rem 0; font-size: 12px; color: var(--carbon-text-muted); }
.foot { justify-content: flex-end; }
.btn { white-space: nowrap; flex: none; height: 2.3rem; padding: 0 1rem; border-radius: var(--radius-pill); background: var(--carbon-surface2); display: inline-flex; align-items: center; gap: .45rem; }
.btn svg { width: .95rem; height: .95rem; }
.btn:hover { background: var(--carbon-surface3); }
.btn.primary { background: var(--accent); color: var(--accent-contrast); }

/* Finished: the progress turns into a tick. */
.done-mark { position: absolute; inset: 0; display: grid; place-items: center; z-index: 6; pointer-events: none; opacity: 0; }
.done .done-mark { opacity: 1; }
.done-mark i { width: 4.6rem; height: 4.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-contrast); scale: .3; box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
.done .done-mark i { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) forwards, ring 1s .2s ease-out; }
.done-mark svg { width: 2.2rem; height: 2.2rem; }
.done-mark path { stroke-dasharray: 30; stroke-dashoffset: 30; }
.done .done-mark path { animation: draw .45s .25s ease-out forwards; }
@keyframes pop { to { scale: 1; } }
@keyframes ring { to { box-shadow: 0 0 0 1.6rem transparent; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.done .lane, .done .paper { opacity: 0; transition: opacity .3s; }

@media (prefers-reduced-motion: reduce) {
  .paper, .spark, .lane path, .fill::after { animation: none !important; }
  .paper { display: none; }
}
@media (max-width: 520px) { .facts { font-size: 12px; } .pct { font-size: 2.1rem; }  }
</style>
</head>
<body>
<div class="bar">
  <div class="seg" id="modes" role="group" aria-label="Vorgang"></div>
  <button class="chip" id="again" type="button"><span data-g="IconRefresh"></span>Neu starten</button>
  <button class="chip" id="theme" type="button"><span data-g="IconTabLook"></span>Hell oder dunkel</button>
</div>

<main class="stage">
  <section class="win" id="win" aria-live="polite">
    <span class="notch"><span id="verb">Kopieren</span><span class="of" id="of"></span></span>
    <div class="flight" id="flight">
      <div class="place from" id="from"><span class="ic"></span><small></small></div>
      <svg class="lane" id="lane" preserveAspectRatio="none"><path id="route"/></svg>
      <div class="place to" id="to"><span class="ic"></span><small></small></div>
      <div class="done-mark"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i></div>
    </div>
    <div class="big">
      <div class="pct"><span id="pct">0</span><small>%</small></div>
      <div class="facts"><div><b id="done">0 B</b> von <span id="total"></span></div><div id="eta"></div></div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="speed"><svg viewBox="0 0 300 40" preserveAspectRatio="none"><path class="area" id="area"/><path class="line" id="line"/><circle class="dot" id="dot" r="2.6"/></svg></div>
    <div class="now"><span class="nowg" id="nowg"></span><div class="ticker" id="ticker"></div><span class="count" id="count"></span></div>
    <p class="hint" id="hint"></p>
    <div class="foot">

      <button class="btn" id="pause" type="button"><span data-g="IconPause"></span><span>Anhalten</span></button>
      <button class="btn" id="cancel" type="button"><span data-g="IconClose"></span>Abbrechen</button>
      <button class="btn primary" id="bg" type="button"><span data-g="IconCheck"></span><span>Im Hintergrund</span></button>
    </div>
  </section>
</main>

<script>
const GLYPHS = /*GLYPHS*/;
const g = (n) => { const x = GLYPHS[n]; return x ? `<svg viewBox="${x.viewBox}" fill="currentColor" aria-hidden="true">${x.svg}</svg>` : ''; };
const $ = (s) => document.querySelector(s);
document.querySelectorAll('[data-g]').forEach(el => { el.outerHTML = g(el.dataset.g); });

const FILES = [
  ['IconFileVideo', 'Big Buck Bunny (2008).mkv', 1.4e9], ['IconFileVideo', 'Sintel (2010).mkv', 2.2e9], ['IconFileImage', 'IMG_0203.jpg', 5.8e6],
  ['IconFileAudio', 'album.flac', 41e6], ['IconFilePdf', 'Rechnung-Oktober.pdf', 212e3], ['IconFileImage', 'IMG_0204.jpg', 2.8e6],
  ['IconFileVideo', 'Elephants Dream (2006).mkv', 922e6], ['IconFileDoc', 'Bewerbung.docx', 140e3], ['IconArchive', 'Fotos-Urlaub-2026.zip', 842e6],
  ['IconFileImage', 'IMG_0205.jpg', 5.6e6], ['IconDisc', 'debian-13.1.0-amd64-netinst.iso', 754e6], ['IconFileText', 'setup-notes.md', 4e3],
];
const MODES = {
  copy:   { verb: 'Kopieren', g: 'IconCopy', from: ['IconFolderOpen', 'downloads'], to: ['IconFolder', 'backups'], mbs: 112, secs: 30, hint: 'Läuft weiter, auch wenn du das Fenster schließt' },
  move:   { verb: 'Verschieben', g: 'IconMove', from: ['IconFolderOpen', 'downloads'], to: ['IconFolder', 'filme'], mbs: 180, secs: 22, hint: 'Gleiche Platte: Verschieben dauert nur einen Augenblick je Datei' },
  delete: { verb: 'Löschen', g: 'IconTrash', from: ['IconFolderOpen', 'downloads'], to: ['IconTrash', 'Papierkorb'], mbs: 900, secs: 12, hint: 'Alles landet im Papierkorb und lässt sich 30 Tage lang zurückholen' },
  pack:   { verb: 'Verpacken', g: 'IconArchive', from: ['IconFolderOpen', 'fotos'], to: ['IconArchive', 'Urlaub-2026.zip'], mbs: 64, secs: 34, hint: 'Packt mit zip, Kompression normal' },
};
const fmt = (b) => b >= 1e9 ? (b / 1e9).toFixed(2).replace('.', ',') + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1).replace('.', ',') + ' MB' : b >= 1e3 ? Math.round(b / 1e3) + ' KB' : b + ' B';
const dur = (s) => s >= 60 ? `${Math.floor(s / 60)} Min. ${Math.round(s % 60)} s` : `${Math.max(1, Math.round(s))} s`;

let mode = 'copy', st;
$('#modes').innerHTML = Object.entries(MODES).map(([k, m]) => `<button type="button" data-mode="${k}" aria-pressed="${k === mode}">${g(m.g)}${m.verb}</button>`).join('');
$('#modes').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) { mode = b.dataset.mode; start(); } });
$('#again').onclick = () => start();
$('#theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light'; };
$('#pause').onclick = () => { if (st.finished) return start(); st.paused = !st.paused; $('#win').classList.toggle('paused', st.paused); $('#pause').innerHTML = g(st.paused ? 'IconPlay' : 'IconPause') + `<span>${st.paused ? 'Weiter' : 'Anhalten'}</span>`; };
$('#cancel').onclick = () => start();

// The lane bends up between the two places; papers follow it with CSS offset-path.
function route() {
  const f = $('#flight').getBoundingClientRect(), a = $('#from .ic').getBoundingClientRect(), b = $('#to .ic').getBoundingClientRect();
  const x1 = a.left + a.width / 2 - f.left, x2 = b.left + b.width / 2 - f.left, y = f.height / 2;
  const lift = mode === 'delete' ? 10 : 46;
  const d = `M ${x1} ${y} C ${x1 + (x2 - x1) * .3} ${y - lift}, ${x1 + (x2 - x1) * .7} ${y - lift}, ${x2} ${y}`;
  $('#lane').setAttribute('viewBox', `0 0 ${f.width} ${f.height}`);
  $('#route').setAttribute('d', d);
  return { d, x2, y };
}

function launch(file) {
  const r = route(), p = document.createElement('div');
  p.className = 'paper';
  p.innerHTML = g(file[0]);
  p.style.setProperty('--route', `path("${r.d}")`);
  p.style.setProperty('--d', (mode === 'delete' ? 1.1 : 1.6) + 's');
  $('#flight').appendChild(p);
  p.addEventListener('animationend', () => {
    p.remove();
    const to = $('#to .ic');
    to.classList.remove('catch'); void to.offsetWidth; to.classList.add('catch');
    if (mode === 'delete') sparks(r.x2, r.y);
  });
}
function sparks(x, y) {
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('span'), a = Math.random() * Math.PI * 2, d = 18 + Math.random() * 22;
    s.className = 'spark';
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--x', Math.cos(a) * d + 'px'); s.style.setProperty('--y', Math.sin(a) * d + 'px');
    $('#flight').appendChild(s);
    setTimeout(() => s.remove(), 650);
  }
}

function ticker(name) {
  const t = $('#ticker'), old = t.querySelector('span:not(.out)');
  if (old) { old.classList.add('out'); setTimeout(() => old.remove(), 360); }
  const s = document.createElement('span');
  s.textContent = name;
  t.appendChild(s);
}

function start() {
  clearInterval(st?.timer);
  const m = MODES[mode];
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  const w = $('#win');
  w.className = `win mode-${mode}`;
  $('#verb').textContent = m.verb;
  $('#hint').textContent = m.hint;
  $('#from').classList.remove('empty');
  $('#from .ic').style.opacity = '';
  $('#to .ic').style.setProperty('--p', '0%');
  $('#from .ic').innerHTML = g(m.from[0]); $('#from small').textContent = m.from[1];
  $('#to .ic').innerHTML = g(m.to[0]); $('#to small').textContent = m.to[1];
  $('#pause').innerHTML = g('IconPause') + '<span>Anhalten</span>';
  $('#bg').innerHTML = g('IconCheck') + '<span>Im Hintergrund</span>';
  document.querySelectorAll('.paper, .spark').forEach(x => x.remove());
  $('#ticker').innerHTML = '';
  const total = FILES.reduce((a, f) => a + f[2], 0);
  st = { i: 0, done: 0, fileDone: 0, total, paused: false, speeds: [], t: 0 };
  $('#total').textContent = fmt(total);
  next();
  st.timer = setInterval(tick, 120);
}
function next() {
  const f = FILES[st.i];
  $('#nowg').innerHTML = g(f[0]);
  ticker(f[1]);
  $('#of').textContent = `${st.i + 1} von ${FILES.length}`;
  $('#count').textContent = fmt(f[2]);

}
function tick() {
  if (st.paused || st.finished) return;
  const m = MODES[mode];
  st.t++;
  if (st.t % 4 === 1) launch(FILES[Math.min(st.i, FILES.length - 1)]);
  // The speed wanders a little, the way a real disk does.
  const mbs = m.mbs * (0.75 + 0.25 * Math.sin(st.t / 9) + 0.15 * Math.random());
  // The demo squeezes the job into m.secs seconds while showing real speeds.
  const pace = st.total / (m.mbs * 1e6 * m.secs), step = mbs * 1e6 * 0.12 * pace;
  st.speeds.push(mbs); if (st.speeds.length > 60) st.speeds.shift();
  let left = step;
  while (left > 0 && st.i < FILES.length) {
    const need = FILES[st.i][2] - st.fileDone;
    if (left >= need) { left -= need; st.done += need; st.fileDone = 0; st.i++; if (st.i < FILES.length) next(); }
    else { st.fileDone += left; st.done += left; left = 0; }
  }
  const p = Math.min(1, st.done / st.total);
  $('#pct').textContent = Math.floor(p * 100);
  $('#fill').style.width = (p * 100).toFixed(1) + '%';
  $('#to .ic').style.setProperty('--p', (p * 100).toFixed(1) + '%');
  if (mode !== 'copy') $('#from .ic').style.opacity = (1 - p * .55).toFixed(2);
  $('#done').textContent = fmt(st.done);
  const rest = (st.total - st.done) / (mbs * 1e6 * pace);
  $('#eta').textContent = `${mbs.toFixed(0)} MB/s · noch ${dur(rest)}`;
  drawSpeed(m.mbs * 1.4);
  if (st.i >= FILES.length) finish();
}
function drawSpeed(max) {
  const s = st.speeds, n = 60, pts = s.map((v, k) => [(k + n - s.length) / (n - 1) * 300, 38 - Math.min(1, v / max) * 34]);
  if (pts.length < 2) return;
  const line = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
  $('#line').setAttribute('d', line);
  $('#area').setAttribute('d', `${line} L ${pts.at(-1)[0]} 40 L ${pts[0][0]} 40 Z`);
  $('#dot').setAttribute('cx', pts.at(-1)[0]); $('#dot').setAttribute('cy', pts.at(-1)[1]);
}
function finish() {
  st.finished = true;
  clearInterval(st.timer);
  const m = MODES[mode];
  $('#win').classList.add('done');
  if (mode === 'move' || mode === 'delete' || mode === 'pack') $('#from').classList.add('empty');
  $('#pct').textContent = '100';
  $('#eta').textContent = `Fertig, ${fmt(st.total)} in ${dur(st.total / (m.mbs * 1e6))}`;
  $('#of').textContent = `${FILES.length} Dateien`;
  $('#nowg').innerHTML = g('IconCheck');
  ticker({ copy: 'Alles kopiert', move: 'Alles verschoben', delete: 'Alles im Papierkorb', pack: 'Archiv ist fertig' }[mode]);
  $('#bg').innerHTML = g(mode === 'delete' ? 'IconTrash' : 'IconFolderOpen') + `<span>${mode === 'delete' ? 'Papierkorb öffnen' : 'Ordner öffnen'}</span>`;
  $('#pause').innerHTML = g('IconRefresh') + '<span>Nochmal</span>';
}
addEventListener('resize', route);
start();
</script>
<!--PINNWAND-->
</body>
</html>

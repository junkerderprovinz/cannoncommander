  /trash/settings:
    get:
      operationId: trashSettingsGet
      summary: How long the trash keeps entries
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [trash]
    put:
      operationId: trashSettingsPut
      summary: Change how long the trash keeps entries
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashSettings"
      responses:
        "200":
          description: The settings as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [trash]
  /search:
    get:
      operationId: search
      summary: Search below a folder
      description: |
        Finds files and folders below path by name, fields, kind, size and
        age, the way the list's filter and the search window do. The name
        line takes words that match anywhere in a name, patterns with * and
        ? for the whole name, #words for tags and colours, and field tests
        such as breite:>=3840, codec:hevc, interpret:"Queen", größe:>1GB or
        geändert:<30d. Every column name works as a field.

        The search reads the index where it holds the folder and the disk
        otherwise. Field tests on metadata read it for files the cache does
        not know yet for ten seconds, files left after that count as
        pending. Hidden entries and everything inside hidden folders are
        left out unless hidden is true.

        Hits come folders first and in name order. Total counts all of
        them, items holds the first limit. A line with unknown fields finds
        nothing and names them. A search for text inside files is the job
        kind contentSearch with the same criteria and text, its hits arrive
        as search.hits events.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: q
          in: query
          description: The name line, with field tests.
          schema:
            type: string
          example: "*.mkv breite:>=3840"
        - name: hidden
          in: query
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          schema:
            type: string
            enum: [all, dir, img, video, audio, doc, arch]
            default: all
        - name: min
          in: query
          description: Smallest size, such as 300 KB. A number alone counts in MB. Folders count with their total size.
          schema:
            type: string
        - name: max
          in: query
          description: Largest size, written like min.
          schema:
            type: string
        - name: when
          in: query
          description: Changed today, in the last 7, 30 or 365 days, or more than a year ago.
          schema:
            type: string
            enum: [any, "1", "7", "30", "365", old]
            default: any
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 2000
      responses:
        "200":
          description: The hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [search]
  /search/saved:
    get:
      operationId: savedSearchesList
      summary: Saved searches
      description: The own saved searches, oldest first.
      responses:
        "200":
          description: The saved searches.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedSearch"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [search]
    post:
      operationId: savedSearchCreate
      summary: Save a search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchInput"
      responses:
        "201":
          description: The new saved search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: There are 200 saved searches already.
      tags: [search]
  /search/saved/{id}:
    put:
      operationId: savedSearchUpdate
      summary: Change a saved search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchInput"
      responses:
        "200":
          description: The changed saved search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [search]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: savedSearchDelete
      summary: Delete a saved search
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [search]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /tools/compare:
    post:
      operationId: toolsCompare
      summary: Compare two folders
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/sync/plan:
    post:
      operationId: toolsSyncPlan
      summary: Plan a sync between two folders
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/duplicates:
    post:
      operationId: toolsDuplicates
      summary: Find duplicate files
      description: |
        Starts a duplicates job below path, the same as POST /jobs with the
        kind duplicates. Files are grouped by name and size, or by size
        alone, then compared by the start and end of their content and at
        last by a SHA-256 over all of it, so only true copies remain. The
        full read keeps to the speed limit of the job and can be paused.
        The finished job has a Duplicates object as its result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicatesParams"
      responses:
        "202":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [tools]
  /tools/diskusage:
    get:
      operationId: toolsDiskUsage
      summary: Sizes below a folder for the treemap
      description: |
        Measures a folder from the index, or from the disk where the index
        does not hold it: the totals, every entry directly inside with its
        own totals for the tree and the treemap, the kinds of files with
        the extensions that take the most room, and the largest files.
        Entries the user may not see do not count.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: hidden
          in: query
          schema:
            type: boolean
            default: false
        - name: kind
          in: query
          description: Only files of this kind among the largest.
          schema:
            type: string
            enum: [img, video, audio, arch, disk, doc, text, code, file]
        - name: largest
          in: query
          description: How many of the largest files to list.
          schema:
            type: integer
            minimum: 0
            maximum: 2000
            default: 200
      responses:
        "200":
          description: The folder measured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [tools]
  /tools/cleanup/scan:
    post:
      operationId: toolsCleanupScan
      summary: Find files that can go
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/checksum/parse:
    post:
      operationId: toolsChecksumParse
      summary: Read a checksum file
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/arrowloop:
    post:
      operationId: toolsArrowLoop
      summary: Hand a folder to ArrowLoop as a job
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /labels:
    get:
      operationId: labelsGet
      summary: Colours and tags with their names
      description: The colours in their order and every tag in German alphabetical order, each with the number of paths carrying it.
      responses:
        "200":
          description: The colour and tag lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelLists"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [labels]
  /labels/colours:
    put:
      operationId: labelColoursPut
      summary: Rename or recolour the colour labels
      description: |
        Replaces the colour list, in the given order. An entry with an id
        changes that colour, one without is a new colour. Colours left out
        are taken off every path. Sends labels.changed to everyone.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [colours]
              properties:
                colours:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required: [name, hex]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                        description: Empty keeps the name the app gives its own colours.
                      hex:
                        type: string
                        example: "#2ec4b6"
      responses:
        "200":
          description: The new lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelLists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
  /labels/tags:
    put:
      operationId: labelTagsPut
      summary: Change the list of tags
      description: |
        Replaces the tag list. An entry with from renames that tag on every
        path, and two tags renamed to the same name become one. An entry
        without from is a tag no file needs to carry yet. Tags left out are
        taken off every path. Sends labels.changed to everyone.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [name]
                    properties:
                      from:
                        type: string
                      name:
                        type: string
      responses:
        "200":
          description: The new lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelLists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
  /labels/items:
    get:
      operationId: labelItemsGet
      summary: Labels of the entries in a folder
      description: |
        The labelled entries of a folder the user may see, keyed by name.
        With deep=true everything below the folder, keyed by the path
        relative to it, for the flat view and search results.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: deep
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The labels.
          content:
            application/json:
              schema:
                type: object
                required: [path, items]
                properties:
                  path:
                    type: string
                  items:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/Label"
                example:
                  path: /mnt/user/dokumente
                  items:
                    Mietvertrag.pdf: {colour: red, tags: [wichtig]}
                    Rechnung-Oktober.pdf: {tags: [Steuer]}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
    put:
      operationId: labelItemsPut
      summary: Set colour and tags on paths
      description: |
        Changes the labels of up to 10000 paths at once. colour sets the
        colour, an empty colour clears it. tags replaces the tags, add and
        remove adjust them. Fields left out stay as they are. Needs the
        right to change each path, so read only places carry no labels.
        Sends labels.changed to the watchers of each folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: string
                colour:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                add:
                  type: array
                  items:
                    type: string
                remove:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The labels the paths carry after the change, keyed by path. An empty object means no label.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
  /me/prefs:
    get:
      operationId: prefsGet
      summary: Own settings
      description: |
        Returns the settings as one flat object, as the interface keeps
        them. Settings never saved are left out, so the client keeps its
        own defaults for them. With a device the device settings (dual,
        side, fkeys, colWidths) of that device lie on top of the others.
      parameters:
        - $ref: "#/components/parameters/Device"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    put:
      operationId: prefsPut
      summary: Save own settings
      description: |
        Replaces the settings with the given object. With a device the
        device settings are stored for that device and the rest for the
        user. Without one everything is stored for the user, and the user's
        values serve devices that have none of their own. Known settings
        have to keep their JSON type. Sends prefs.changed to the user.
      parameters:
        - $ref: "#/components/parameters/Device"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prefs"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The settings are larger than 256 KiB.
      tags: [prefs]
  /me/bookmarks:
    get:
      operationId: bookmarksGet
      summary: Pinned folders
      description: |
        The pinned folders in their order. A user who never saved any gets
        the usual shares that exist and that the user may open.
      responses:
        "200":
          description: The bookmarks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    put:
      operationId: bookmarksPut
      summary: Save pinned folders
      description: Replaces the list. Paths have to be unique and may not point into an archive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkList"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The same path is pinned twice.
      tags: [prefs]
  /me/profiles:
    get:
      operationId: profilesList
      summary: Saved panel profiles
      responses:
        "200":
          description: The profiles, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    post:
      operationId: profileCreate
      summary: Save a panel profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: The new profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: There are 100 profiles already.
      tags: [prefs]
  /me/profiles/{id}:
    put:
      operationId: profileUpdate
      summary: Change a panel profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: The changed profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":

openapi: 3.1.0
info:
  title: CannonCommander API
  version: "1"
  description: |
    Every path in this API is an absolute path as Unraid sees it, for example
    /mnt/user/filme. A path into an archive carries "::" after the archive
    name: /mnt/user/downloads/fotos.zip::/Strand/IMG_0101.jpg.

    Errors come as application/problem+json. Operations that are part of the
    contract but not built yet answer 501.

    Server events arrive on GET /events. See the Event schema for their
    types.
servers:
  - url: /api/v1
security:
  - bearer: []
  - cookie: []
tags:
  - name: fs
    description: Reading files and folders.
  - name: fileops
    description: Creating, renaming and linking, uploads, and the check before a transfer.
  - name: jobs
    description: Long running tasks such as copy, move, pack and checksum.
  - name: undo
    description: Taking back the last file operations.
  - name: trash
    description: Deleted files waiting in the trash.
  - name: search
    description: Search by name pattern, fields and content.
  - name: tools
    description: Compare, sync, duplicates, disk usage, clean up and checksums.
  - name: labels
    description: Colour labels and tags on paths.
  - name: prefs
    description: Settings, bookmarks, profiles and folder history of the own account.
  - name: accounts
    description: The own account, and users, groups, rules and activity for admins.
  - name: shares
    description: Share links and the public share pages.
  - name: unraid
    description: Array state, file placement and the Unraid tools.
  - name: remotes
    description: rclone remotes mounted below /mnt/remotes.
  - name: system
    description: Server state and the settings only admins change.
  - name: events
    description: The server event stream and the folders a client watches.
paths:
  /fs/list:
    get:
      operationId: fsList
      summary: List a folder
      description: |
        Lists the entries of a folder in name order. The folders / and /mnt
        are virtual and list the sources below them. Entries the user may
        not see are left out. Folders carry their entry count and total size
        where the index knows them. The ETag follows the entries only, so a
        change in free space alone still answers 304.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The folder and its entries.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsList"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/tree:
    get:
      operationId: fsTree
      summary: Subfolders for the folder tree
      description: |
        Returns the visible subfolders of one folder, one level deep. The
        tree asks again when a folder is opened. Folders where a source is
        mounted carry its name and fill level, folders where an rclone
        remote is mounted carry the remote.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The folder with its subfolders.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsTree"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/stat:
    get:
      operationId: fsStat
      summary: Details of one path
      description: |
        The same fields as a listing row, for one path. A folder also gets
        the number of files and folders anywhere below it, as far as the
        index knows them.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsStat"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/meta:
    post:
      operationId: fsMeta
      summary: Metadata columns for many paths
      description: Takes the visible rows and the wanted columns, returns the values from the metadata cache.
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/raw:
    get:
      operationId: fsRaw
      summary: File content, with range requests
      description: |
        Sends the file as it is, with Range, If-Range and conditional
        requests. Needs the download right. Pages and drawings come with a
        sandbox policy, so their scripts do not run.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: download
          in: query
          description: Ask the browser to save the file instead of showing it.
          schema:
            type: boolean
      responses:
        "200":
          description: The whole file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range.
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The range lies outside the file.
      tags: [fs]
  /fs/thumb:
    get:
      operationId: fsThumb
      summary: Thumbnail of a file or folder picture
      description: |
        A small picture of an image, video, document or album cover. For a
        folder it is the folder's poster.jpg, folder.jpg or cover.jpg. A
        client that adds the file's mtime as v may cache the answer for
        good.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: size
          in: query
          schema:
            type: string
            enum: [small, large]
            default: small
        - name: v
          in: query
          description: Any value that changes with the file, such as its mtime.
          schema:
            type: string
      responses:
        "200":
          description: The picture.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The path does not exist or has no thumbnail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fs]
  /fs/page:
    get:
      operationId: fsPage
      summary: One page of a PDF or office file as an image
      parameters:
        - $ref: "#/components/parameters/Path"
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/text:
    get:
      operationId: fsText
      summary: Text content with encoding detection
      description: |
        Reads the start of a text file and decodes it. The encoding comes
        from a byte order mark, then from valid UTF-8, and falls back to
        Windows-1252. Needs the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: max
          in: query
          description: Bytes to read at most.
          schema:
            type: integer
            minimum: 1
            maximum: 16777216
            default: 1048576
      responses:
        "200":
          description: The text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsText"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          description: The file holds binary data.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fs]
  /fs/hex:
    get:
      operationId: fsHex
      summary: A byte range for the hex view
      description: Needs the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: length
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 65536
            default: 4096
      responses:
        "200":
          description: The bytes. Fewer than asked for at the end of the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsHex"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/file:
    get:
      operationId: fsFileGet
      summary: File content for the editor
      parameters:
        - $ref: "#/components/parameters/Path"
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: fsFilePut
      summary: Save a file from the editor
      parameters:
        - $ref: "#/components/parameters/Path"
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/archive-stream:
    post:
      operationId: fsArchiveStream
      summary: Download several paths as one archive
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/mkdir:
    post:
      operationId: fsMkdir
      summary: Create a folder
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/touch:
    post:
      operationId: fsTouch
      summary: Create an empty file or update its time
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/rename:
    post:
      operationId: fsRename
      summary: Rename one entry
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/rename/batch:
    post:
      operationId: fsRenameBatch
      summary: Rename many entries with a pattern
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/link:
    post:
      operationId: fsLink
      summary: Create a symbolic or hard link
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/attrs:
    patch:
      operationId: fsAttrs
      summary: Change mode, owner or times
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /ops/preflight:
    post:
      operationId: opsPreflight
      summary: Check a copy or move before it starts
      description: Reports conflicts, missing rights and free space, so the conflict dialog can ask before the job runs.
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /uploads:
    post:
      operationId: uploadCreate
      summary: Start an upload
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /uploads/{id}:
    get:
      operationId: uploadGet
      summary: State of an upload, for resuming
      tags: [fileops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: uploadChunk
      summary: Send the next chunk
      tags: [fileops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: uploadCancel
      summary: Cancel an upload
      tags: [fileops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs:
    get:
      operationId: jobsList
      summary: List jobs
      tags: [jobs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: jobCreate
      summary: Start a job
      description: |
        Kinds: copy, move, delete, trash, restore, emptyTrash, pack, unpack,
        testArchive, checksum, verify, split, combine, attrsRecursive,
        fixPerms, sync, gather, scatter, contentSearch, duplicates,
        fetchUrl, reindex.
      tags: [jobs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs/settings:
    get:
      operationId: jobSettingsGet
      summary: Queue and speed settings
      tags: [jobs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: jobSettingsPut
      summary: Change queue and speed settings
      tags: [jobs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs/{id}:
    get:
      operationId: jobGet
      summary: One job with its items
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: jobRemove
      summary: Remove a finished job from the list
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs/{id}/pause:
    post:
      operationId: jobPause
      summary: Pause a job
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs/{id}/resume:
    post:
      operationId: jobResume
      summary: Resume a paused job
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs/{id}/cancel:
    post:
      operationId: jobCancel
      summary: Cancel a job
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs/{id}/retry:
    post:
      operationId: jobRetry
      summary: Retry the failed items of a job
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs/{id}/decide:
    post:
      operationId: jobDecide
      summary: Answer a conflict the job is waiting on
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /undo:
    get:
      operationId: undoList
      summary: Steps that can be taken back
      tags: [undo]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: undoLast
      summary: Take back the latest step
      tags: [undo]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /trash:
    get:
      operationId: trashList
      summary: List the trash
      tags: [trash]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /trash/restore:
    post:
      operationId: trashRestore
      summary: Put entries back where they came from
      tags: [trash]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /trash/empty:
    post:
      operationId: trashEmpty
      summary: Empty the trash
      tags: [trash]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /trash/{id}:
    delete:
      operationId: trashDelete
      summary: Delete one entry for good
      tags: [trash]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /search:
    get:
      operationId: search
      summary: Search below a folder
      tags: [search]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /search/saved:
    get:
      operationId: savedSearchesList
      summary: Saved searches
      tags: [search]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: savedSearchCreate
      summary: Save a search
      tags: [search]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /search/saved/{id}:
    put:
      operationId: savedSearchUpdate
      summary: Change a saved search
      tags: [search]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: savedSearchDelete
      summary: Delete a saved search
      tags: [search]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/compare:
    post:
      operationId: toolsCompare
      summary: Compare two folders
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/sync/plan:
    post:
      operationId: toolsSyncPlan
      summary: Plan a sync between two folders
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/duplicates:
    post:
      operationId: toolsDuplicates
      summary: Find duplicate files
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/diskusage:
    get:
      operationId: toolsDiskUsage
      summary: Sizes below a folder for the treemap
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/cleanup/scan:
    post:
      operationId: toolsCleanupScan
      summary: Find files that can go
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/checksum/parse:
    post:
      operationId: toolsChecksumParse
      summary: Read a checksum file
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/arrowloop:
    post:
      operationId: toolsArrowLoop
      summary: Hand a folder to ArrowLoop as a job
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /labels:
    get:
      operationId: labelsGet
      summary: Colours and tags with their names
      tags: [labels]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /labels/colours:
    put:
      operationId: labelColoursPut
      summary: Rename or recolour the colour labels
      tags: [labels]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /labels/tags:
    put:
      operationId: labelTagsPut
      summary: Change the list of tags
      tags: [labels]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /labels/items:
    get:
      operationId: labelItemsGet
      summary: Labels of the entries in a folder
      tags: [labels]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: labelItemsPut
      summary: Set colour and tags on paths
      tags: [labels]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me/prefs:
    get:
      operationId: prefsGet
      summary: Own settings
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: prefsPut
      summary: Save own settings
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me/bookmarks:
    get:
      operationId: bookmarksGet
      summary: Pinned folders
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: bookmarksPut
      summary: Save pinned folders
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me/profiles:
    get:
      operationId: profilesList
      summary: Saved panel profiles
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: profileCreate
      summary: Save a panel profile
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me/profiles/{id}:
    put:
      operationId: profileUpdate
      summary: Change a panel profile
      tags: [prefs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: profileDelete
      summary: Delete a panel profile
      tags: [prefs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me/rename-presets:
    get:
      operationId: renamePresetsGet
      summary: Saved rename patterns
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: renamePresetsPut
      summary: Save rename patterns
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me/frequent:
    get:
      operationId: frequentGet
      summary: Often visited folders
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: frequentVisit
      summary: Count a visit to a folder
      tags: [prefs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me:
    get:
      operationId: meGet
      summary: The logged in user
      tags: [accounts]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me/password:
    put:
      operationId: mePassword
      summary: Change the own password, which ends the other sessions
      tags: [accounts]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me/sessions:
    get:
      operationId: sessionsList
      summary: Open sessions
      tags: [accounts]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /me/sessions/{id}:
    delete:
      operationId: sessionEnd
      summary: End a session
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

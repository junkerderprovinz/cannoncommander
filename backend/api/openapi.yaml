      summary: One remote
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: remoteUpdate
      summary: Change a remote
      x-access: admin
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: remoteDelete
      summary: Remove a remote
      x-access: admin
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /remotes/{name}/mount:
    post:
      operationId: remoteMount
      summary: Mount a remote
      x-access: admin
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /remotes/{name}/unmount:
    post:
      operationId: remoteUnmount
      summary: Unmount a remote
      x-access: admin
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /system:
    get:
      operationId: systemGet
      summary: Version, uptime and available features
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /admin/sources:
    get:
      operationId: sourcesGet
      summary: Configured sources
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: sourcesPut
      summary: Save sources
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /admin/index:
    get:
      operationId: indexState
      summary: State of the index per source
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: indexRebuild
      summary: Rebuild the index of a source
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /admin/integrations/test:
    post:
      operationId: integrationsTest
      summary: Try an integration such as an office server
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /admin/app:
    get:
      operationId: appSettingsGet
      summary: Server wide settings
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: appSettingsPut
      summary: Save server wide settings
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /events:
    get:
      operationId: eventsStream
      summary: Server events as SSE
      description: |
        Opens a text/event-stream. Each frame has "id:", "event:" and a
        "data:" line holding an Event. Heartbeats come every 25 seconds
        without an id. After a reconnect with Last-Event-ID the missed
        events follow first, or a single resync event when they are gone.
      parameters:
        - name: clientId
          in: query
          description: Chosen by the client once per tab, it ties the watched folders to this stream. Without it the stream carries only the events that are not about watched folders.
          schema:
            type: string
            maxLength: 64
        - name: lastEventId
          in: query
          description: Same as the Last-Event-ID header, for clients that cannot set headers.
          schema:
            type: integer
            format: int64
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [events]
  /events/watch:
    put:
      operationId: eventsWatch
      summary: Set the folders a client watches
      description: |
        Replaces the watched folders of a client. For each of them the stream
        delivers fs.changed with topic fs:<path>. Folders stay watched for two
        minutes after the stream closes, so a reconnect keeps them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRequest"
      responses:
        "200":
          description: The watched folders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [events]
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token or a session token.
    cookie:
      type: apiKey
      in: cookie
      name: filebrowser_quantum_jwt
      description: The session cookie the web app gets on login.
  parameters:
    Path:
      name: path
      in: query
      required: true
      description: Absolute path.
      schema:
        type: string
        example: /mnt/user/filme
    Device:
      name: device
      in: query
      description: An id the client picks once per device and keeps, up to 64 letters, digits, - and _.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
  responses:
    NotImplemented:
      description: Part of the contract, not built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed for this user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The path does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FsChanged:
      description: The entry as it is now, and the undo step for it.
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path:
                type: string
              created:
                type: boolean
              undo:
                type: string
                description: Id of the undo step, for POST /undo.
    JobAnswer:
      description: The job after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Job"
    StateConflict:
      description: The request does not fit the current state, for example a name that exists already.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UndoTaken:
      description: The step that was taken back, and the job doing it.
      content:
        application/json:
          schema:
            type: object
            required: [step]
            properties:
              step:
                $ref: "#/components/schemas/UndoStep"
              job:
                $ref: "#/components/schemas/Job"
    ToolFailed:
      description: The tool cannot do it, the detail says why, such as a file too big, a missing password or ArrowLoop not answering.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Event:
      type: object
      description: |
        One server event. The SSE frame carries the type as "event:" and the
        id as "id:", and this object as "data:". Reconnect with the
        Last-Event-ID header (or lastEventId query) to receive what was
        missed. A resync event means the gap was too large and the client
        should reload its state.
      required: [id, type, time]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - heartbeat
            - resync
            - notify
            - job.created
            - job.progress
            - job.state
            - job.conflict
            - job.done
            - fs.changed
            - trash.changed
            - labels.changed
            - undo.changed
            - share.opened
            - unraid.parity
            - unraid.spin
            - index.progress
            - search.hits
            - prefs.changed
        topic:
          type: string
          description: Set for events that only subscribers see, for example fs:/mnt/user/filme.
        time:
          type: string
          format: date-time
        data:
          description: Payload, its shape depends on the type.
    FsItem:
      type: object
      required: [name, dir, size, mtime, mode]
      properties:
        name:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
          description: Bytes. For a folder the total size from the index, 0 while the index has not measured it.
        mtime:
          type: string
          format: date-time
          description: Modification time in UTC with milliseconds.
        btime:
          type: string
          format: date-time
          description: Creation time, where the file system records it.
        mode:
          type: string
          description: Permission bits in octal, with setuid, setgid and sticky in front.
          example: "0664"
        owner:
          type: string
          description: User name, or the number when the container does not know it.
        group:
          type: string
        uid:
          type: integer
        gid:
          type: integer
        ino:
          type: integer
          format: int64
          description: Inode number. Missing below /mnt/user in a listing, because the share reports numbers of its own. fs/stat gives the one on the disk.
        nlink:
          type: integer
          format: int64
          description: Number of hard links.
        hidden:
          type: boolean
          description: The name starts with a dot.
        link:
          type: string
          description: Target of a symbolic link.
        items:
          type: integer
          description: Entries directly inside a folder. Missing when neither the index nor a quick look could count them.
        format:
          type: string
          description: Format group of a file, an id from formats.json such as video or archive.
        picture:
          type: string
          description: Name of the folder's poster.jpg, folder.jpg or cover.jpg, for the card views.
        pool:
          type: string
          description: Under /mnt/user, the Unraid pool that holds the entry, such as cache.
        remote:
          type: string
          description: The rclone remote mounted at this folder.
    Volume:
      type: object
      required: [path, free, total]
      properties:
        path:
          type: string
          description: Where the source is mounted.
        label:
          type: string
          description: Name of the source.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FsList:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsItem"
        volume:
          $ref: "#/components/schemas/Volume"
          description: Missing for the virtual folders / and /mnt.
    FsTreeItem:
      type: object
      required: [name, path, hasDirs]
      properties:
        name:
          type: string
        path:
          type: string
        hasDirs:
          type: boolean
          description: The folder has visible subfolders.
        label:
          type: string
          description: Name of the source mounted here.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        remote:
          type: string
          description: The rclone remote mounted here.
    FsTree:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsTreeItem"
    FsStat:
      allOf:
        - $ref: "#/components/schemas/FsItem"
        - type: object
          required: [path]
          properties:
            path:
              type: string
            files:
              type: integer
              format: int64
              description: Files anywhere below a folder.
            dirs:
              type: integer
              format: int64
              description: Folders anywhere below a folder.
            devices:
              type: array
              items:
                type: string
              description: Below /mnt/user, the disks and pools that hold the path, such as cache or disk2.
            volume:
              $ref: "#/components/schemas/Volume"
    FsText:
      type: object
      required: [path, size, mtime, encoding, text]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        encoding:
          type: string
          enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1252]
        eol:
          type: string
          enum: [lf, crlf, cr, mixed]
          description: Missing for text without line breaks.
        text:
          type: string
        truncated:
          type: boolean
          description: The file goes on after max bytes.
    FsHex:
      type: object
      required: [path, size, offset, data]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
          description: Size of the whole file.
        offset:
          type: integer
          format: int64
        data:
          type: string
          format: byte
          description: The bytes, base64.
    PermsParams:
      type: object
      description: Params of the job kind fixPerms. Admins only.
      required: [path]
      properties:
        path:
          type: string
    PathBody:
      type: object
      required: [path]
      properties:
        path:
          type: string
    PathsParams:
      type: object
      description: Params of the job kinds delete and trash.
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
    TransferParams:
      type: object
      description: Params of the job kinds copy and move.
      required: [sources, dest]
      properties:
        sources:
          type: array
          description: Files and folders, also from different folders.
          items:
            type: string
        dest:
          type: string
          description: The folder they go into.
        names:
          type: array
          description: Names at the target, in the order of the sources.
          items:
            type: string
        rule:
          type: string
          enum: [ask, skip, replace, both, newer]
          default: ask
          description: |
            Answers every conflict without a decision. ask waits for
            POST /jobs/{id}/decide after job.conflict. replace moves the
            old entry to the trash, both gives the new one a number,
            newer replaces only older files. Folders on both sides are
            merged for replace and newer.
        decisions:
          type: object
          description: Answers keyed by conflict key, for example from the preflight.
          additionalProperties:
            type: string
            enum: [skip, replace, both, newer]
        verify:
          type: boolean
          description: Read every copied file back and compare checksums.
        keepAttrs:
          type: boolean
          default: true
          description: Keep owner, mode and times. Without it new entries belong to the user the server runs as.
    Preflight:
      type: object
      required: [dest, count, bytes, files, conflicts, sameDevice, big, parityBusy]
      properties:
        dest:
          type: string
        count:
          type: integer
        bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/JobConflict"
        sameDevice:
          type: boolean
          description: A move that only renames and needs no free space.
        space:
          $ref: "#/components/schemas/Space"
        big:
          type: boolean
          description: From 2 GiB on the job waits for a running parity check.
        parityBusy:
          type: boolean
          description: Unraid checks parity right now. For small jobs the client asks whether to wait.
        unraid:
          $ref: "#/components/schemas/UnraidTransferReport"
          description: Trap, broken hard links, space after the allocation rules and disks that wake up. Missing where Unraid has nothing to say.
    Space:
      type: object
      required: [free, need, enough]
      properties:
        free:
          type: integer
          format: int64
        need:
          type: integer
          format: int64
        enough:
          type: boolean
    JobCreate:
      type: object
      required: [kind, params]
      properties:
        kind:
          type: string
          example: copy
        params:
          description: |
            Depends on the kind. copy and move take TransferParams, delete
            and trash take PathsParams, fixPerms takes PermsParams.
          oneOf:
            - $ref: "#/components/schemas/TransferParams"
            - $ref: "#/components/schemas/PathsParams"
            - $ref: "#/components/schemas/PermsParams"
        cap:
          type: integer
          format: int64
          description: Bytes per second for this job, 0 for no limit.
        waitForParity:
          type: boolean
          description: Wait for a running parity check even if the job is small.
    JobSettings:
      type: object
      required: [mode, cap, parityWait, notifyUnraid, notifyAfter]
      properties:
        mode:
          type: string
          enum: [serial, parallel]
          description: serial runs one job at a time in queue order, parallel lets them share the speed.
        cap:
          type: integer
          format: int64
          description: Bytes per second for all jobs together, 0 for no limit.
        parityWait:
          type: boolean
          description: Copies and moves from 2 GiB on wait while Unraid checks parity or rebuilds.
        notifyUnraid:
          type: boolean
          description: Send a notice to Unraid when a long job ends. Needs write access to Unraid in the template.
        notifyAfter:
          type: integer
          format: int64
          description: Seconds a job has to run before its end is worth a notice.
          example: 60
    Job:
      type: object
      required: [id, kind, owner, state, position, name, count, totalBytes, doneBytes, totalFiles, doneFiles, rate, left, cap, waitForParity, failedItems, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
        owner:
          type: string
        state:
          type: string
          enum: [queued, running, paused, asking, done, failed, cancelled]
        reason:
          type: string
          enum: [parity]
          description: Why a queued job does not run. Missing while it only waits for its turn.
        place:
          type: integer
          description: Place in the waiting line, from 1.
        position:
          type: integer
        name:
          type: string
          description: Name of the first item.
        count:
          type: integer
          description: Number of items.
        dest:
          type: string
        totalBytes:
          type: integer
          format: int64
        doneBytes:
          type: integer
          format: int64
        totalFiles:
          type: integer
          format: int64
          description: Entries below and at the items, folders included.
        doneFiles:
          type: integer
          format: int64
        rate:
          type: number
          description: Bytes per second right now.
        left:
          type: [number, "null"]
          description: Seconds left at the current rate.
        current:
          type: string
          description: The entry in work, relative to the items.
        cap:
          type: integer
          format: int64
        waitForParity:
          type: boolean
        failedItems:
          type: integer
        error:
          type: string
        conflict:
          $ref: "#/components/schemas/JobConflict"
        undo:
          type: string
          description: Id of the undo step that takes the finished job back.
        result:
          description: What the job found out, for kinds that report more than done or failed.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Only in GET /jobs/{id}.
          items:
            $ref: "#/components/schemas/JobItem"
    JobItem:
      type: object
      required: [seq, path, state, bytes, files]
      properties:
        seq:
          type: integer
        path:
          type: string
        name:
          type: string
          description: Name at the target when it differs.
        state:
          type: string
          enum: [pending, running, done, skipped, failed]
        bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        error:
          type: string
    JobConflict:
      type: object
      description: A name that exists at the target already. Also the data of job.conflict, together with the job id.
      required: [key, source, target]
      properties:
        key:
          type: string
          description: Path relative to the target folder. An answer for a folder covers everything inside it.
        source:
          $ref: "#/components/schemas/ConflictSide"
        target:
          $ref: "#/components/schemas/ConflictSide"
        newer:
          type: string
          enum: [source, target]
          description: The side changed more than a second later. Missing when both are equally old.
    ConflictSide:
      type: object
      required: [path, dir, size, mtime]
      properties:
        path:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        entries:
          type: integer
          description: Entries directly inside a folder.
    JobProgress:
      type: object
      description: Data of job.progress.
      required: [id, totalBytes, doneBytes, totalFiles, doneFiles, rate, left]
      properties:
        id:
          type: string
        totalBytes:
          type: integer
          format: int64
        doneBytes:
          type: integer
          format: int64
        totalFiles:
          type: integer
          format: int64
        doneFiles:
          type: integer
          format: int64
        rate:
          type: number
        left:
          type: [number, "null"]
        current:
          type: string
    UndoStep:
      type: object
      required: [id, kind, at, name, count]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [rename, mkdir, touch, copy, move, trash]
        at:
          type: string
          format: date-time
        name:
          type: string
          description: The first name the step touched, the old one for a rename.
        count:
          type: integer
        path:
          type: string
          description: The folder the step happened in.
        to:
          type: string
          description: The new name of a rename, or the folder a copy or move went to.
    TrashIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
    TrashSettings:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 3650
          example: 30
    TrashItem:
      type: object
      required: [id, name, origin, from, dir, size, files, by, deletedAt, expiresAt]
      properties:
        id:
          type: string
        name:
          type: string
        origin:
          type: string
          description: Where the entry was.
        from:
          type: string
          description: The folder it was in.
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
          description: Entries at and below it, folders included.
        by:
          type: string
          description: Who deleted it.
        deletedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When it goes away for good.
    SavedSearchInput:
      type: object
      required: [name, query]
      properties:
        name:
          type: string
        query:
          type: object
          description: |
            The search as the search window sends it, stored as given. When
            it has a field in, that has to be a folder path.
          additionalProperties: true
          example: {text: "", in: /mnt/user, name: "*.iso *.img", min: 1 GB, when: any, type: all, hidden: false}
    SavedSearch:
      allOf:
        - $ref: "#/components/schemas/SavedSearchInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    RenameMask:
      type: object
      required: [name, ext]
      description: |
        Tokens: [N] name, [E] ending, [D] date, [P] folder, [C] counter, [C3]
        with three digits, [A] taken, [K] camera, [I] artist, [T] title, [R]
        resolution, [S2] season and [F2] episode.
      properties:
        name:
          type: string
          example: "[A]_[C3]"
        ext:
          type: string
          example: "[E]"
        start:
          type: integer
        step:
          type: integer
        find:
          type: string
        repl:
          type: string
        regex:
          type: boolean
        case:
          type: string
          enum: [keep, lower, upper, title]
    RenameBatch:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
        mask:
          $ref: "#/components/schemas/RenameMask"
        names:
          type: array
          items:
            type: string
        dryRun:
          type: boolean
    RenameBatchResult:
      type: object
      required: [rows, changed, errors, done]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [path, old, new]
            properties:
              path:
                type: string
              old:
                type: string
              new:
                type: string
              error:
                type: string
                enum: [empty, invalid, exists, duplicate]
              missing:
                type: array
                items:
                  type: string
        changed:
          type: integer
        errors:
          type: integer
        done:
          type: boolean
        undo:
          type: string
    CompareRequest:
      type: object
      required: [left, right]
      properties:
        left:
          type: string
        right:
          type: string
        content:
          type: boolean
        recursive:
          type: boolean
        top:
          type: boolean
        hidden:
          type: boolean
    CompareSide:
      type: object
      required: [dir, size, mtime]
      properties:
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
    Compared:
      type: object
      required: [rel, name, state]
      properties:
        rel:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [same, newerL, newerR, differ, onlyL, onlyR]
        left:
          $ref: "#/components/schemas/CompareSide"
        right:
          $ref: "#/components/schemas/CompareSide"
    SyncStep:
      type: object
      required: [key, rel, act, to, size]
      properties:
        key:
          type: string
        rel:
          type: string
        act:
          type: string
          enum: [copy, replace, delete]
        to:
          type: string
          enum: [L, R]
        dir:
          type: boolean
        "off":
          type: boolean
        why:
          type: string
          enum: [rightNewer, leftNewer, sameAge]
        size:
          type: integer
          format: int64
    Diff:
      type: object
      required: [left, right, binary, rows, hunks]
      properties:
        left:
          $ref: "#/components/schemas/DiffSide"
        right:
          $ref: "#/components/schemas/DiffSide"
        binary:
          type: boolean
        hunks:
          type: integer
        rows:
          type: array
          items:
            type: object
            required: [t]
            properties:
              t:
                type: string
                enum: [eq, chg, del, add]
              l:
                type: integer
                nullable: true
              r:
                type: integer
                nullable: true
    DiffSide:
      type: object
      required: [path, size, mtime, lines]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        lines:
          type: array
          items:
            type: string
    CleanupScan:
      type: object
      required: [path, scanned, groups]
      properties:
        path:
          type: string
        scanned:
          type: integer
        capped:
          type: boolean
        groups:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                note:
                  type: string
                  description: Size of a leftover, link target, the real kind or the reason for a bad name.
                size:
                  type: integer
                  format: int64
                to:
                  type: string
    SumLine:
      type: object
      required: [name]
      properties:
        name:
          type: string
        hash:
          type: string
        algo:
          type: string
          enum: [md5, sha1, sha256, sha512, b3]
        bad:
          type: string
          description: A line that is neither GNU nor BSD style.
    Pack:
      type: object
      required: [sources, dest, name, format]
      description: Params of pack. The sources lie in one folder.
      properties:
        sources:
          type: array
          items:
            type: string
        dest:
          type: string
        name:
          type: string
          description: Without the ending.
        format:
          type: string
          enum: [zip, tar.gz, tar.zst, 7z, rar]
        level:
          type: integer
          minimum: 0
          maximum: 9
        password:
          type: string
          description: AES-256 for zip, 7z and rar.
    Unpack:
      type: object
      required: [archives, dest]
      description: Params of unpack. An archive path with a folder after "::" unpacks only that folder, and items picks names in it.
      properties:
        archives:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            type: string
        dest:
          type: string
        own:
          type: boolean
          description: A folder named after each archive.
        clash:
          type: string
          enum: [skip, both, replace]
        password:
          type: string
        charset:
          type: string
          description: Encoding of zip names without the UTF-8 flag.
    TestArchive:
      type: object
      required: [paths]
      description: Params of testArchive. Every member is read to its end, nothing is unpacked.
      properties:
        paths:
          type: array
          items:
            type: string
        password:
          type: string
    Checksum:
      type: object
      required: [sources]
      description: Params of checksum. Lists are left out of a folder.
      properties:
        sources:
          type: array
          items:
            type: string
        algo:
          type: string
          enum: [md5, sha1, sha256, sha512, b3]
        save:
          type: string
          description: The sum file to write, names relative to its folder.
        bsd:
          type: boolean
    Verify:
      type: object
      description: Params of verify, a sum file or pasted lines with their folder. Line states are ok, mismatch, missing and bad.
      properties:
        file:
          type: string
        text:
          type: string
        dir:
          type: string
    Split:
      type: object
      required: [path, dest, partSize]
      description: Params of split. Parts are named file.001 and on.
      properties:
        path:
          type: string
        dest:
          type: string
        partSize:
          type: integer
          format: int64
        sum:
          type: boolean
          description: Lay a .sha256 of the whole file beside the parts.
    Combine:
      type: object
      required: [path, dest]
      description: Params of combine. Path is any of the parts.
      properties:
        path:
          type: string
        name:
          type: string
        dest:
          type: string
        check:
          type: boolean
        drop:
          type: boolean
          description: Move the parts to the trash once the result is complete.
    Sync:
      type: object
      required: [left, right, steps]
      description: Params of sync, the steps of the plan that are switched on. Deleted entries go to the trash.
      properties:
        left:
          type: string
        right:
          type: string
        steps:
          type: array
          items:
            type: object
            required: [rel, act, to]
            properties:
              rel:
                type: string
              act:
                type: string
                enum: [copy, replace, delete]
              to:
                type: string
                enum: [L, R]
    FetchUrl:
      type: object
      required: [url, dest]
      description: Params of fetchUrl. Addresses in the local network and on the server itself are refused, after every redirect as well.
      properties:
        url:
          type: string
        name:
          type: string
        dest:
          type: string
    Label:
      type: object
      properties:
        colour:
          type: string
          description: Id of the colour.
        tags:
          type: array
          items:
            type: string
    LabelLists:
      type: object
      required: [colours, tags]
      properties:
        colours:
          type: array
          items:
            type: object
            required: [id, name, hex, count]
            properties:
              id:
                type: string
                example: red
              name:
                type: string
                description: Empty for the colours the app comes with, which the client names in its language.
              hex:
                type: string
                example: "#ff6b72"
              count:
                type: integer
        tags:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name:
                type: string
              count:
                type: integer
    LabelsChanged:
      type: object
      description: |
        Payload of labels.changed. Kind colours or tags reaches everyone,
        kind items reaches the watchers of the folder in path.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [colours, tags, items]
        path:
          type: string
    Prefs:
      type: object
      description: Settings by name. The interface defines the names, see DEFAULT_PREFS in the frontend.
      additionalProperties: true
    Bookmark:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
        g:
          type: string
          description: Glyph name, for example IconDownload.
    BookmarkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Bookmark"
    ProfileInput:
      type: object
      required: [name, panels]
      properties:
        name:
          type: string
        dual:
          type: boolean
        columns:
          type: array
          items:
            type: string
        panels:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [cur, tabs]
            properties:
              cur:
                type: integer
                description: Index of the active tab.
              tabs:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: string
                  description: Folder of the tab.
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    RenamePresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name, options]
            properties:
              name:
                type: string
              options:
                type: object
                description: The fields of the multi rename window.
                properties:
                  name:
                    type: string
                    example: "[A]_[C3]"
                  ext:
                    type: string
                    example: "[E]"
                  find:
                    type: string
                  repl:
                    type: string
                  regex:
                    type: boolean
                  case:
                    type: string
                    enum: [keep, lower, upper, title]
    FrequentFolder:
      type: object
      required: [path, visits, last, rank]
      properties:
        path:
          type: string
        visits:
          type: integer
        last:
          type: string
          format: date-time
        rank:
          type: number
    PrefsChanged:
      type: object
      description: Payload of prefs.changed, sent only to the user it concerns.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [settings, bookmarks, profiles, renamePresets, savedSearches]
        device:
          type: string
          description: The device whose settings were saved.
    Session:
      type: object
      required: [id, created, seen, userAgent, ip, current]
      properties:
        id:
          type: string
        created:
          type: string
          format: date-time
          description: First request of the session.
        seen:
          type: string
          format: date-time
          description: Last request, to the minute.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: The session this request came with.
    UnraidState:
      type: object
      required: [available, array, parity, disks, shares, write, spindownDelay]
      properties:
        available:
          type: boolean
        version:
          type: string
          example: 7.3.4
        name:
          type: string
        array:
          type: object
          properties:
            state:
              type: string
              example: STARTED
            started:
              type: boolean
            disks:
              type: integer
            disabled:
              type: integer
            invalid:
              type: integer
            missing:
              type: integer
            fsState:
              type: string
            unmountable:
              type: integer
        parity:
          $ref: "#/components/schemas/UnraidParity"
        disks:
          type: array
          items:
            $ref: "#/components/schemas/UnraidDisk"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/UnraidShare"
        write:
          type: boolean
          description: Spinning down and notifications are switched on.
        spindownDelay:
          type: integer
          description: Default spin down delay in minutes, 0 for never.
    UnraidParity:
      type: object
      required: [running, paused, pos, size, percent, lastErrors, lastExit]
      properties:
        running:
          type: boolean
        paused:
          type: boolean
        kind:
          type: string
          enum: [check, rebuild, clear]
        action:
          type: string
          example: check P
        correct:
          type: boolean
        pos:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        percent:
          type: number
        speed:
          type: integer
          format: int64
          description: Bytes per second.
        lastSync:
          type: string
          format: date-time
        lastErrors:
          type: integer
        lastExit:
          type: integer
          description: 0 for a finished run, negative when it was cancelled.
    UnraidDisk:
      type: object
      required: [name, kind, mounted, status, size, fsSize, free, used, spundown, rotational, errors]
      properties:
        name:
          type: string
          example: disk1
        kind:
          type: string
          enum: [parity, data, pool, flash]
        pool:
          type: string
          description: Set on the second and later devices of a pool.
        mount:
          type: string
          example: /mnt/disk1
        mounted:
          type: boolean
        status:
          type: string
          example: DISK_OK
        fsStatus:
          type: string
        fsType:
          type: string
        size:
          type: integer
          format: int64
        fsSize:
          type: integer
          format: int64
        free:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        floor:
          type: integer
          format: int64
          description: Minimum free space of a pool.
        spundown:
          type: boolean
        rotational:
          type: boolean
        temp:
          type: integer
          description: Celsius, missing while the disk sleeps.
        errors:
          type: integer
        color:
          type: string
          example: green-on
    UnraidStorage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [array, pool]
        name:
          type: string
          description: The pool.
    UnraidShare:
      type: object
      required: [name, primary, allocator, splitLevel, floor, disks, free, used, exclusive]
      properties:
        name:
          type: string
        comment:
          type: string
        primary:
          $ref: "#/components/schemas/UnraidStorage"
        secondary:
          $ref: "#/components/schemas/UnraidStorage"
        mover:
          type: string
          enum: [toSecondary, toPrimary]
          description: toSecondary is "Cache to Array" in the share settings.
        allocator:
          type: string
          enum: [highwater, fillup, mostfree]
        splitLevel:
          type: string
          description: Empty splits any folder, 0 is manual, N splits the top N levels.
        floor:
          type: integer
          format: int64
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        disks:
          type: array
          description: The array disks the share may write to.
          items:
            type: string
        free:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        exclusive:
          type: boolean
    UnraidWhere:
      type: object
      required: [path, dir, "on", files, size]
      properties:
        path:
          type: string
        volume:
          type: string
          description: user, user0 or the disk or pool in the path. Empty off the array.
        share:
          type: string
        dir:
          type: boolean
        "on":
          type: array
          items:
            type: object
            required: [device, files, size, asleep]
            properties:
              device:
                type: string
              files:
                type: integer
              size:
                type: integer
                format: int64
              asleep:
                type: boolean
        files:
          type: integer
        size:
          type: integer
          format: int64
        partial:
          type: boolean
        links:
          type: object
          required: [count, paths, complete]
          properties:
            count:
              type: integer
              description: Link count of the file, this path included.
            paths:
              type: array
              items:
                type: string
            complete:
              type: boolean
    UnraidTransfer:
      type: object
      required: [kind, paths, dest]
      properties:
        kind:
          type: string
          enum: [copy, move, link]
        paths:
          type: array
          items:
            type: string
        dest:
          type: string
          description: The destination folder.
    UnraidTransferReport:
      type: object
      required: [linkable, wakes]
      properties:
        trap:
          type: object
          description: The files are the same at both ends. Copying or moving truncates them to 0 bytes.
          required: [device, count, size, files, targets]
          properties:
            device:
              type: string
            count:
              type: integer
            size:
              type: integer
              format: int64
            files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  device:
                    type: string
                  size:
                    type: integer
                    format: int64
            targets:
              type: array
              description: Other array disks for a safe copy, most free first.
              items:
                type: object
                properties:
                  disk:
                    type: string
                  free:
                    type: integer
                    format: int64
        links:
          type: object
          description: Hard links the transfer turns into separate files.
          required: [count, extra, files]
          properties:
            count:
              type: integer
            extra:
              type: integer
              format: int64
              description: Space the data takes a second time.
            files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  size:
                    type: integer
                    format: int64
                  names:
                    type: integer
                  others:
                    type: array
                    items:
                      type: string
                  complete:
                    type: boolean
        space:
          type: object
          description: Missing when the files fit.
          required: [problem, share, allocator, floor, total, room, free]
          properties:
            problem:
              type: string
              enum: [noDisk, tooMuch, bigFile, poolFull]
            share:
              type: string
            allocator:
              type: string
            floor:
              type: integer
              format: int64
            total:
              type: integer
              format: int64
            biggest:
              type: object
              properties:
                path:
                  type: string
                size:
                  type: integer
                  format: int64
            room:
              type: integer
              format: int64
            disk:
              type: string
              description: The disk Unraid would pick.
            free:
              type: integer
              format: int64
            pool:
              type: string
            roomy:
              type: string
              description: A disk of the share that holds the largest file.
            roomyFree:
              type: integer
              format: int64
        linkable:
          type: boolean
          description: Hard links can stand in for a copy.
        wakes:
          type: array
          items:
            type: string
        lands:
          type: string
          description: The disk or pool new files go to.
        partial:
          type: boolean
    UnraidGatherPlan:
      type: object
      required: [path, mode, files, size, devices, options, moves, move, short, cached]
      properties:
        path:
          type: string
        mode:
          type: string
          enum: [gather, scatter]
        disk:
          type: string
          description: Target for gather, source for scatter.
        files:
          type: integer
        size:
          type: integer
          format: int64
        devices:
          type: array
          items:
            type: object
            properties:
              device:
                type: string
              now:
                type: integer
                format: int64
              files:
                type: integer
              after:
                type: integer
                format: int64
              free:
                type: integer
                format: int64
              asleep:
                type: boolean
        options:
          type: array
          items:
            type: object
            properties:
              disk:
                type: string
              move:
                type: integer
                format: int64
              short:
                type: integer
                format: int64
        moves:
          type: integer
        move:
          type: integer
          format: int64
        short:
          type: integer
          format: int64
          description: What fits nowhere and stays.
        cached:
          type: integer
          description: Files still on a pool, the mover takes care of them.
        partial:
          type: boolean
    UnraidPermsScan:
      type: object
      required: [path, owner, files, dirs, wrong, kept]
      properties:
        path:
          type: string
        blocked:
          type: string
          enum: [appdata, system, domains, flash, archive]
        owner:
          type: string
          example: "99:100"
        files:
          type: integer
        dirs:
          type: integer
        wrong:
          type: integer
        kept:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              reason:
                type: string
                enum: [appdata, system, domains, flash]
              size:
                type: integer
                format: int64
        partial:
          type: boolean
    WatchRequest:
      type: object
      required: [clientId, paths]
      properties:
        clientId:
          type: string
        paths:
          type: array
          maxItems: 64
          items:
            type: string

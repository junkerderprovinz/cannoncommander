  /events:
    get:
      operationId: eventsStream
      summary: Server events as SSE
      description: |
        Opens a text/event-stream. Each frame has "id:", "event:" and a
        "data:" line holding an Event. Heartbeats come every 25 seconds
        without an id. After a reconnect with Last-Event-ID the missed
        events follow first, or a single resync event when they are gone.
      parameters:
        - name: clientId
          in: query
          description: Chosen by the client once per tab, it ties the watched folders to this stream. Without it the stream carries only the events that are not about watched folders.
          schema:
            type: string
            maxLength: 64
        - name: lastEventId
          in: query
          description: Same as the Last-Event-ID header, for clients that cannot set headers.
          schema:
            type: integer
            format: int64
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [events]
  /events/watch:
    put:
      operationId: eventsWatch
      summary: Set the folders a client watches
      description: |
        Replaces the watched folders of a client. For each of them the stream
        delivers fs.changed with topic fs:<path>. Folders stay watched for two
        minutes after the stream closes, so a reconnect keeps them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRequest"
      responses:
        "200":
          description: The watched folders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [events]
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token or a session token.
    cookie:
      type: apiKey
      in: cookie
      name: filebrowser_quantum_jwt
      description: The session cookie the web app gets on login.
  parameters:
    Path:
      name: path
      in: query
      required: true
      description: Absolute path.
      schema:
        type: string
        example: /mnt/user/filme
    Device:
      name: device
      in: query
      description: An id the client picks once per device and keeps, up to 64 letters, digits, - and _.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
  responses:
    NotImplemented:
      description: Part of the contract, not built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed for this user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The path does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Event:
      type: object
      description: |
        One server event. The SSE frame carries the type as "event:" and the
        id as "id:", and this object as "data:". Reconnect with the
        Last-Event-ID header (or lastEventId query) to receive what was
        missed. A resync event means the gap was too large and the client
        should reload its state.
      required: [id, type, time]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - heartbeat
            - resync
            - notify
            - job.created
            - job.progress
            - job.state
            - job.conflict
            - job.done
            - fs.changed
            - trash.changed
            - labels.changed
            - undo.changed
            - share.opened
            - unraid.parity
            - unraid.spin
            - index.progress
            - search.hits
            - prefs.changed
        topic:
          type: string
          description: Set for events that only subscribers see, for example fs:/mnt/user/filme.
        time:
          type: string
          format: date-time
        data:
          description: Payload, its shape depends on the type.
    FsItem:
      type: object
      required: [name, dir, size, mtime, mode]
      properties:
        name:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
          description: Bytes, 0 for folders.
        mtime:
          type: string
          format: date-time
          description: Modification time in UTC with milliseconds.
        mode:
          type: string
          description: Permission bits in octal.
          example: "0664"
        owner:
          type: string
          description: User name, or the number when the container does not know it.
        group:
          type: string
        hidden:
          type: boolean
          description: The name starts with a dot.
        link:
          type: string
          description: Target of a symbolic link.
    Volume:
      type: object
      required: [path, free, total]
      properties:
        path:
          type: string
          description: Where the source is mounted.
        label:
          type: string
          description: Name of the source.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FsList:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsItem"
        volume:
          $ref: "#/components/schemas/Volume"
          description: Missing for the virtual folders / and /mnt.
    FsTreeItem:
      type: object
      required: [name, path, hasDirs]
      properties:
        name:
          type: string
        path:
          type: string
        hasDirs:
          type: boolean
          description: The folder has visible subfolders.
        label:
          type: string
          description: Name of the source mounted here.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FsTree:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsTreeItem"
    SavedSearchInput:
      type: object
      required: [name, query]
      properties:
        name:
          type: string
        query:
          type: object
          description: |
            The search as the search window sends it, stored as given. When
            it has a field in, that has to be a folder path.
          additionalProperties: true
          example: {text: "", in: /mnt/user, name: "*.iso *.img", min: 1 GB, when: any, type: all, hidden: false}
    SavedSearch:
      allOf:
        - $ref: "#/components/schemas/SavedSearchInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    Label:
      type: object
      properties:
        colour:
          type: string
          description: Id of the colour.
        tags:
          type: array
          items:
            type: string
    LabelLists:
      type: object
      required: [colours, tags]
      properties:
        colours:
          type: array
          items:
            type: object
            required: [id, name, hex, count]
            properties:
              id:
                type: string
                example: red
              name:
                type: string
                description: Empty for the colours the app comes with, which the client names in its language.
              hex:
                type: string
                example: "#ff6b72"
              count:
                type: integer
        tags:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name:
                type: string
              count:
                type: integer
    LabelsChanged:
      type: object
      description: |
        Payload of labels.changed. Kind colours or tags reaches everyone,
        kind items reaches the watchers of the folder in path.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [colours, tags, items]
        path:
          type: string
    Prefs:
      type: object
      description: Settings by name. The interface defines the names, see DEFAULT_PREFS in the frontend.
      additionalProperties: true
    Bookmark:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
        g:
          type: string
          description: Glyph name, for example IconDownload.
    BookmarkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Bookmark"
    ProfileInput:
      type: object
      required: [name, panels]
      properties:
        name:
          type: string
        dual:
          type: boolean
        columns:
          type: array
          items:
            type: string
        panels:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [cur, tabs]
            properties:
              cur:
                type: integer
                description: Index of the active tab.
              tabs:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: string
                  description: Folder of the tab.
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    RenamePresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name, options]
            properties:
              name:
                type: string
              options:
                type: object
                description: The fields of the multi rename window.
                properties:
                  name:
                    type: string
                    example: "[A]_[C3]"
                  ext:
                    type: string
                    example: "[E]"
                  find:
                    type: string
                  repl:
                    type: string
                  regex:
                    type: boolean
                  case:
                    type: string
                    enum: [keep, lower, upper, title]
    FrequentFolder:
      type: object
      required: [path, visits, last, rank]
      properties:
        path:
          type: string
        visits:
          type: integer
        last:
          type: string
          format: date-time
        rank:
          type: number
    PrefsChanged:
      type: object
      description: Payload of prefs.changed, sent only to the user it concerns.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [settings, bookmarks, profiles, renamePresets, savedSearches]
        device:
          type: string
          description: The device whose settings were saved.
    Session:
      type: object
      required: [id, created, seen, userAgent, ip, current]
      properties:
        id:
          type: string
        created:
          type: string
          format: date-time
          description: First request of the session.
        seen:
          type: string
          format: date-time
          description: Last request, to the minute.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: The session this request came with.
    WatchRequest:
      type: object
      required: [clientId, paths]
      properties:
        clientId:
          type: string
        paths:
          type: array
          maxItems: 64
          items:
            type: string

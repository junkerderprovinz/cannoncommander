          description: How many jobs were removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [jobs]
  /jobs/settings:

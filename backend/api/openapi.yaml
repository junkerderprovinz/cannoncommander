      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /admin/index:
    get:
      operationId: indexState
      summary: State of the index per source
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: indexRebuild
      summary: Rebuild the index of a source
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /admin/integrations/test:
    post:
      operationId: integrationsTest
      summary: Try an integration such as an office server
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /admin/app:
    get:
      operationId: appSettingsGet
      summary: Server wide settings
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: appSettingsPut
      summary: Save server wide settings
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /events:
    get:
      operationId: eventsStream
      summary: Server events as SSE
      description: |
        Opens a text/event-stream. Each frame has "id:", "event:" and a
        "data:" line holding an Event. Heartbeats come every 25 seconds
        without an id. After a reconnect with Last-Event-ID the missed
        events follow first, or a single resync event when they are gone.
      parameters:
        - name: clientId
          in: query
          description: Chosen by the client once per tab, it ties the watched folders to this stream. Without it the stream carries only the events that are not about watched folders.
          schema:
            type: string
            maxLength: 64
        - name: lastEventId
          in: query
          description: Same as the Last-Event-ID header, for clients that cannot set headers.
          schema:
            type: integer
            format: int64
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [events]
  /events/watch:
    put:
      operationId: eventsWatch
      summary: Set the folders a client watches
      description: |
        Replaces the watched folders of a client. For each of them the stream
        delivers fs.changed with topic fs:<path>. Folders stay watched for two
        minutes after the stream closes, so a reconnect keeps them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRequest"
      responses:
        "200":
          description: The watched folders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [events]
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token or a session token.
    cookie:
      type: apiKey
      in: cookie
      name: filebrowser_quantum_jwt
      description: The session cookie the web app gets on login.
  parameters:
    Path:
      name: path
      in: query
      required: true
      description: Absolute path.
      schema:
        type: string
        example: /mnt/user/filme
    Device:
      name: device
      in: query
      description: An id the client picks once per device and keeps, up to 64 letters, digits, - and _.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
    SharePath:
      name: path
      in: query
      description: Path inside the link, "/" for its root.
      schema:
        type: string
        default: /
    ShareToken:
      name: token
      in: query
      description: Unlock token of a link with a password, for when no header or cookie can carry it.
      schema:
        type: string
  responses:
    NotImplemented:
      description: Part of the contract, not built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed for this user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The path does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UploadConflict:
      description: |
        Either a file of this name exists and the rule is ask, then
        conflict tells both sides, or the chunk does not start at the
        offset of the upload, then upload tells where it stands. A start
        for a target another upload is writing answers 409 as well.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  upload:
                    $ref: "#/components/schemas/Upload"
                  conflict:
                    $ref: "#/components/schemas/JobConflict"
    FsChanged:
      description: The entry as it is now, and the undo step for it.
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path:
                type: string
              created:
                type: boolean
              undo:
                type: string
                description: Id of the undo step, for POST /undo.
    JobAnswer:
      description: The job after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Job"
    StateConflict:
      description: The request does not fit the current state, for example a name that exists already.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UndoTaken:
      description: The step that was taken back, and the job doing it.
      content:
        application/json:
          schema:
            type: object
            required: [step]
            properties:
              step:
                $ref: "#/components/schemas/UndoStep"
              job:
                $ref: "#/components/schemas/Job"
    ShareGone:
      description: The link expired, used up its downloads, or its owner may no longer share.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ShareLocked:
      description: The link has a password and was not unlocked.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyTries:
      description: Too many wrong passwords or unknown addresses. Retry-After says when to go on.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Event:
      type: object
      description: |
        One server event. The SSE frame carries the type as "event:" and the
        id as "id:", and this object as "data:". Reconnect with the
        Last-Event-ID header (or lastEventId query) to receive what was
        missed. A resync event means the gap was too large and the client
        should reload its state.
      required: [id, type, time]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - heartbeat
            - resync
            - notify
            - job.created
            - job.progress
            - job.state
            - job.conflict
            - job.done
            - fs.changed
            - trash.changed
            - labels.changed
            - undo.changed
            - share.opened
            - unraid.parity
            - unraid.spin
            - index.progress
            - search.hits
            - prefs.changed
        topic:
          type: string
          description: Set for events that only subscribers see, for example fs:/mnt/user/filme.
        time:
          type: string
          format: date-time
        data:
          description: Payload, its shape depends on the type.
    FsItem:
      type: object
      required: [name, dir, size, mtime, mode]
      properties:
        name:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
          description: Bytes. For a folder the total size from the index, 0 while the index has not measured it.
        mtime:
          type: string
          format: date-time
          description: Modification time in UTC with milliseconds.
        btime:
          type: string
          format: date-time
          description: Creation time, where the file system records it.
        mode:
          type: string
          description: Permission bits in octal, with setuid, setgid and sticky in front.
          example: "0664"
        owner:
          type: string
          description: User name, or the number when the container does not know it.
        group:
          type: string
        uid:
          type: integer
        gid:
          type: integer
        ino:
          type: integer
          format: int64
          description: Inode number. Missing below /mnt/user in a listing, because the share reports numbers of its own. fs/stat gives the one on the disk.
        nlink:
          type: integer
          format: int64
          description: Number of hard links.
        hidden:
          type: boolean
          description: The name starts with a dot.
        link:
          type: string
          description: Target of a symbolic link.
        items:
          type: integer
          description: Entries directly inside a folder. Missing when neither the index nor a quick look could count them.
        format:
          type: string
          description: Format group of a file, an id from formats.json such as video or archive.
        picture:
          type: string
          description: Name of the folder's poster.jpg, folder.jpg or cover.jpg, for the card views.
        pool:
          type: string
          description: Under /mnt/user, the Unraid pool that holds the entry, such as cache.
        remote:
          type: string
          description: The rclone remote mounted at this folder.
    Volume:
      type: object
      required: [path, free, total]
      properties:
        path:
          type: string
          description: Where the source is mounted.
        label:
          type: string
          description: Name of the source.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FsList:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsItem"
        volume:
          $ref: "#/components/schemas/Volume"
          description: Missing for the virtual folders / and /mnt.
    FsTreeItem:
      type: object
      required: [name, path, hasDirs]
      properties:
        name:
          type: string
        path:
          type: string
        hasDirs:
          type: boolean
          description: The folder has visible subfolders.
        label:
          type: string
          description: Name of the source mounted here.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        remote:
          type: string
          description: The rclone remote mounted here.
    FsTree:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsTreeItem"
    FsStat:
      allOf:
        - $ref: "#/components/schemas/FsItem"
        - type: object
          required: [path]
          properties:
            path:
              type: string
            files:
              type: integer
              format: int64
              description: Files anywhere below a folder.
            dirs:
              type: integer
              format: int64
              description: Folders anywhere below a folder.
            devices:
              type: array
              items:
                type: string
              description: Below /mnt/user, the disks and pools that hold the path, such as cache or disk2.
            volume:
              $ref: "#/components/schemas/Volume"
    FsText:
      type: object
      required: [path, size, mtime, encoding, text]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        encoding:
          type: string
          enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1252]
        eol:
          type: string
          enum: [lf, crlf, cr, mixed]
          description: Missing for text without line breaks.
        text:
          type: string
        truncated:
          type: boolean
          description: The file goes on after max bytes.
    FsFile:
      type: object
      required: [path, size, mtime, encoding, text, etag, writable]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        encoding:
          type: string
          enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1252]
        eol:
          type: string
          enum: [lf, crlf, cr, mixed]
        text:
          type: string
        etag:
          type: string
          description: The same as the ETag header, for If-Match on the save.
        writable:
          type: boolean
          description: The user may save the file.
    FsSaved:
      type: object
      required: [path, size, mtime, etag]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        etag:
          type: string
        created:
          type: boolean
    ArchiveRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
        format:
          type: string
          enum: [zip, tgz]
          default: zip
        name:
          type: string
          description: File name of the download. Made from the paths when missing.
    FsHex:
      type: object
      required: [path, size, offset, data]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
          description: Size of the whole file.
        offset:
          type: integer
          format: int64
        data:
          type: string
          format: byte
          description: The bytes, base64.
    UploadRequest:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
          description: The file to create.
        size:
          type: integer
          format: int64
          minimum: 0
        mtime:
          type: string
          format: date-time
          description: Modification time the file gets, usually lastModified of the browser file.
        rule:
          type: string
          enum: [ask, skip, replace, both, newer]
          default: ask
          description: |
            What happens when the name exists. ask answers 409 with the
            conflict, replace moves the old file to the trash, both keeps
            the new one as "name (1).ext", newer replaces only an older
            file. The rule is applied again when the last chunk arrives.
    Upload:
      type: object
      required: [id, path, size, offset, state, rule, chunk]
      properties:
        id:
          type: string
        path:
          type: string
          description: The target, and once done the file it became, which differs when both were kept.
        size:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
          description: Bytes received so far, where the next chunk starts.
        state:
          type: string
          enum: [open, done, skipped]
        rule:
          type: string
        mtime:
          type: string
          format: date-time
        chunk:
          type: integer
          description: The chunk size the server asks for.
    PermsParams:
      type: object
      description: Params of the job kind fixPerms. Admins only.
      required: [path]
      properties:
        path:
          type: string
    PathBody:
      type: object
      required: [path]
      properties:
        path:
          type: string
    PathsParams:
      type: object
      description: Params of the job kinds delete and trash.
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
    TransferParams:
      type: object
      description: Params of the job kinds copy and move.
      required: [sources, dest]
      properties:
        sources:
          type: array
          description: Files and folders, also from different folders.
          items:
            type: string
        dest:
          type: string
          description: The folder they go into.
        names:
          type: array
          description: Names at the target, in the order of the sources.
          items:
            type: string
        rule:
          type: string
          enum: [ask, skip, replace, both, newer]
          default: ask
          description: |
            Answers every conflict without a decision. ask waits for
            POST /jobs/{id}/decide after job.conflict. replace moves the
            old entry to the trash, both gives the new one a number,
            newer replaces only older files. Folders on both sides are
            merged for replace and newer.
        decisions:
          type: object
          description: Answers keyed by conflict key, for example from the preflight.
          additionalProperties:
            type: string
            enum: [skip, replace, both, newer]
        verify:
          type: boolean
          description: Read every copied file back and compare checksums.
        keepAttrs:
          type: boolean
          default: true
          description: Keep owner, mode and times. Without it new entries belong to the user the server runs as.
    Preflight:
      type: object
      required: [dest, count, bytes, files, conflicts, sameDevice, big, parityBusy]
      properties:
        dest:
          type: string
        count:
          type: integer
        bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/JobConflict"
        sameDevice:
          type: boolean
          description: A move that only renames and needs no free space.
        space:
          $ref: "#/components/schemas/Space"
        big:
          type: boolean
          description: From 2 GiB on the job waits for a running parity check.
        parityBusy:
          type: boolean
          description: Unraid checks parity right now. For small jobs the client asks whether to wait.
        unraid:
          $ref: "#/components/schemas/UnraidTransferReport"
          description: Trap, broken hard links, space after the allocation rules and disks that wake up. Missing where Unraid has nothing to say.
    Space:
      type: object
      required: [free, need, enough]
      properties:
        free:
          type: integer
          format: int64
        need:
          type: integer
          format: int64
        enough:
          type: boolean
    JobCreate:
      type: object
      required: [kind, params]
      properties:
        kind:
          type: string
          example: copy
        params:
          description: |
            Depends on the kind. copy and move take TransferParams, delete
            and trash take PathsParams, fixPerms takes PermsParams.
          oneOf:
            - $ref: "#/components/schemas/TransferParams"
            - $ref: "#/components/schemas/PathsParams"
            - $ref: "#/components/schemas/PermsParams"
        cap:
          type: integer
          format: int64
          description: Bytes per second for this job, 0 for no limit.
        waitForParity:
          type: boolean
          description: Wait for a running parity check even if the job is small.
    JobSettings:
      type: object
      required: [mode, cap, parityWait, notifyUnraid, notifyAfter]
      properties:
        mode:
          type: string
          enum: [serial, parallel]
          description: serial runs one job at a time in queue order, parallel lets them share the speed.
        cap:
          type: integer
          format: int64
          description: Bytes per second for all jobs together, 0 for no limit.
        parityWait:
          type: boolean
          description: Copies and moves from 2 GiB on wait while Unraid checks parity or rebuilds.
        notifyUnraid:
          type: boolean
          description: Send a notice to Unraid when a long job ends. Needs write access to Unraid in the template.
        notifyAfter:
          type: integer
          format: int64
          description: Seconds a job has to run before its end is worth a notice.
          example: 60
    Job:
      type: object
      required: [id, kind, owner, state, position, name, count, totalBytes, doneBytes, totalFiles, doneFiles, rate, left, cap, waitForParity, failedItems, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
        owner:
          type: string
        state:
          type: string
          enum: [queued, running, paused, asking, done, failed, cancelled]
        reason:
          type: string
          enum: [parity]
          description: Why a queued job does not run. Missing while it only waits for its turn.
        place:
          type: integer
          description: Place in the waiting line, from 1.
        position:
          type: integer
        name:
          type: string
          description: Name of the first item.
        count:
          type: integer
          description: Number of items.
        dest:
          type: string
        totalBytes:
          type: integer
          format: int64
        doneBytes:
          type: integer
          format: int64
        totalFiles:
          type: integer
          format: int64
          description: Entries below and at the items, folders included.
        doneFiles:
          type: integer
          format: int64
        rate:
          type: number
          description: Bytes per second right now.
        left:
          type: [number, "null"]
          description: Seconds left at the current rate.
        current:
          type: string
          description: The entry in work, relative to the items.
        cap:
          type: integer
          format: int64
        waitForParity:
          type: boolean
        failedItems:
          type: integer
        error:
          type: string
        conflict:
          $ref: "#/components/schemas/JobConflict"
        undo:
          type: string
          description: Id of the undo step that takes the finished job back.
        result:
          description: What the job found out, for kinds that report more than done or failed.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Only in GET /jobs/{id}.
          items:
            $ref: "#/components/schemas/JobItem"
    JobItem:
      type: object
      required: [seq, path, state, bytes, files]
      properties:
        seq:
          type: integer
        path:
          type: string
        name:
          type: string
          description: Name at the target when it differs.
        state:
          type: string
          enum: [pending, running, done, skipped, failed]
        bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        error:
          type: string
    JobConflict:
      type: object
      description: A name that exists at the target already. Also the data of job.conflict, together with the job id.
      required: [key, source, target]
      properties:
        key:
          type: string
          description: Path relative to the target folder. An answer for a folder covers everything inside it.
        source:
          $ref: "#/components/schemas/ConflictSide"
        target:
          $ref: "#/components/schemas/ConflictSide"
        newer:
          type: string
          enum: [source, target]
          description: The side changed more than a second later. Missing when both are equally old.
    ConflictSide:
      type: object
      required: [path, dir, size, mtime]
      properties:
        path:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        entries:
          type: integer
          description: Entries directly inside a folder.
    JobProgress:
      type: object
      description: Data of job.progress.
      required: [id, totalBytes, doneBytes, totalFiles, doneFiles, rate, left]
      properties:
        id:
          type: string
        totalBytes:
          type: integer
          format: int64
        doneBytes:
          type: integer
          format: int64
        totalFiles:
          type: integer
          format: int64
        doneFiles:
          type: integer
          format: int64
        rate:
          type: number
        left:
          type: [number, "null"]
        current:
          type: string
    UndoStep:
      type: object
      required: [id, kind, at, name, count]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [rename, mkdir, touch, copy, move, trash]
        at:
          type: string
          format: date-time
        name:
          type: string
          description: The first name the step touched, the old one for a rename.
        count:
          type: integer
        path:
          type: string
          description: The folder the step happened in.
        to:
          type: string
          description: The new name of a rename, or the folder a copy or move went to.
    TrashIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
    TrashSettings:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 3650
          example: 30
    TrashItem:
      type: object
      required: [id, name, origin, from, dir, size, files, by, deletedAt, expiresAt]
      properties:
        id:
          type: string
        name:
          type: string
        origin:
          type: string
          description: Where the entry was.
        from:
          type: string
          description: The folder it was in.
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
          description: Entries at and below it, folders included.
        by:
          type: string
          description: Who deleted it.
        deletedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When it goes away for good.
    SavedSearchInput:
      type: object
      required: [name, query]
      properties:
        name:
          type: string
        query:
          type: object
          description: |
            The search as the search window sends it, stored as given. When
            it has a field in, that has to be a folder path.
          additionalProperties: true
          example: {text: "", in: /mnt/user, name: "*.iso *.img", min: 1 GB, when: any, type: all, hidden: false}
    SavedSearch:
      allOf:
        - $ref: "#/components/schemas/SavedSearchInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    Label:
      type: object
      properties:
        colour:
          type: string
          description: Id of the colour.
        tags:
          type: array
          items:
            type: string
    LabelLists:
      type: object
      required: [colours, tags]
      properties:
        colours:
          type: array
          items:
            type: object
            required: [id, name, hex, count]
            properties:
              id:
                type: string
                example: red
              name:
                type: string
                description: Empty for the colours the app comes with, which the client names in its language.
              hex:
                type: string
                example: "#ff6b72"
              count:
                type: integer
        tags:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name:
                type: string
              count:
                type: integer
    LabelsChanged:
      type: object
      description: |
        Payload of labels.changed. Kind colours or tags reaches everyone,
        kind items reaches the watchers of the folder in path.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [colours, tags, items]
        path:
          type: string
    Prefs:
      type: object
      description: Settings by name. The interface defines the names, see DEFAULT_PREFS in the frontend.
      additionalProperties: true
    Bookmark:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
        g:
          type: string
          description: Glyph name, for example IconDownload.
    BookmarkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Bookmark"
    ProfileInput:
      type: object
      required: [name, panels]
      properties:
        name:
          type: string
        dual:
          type: boolean
        columns:
          type: array
          items:
            type: string
        panels:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [cur, tabs]
            properties:
              cur:
                type: integer
                description: Index of the active tab.
              tabs:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: string
                  description: Folder of the tab.
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    RenamePresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name, options]
            properties:
              name:
                type: string
              options:
                type: object
                description: The fields of the multi rename window.
                properties:
                  name:
                    type: string
                    example: "[A]_[C3]"
                  ext:
                    type: string
                    example: "[E]"
                  find:
                    type: string
                  repl:
                    type: string
                  regex:
                    type: boolean
                  case:
                    type: string
                    enum: [keep, lower, upper, title]
    FrequentFolder:
      type: object
      required: [path, visits, last, rank]
      properties:
        path:
          type: string
        visits:
          type: integer
        last:
          type: string
          format: date-time
        rank:
          type: number
    PrefsChanged:
      type: object
      description: Payload of prefs.changed, sent only to the user it concerns.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [settings, bookmarks, profiles, renamePresets, savedSearches]
        device:
          type: string
          description: The device whose settings were saved.
    Session:
      type: object
      required: [id, created, seen, userAgent, ip, current]
      properties:
        id:
          type: string
        created:
          type: string
          format: date-time
          description: First request of the session.
        seen:
          type: string
          format: date-time
          description: Last request, to the minute.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: The session this request came with.
    Account:
      type: object
      required: [id, name, full, role, scope, groups, loginMethod, twofa, passkeys, last, pwChanged]
      properties:
        id:
          type: string
          description: A number too large for JavaScript, so it comes as a string.
        name:
          type: string
          description: The login name.
        full:
          type: string
          description: The name to show. The login name when none is set.
        role:
          type: string
          enum: [admin, user, readonly]
        scope:
          type: string
          description: The folder the user sees, as an absolute path.
        groups:
          type: array
          items:
            type: string
        loginMethod:
          type: string
          enum: [password, proxy, oidc, ldap, jwt]
        twofa:
          type: boolean
        passkeys:
          type: integer
        last:
          type: [string, "null"]
          format: date-time
          description: The last request of a session, null for never.
        pwChanged:
          type: [string, "null"]
          format: date-time
    Me:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [recovery, lockPassword]
          properties:
            recovery:
              type: integer
              description: Recovery codes that are left.
            lockPassword:
              type: boolean
              description: Only an admin may change the password.
            token:
              type: object
              required: [name, rights]
              properties:
                name:
                  type: string
                rights:
                  type: string
                  enum: [r, rw]
    UserInput:
      type: object
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9._-]{1,31}$"
          description: The login name.
        full:
          type: string
        role:
          type: string
          enum: [admin, user, readonly]
          description: user when left out of a new user.
        scope:
          type: string
          description: |
            An existing folder as an absolute path. A folder such as /mnt
            that only leads to sources stands for all of them. The single
            disks and the cache are for admins.
        groups:
          type: array
          items:
            type: string
        password:
          type: string
          minLength: 12
    Token:
      type: object
      required: [id, name, rights, created, expires, last]
      properties:
        id:
          type: string
        name:
          type: string
        rights:
          type: string
          enum: [r, rw]
        created:
          type: string
          format: date-time
        expires:
          type: [string, "null"]
          format: date-time
          description: Null when it never runs out.
        last:
          type: [string, "null"]
          format: date-time
          description: Last use to the minute, null for never.
    NewToken:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The token itself, sent as a bearer token.
    Passkey:
      type: object
      required: [id, name, origin, created, last]
      properties:
        id:
          type: string
        name:
          type: string
        origin:
          type: string
          description: The host the passkey works for.
        created:
          type: string
          format: date-time
        last:
          type: [string, "null"]
          format: date-time
    TotpSetup:
      type: object
      required: [secret, uri, qr]
      properties:
        secret:
          type: string
          description: Base32, for typing it into the app.
        uri:
          type: string
          description: The otpauth URI.
        qr:
          type: string
          description: The URI as a QR code, an SVG document.
    CodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Six digits from the app, or a recovery code like K7QM-3XRP.
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items:
            type: string
            example: K7QM-3XRP
    Group:
      type: object
      required: [name, note, members]
      properties:
        name:
          type: string
        note:
          type: string
        members:
          type: array
          description: Login names.
          items:
            type: string
    GroupInput:
      type: object
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
        note:
          type: string
        members:
          type: array
          items:
            type: string
    Rule:
      type: object
      required: [who, path, rule]
      properties:
        who:
          type: string
          description: A login name, @ and a group name, or * for everybody.
          example: "@familie"
        path:
          type: string
          description: |
            An absolute path, which covers the folder and everything in it,
            or a pattern with a star, which matches names anywhere, such as
            *.partial*. Patterns ignore case.
        rule:
          type: string
          enum: [hide, read, allow]
          description: Allow lifts a rule further down, such as for a subfolder.
    RuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Rule"
    Verdict:
      type: object
      required: [result, reason]
      properties:
        result:
          type: string
          enum: [visible, read, hidden, missing]
        reason:
          type: string
          enum: [scope, rule, role, source, none]
          description: |
            What decided: the scope of the user, a rule, the read only
            role, a read only source, or nothing in particular.
        rule:
          type: integer
          description: The deciding rule, counted from 0.
        scope:
          type: string
          description: The folder of the user, when the scope decided.
    ActivityEntry:
      type: object
      required: [id, t, who, what, obj, details]
      properties:
        id:
          type: integer
        t:
          type: string
          format: date-time
        who:
          type: string
          description: The login name, anonymous for public links.
        what:
          type: string
          description: The event type, such as login, upload or shareCreate.
        obj:
          type: string
          description: What the event was about in a few words, such as a path or a user.
        path:
          type: string
          description: Absolute path, when the event touched files.
        target:
          type: string
          description: Where a move or copy went.
        ip:
          type: string
        details:
          type: object
    Share:
      type: object
      required: [id, slug, kind, name, paths, owner, created, expires, password, limit, downloads, views, uploads, uploadLimit, uploaded, notify, state]
      properties:
        id:
          type: string
        slug:
          type: string
          description: The end of the address, /s/{slug}.
          example: k3x9qa-urlaub
        kind:
          type: string
          enum: [file, folder, collection]
        name:
          type: string
          description: The folder name of a collection, otherwise the name of the file or folder.
        paths:
          type: array
          items:
            type: string
          description: What the link shares. Follows renames and moves made in the app.
        owner:
          type: string
        created:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
          nullable: true
        password:
          type: boolean
        limit:
          type: integer
          description: Downloads until the link leads nowhere, 0 for no limit.
        downloads:
          type: integer
        views:
          type: integer
        uploads:
          type: boolean
        uploadLimit:
          type: integer
          format: int64
          description: Bytes visitors may upload through the link in all, 0 for no limit.
        uploaded:
          type: integer
          format: int64
        notify:
          type: boolean
          description: Opening the link sends a notice, in the app and to Unraid.
        state:
          type: string
          enum: [active, expired, exhausted]
    ShareCreate:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
        name:
          type: string
          description: Needed for a collection.
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,39}$"
          description: Missing picks one that is hard to guess.
        expires:
          type: string
          format: date-time
          nullable: true
        password:
          type: string
          minLength: 6
        limit:
          type: integer
          minimum: 0
        uploads:
          type: boolean
        uploadLimit:
          type: integer
          format: int64
          minimum: 0
        notify:
          type: boolean
    ShareUpdate:
      type: object
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,39}$"
        reroll:
          type: boolean
          description: Gives the link a fresh address, the old one leads nowhere.
        name:
          type: string
        expires:
          type: string
          format: date-time
          nullable: true
        password:
          type: string
          description: A new password, or empty to remove it.
        limit:
          type: integer
          minimum: 0
        uploads:
          type: boolean
        uploadLimit:
          type: integer
          format: int64
          minimum: 0
        notify:
          type: boolean
    PublicShare:
      type: object
      required: [slug, locked]
      properties:
        slug:
          type: string
        locked:
          type: boolean
          description: The link needs its password. Nothing else is told then.
        kind:
          type: string
          enum: [file, folder, collection]
        name:
          type: string
        expires:
          type: string
          format: date-time
        uploads:
          type: boolean
        uploadRoom:
          type: integer
          format: int64
          description: Bytes the link still takes, when it has an upload limit.
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        count:
          type: integer
          description: Entries of a collection.
    ShareUnlocked:
      type: object
      required: [token, expires]
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
    PublicItem:
      type: object
      required: [name, dir, size, mtime]
      properties:
        name:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        format:
          type: string
    PublicListing:
      type: object
      required: [path, name, items]
      properties:
        path:
          type: string
        name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicItem"
    UnraidState:
      type: object
      required: [available, array, parity, disks, shares, write, spindownDelay]
      properties:
        available:
          type: boolean
        version:
          type: string
          example: 7.3.4
        name:
          type: string
        array:
          type: object
          properties:
            state:
              type: string
              example: STARTED
            started:
              type: boolean
            disks:
              type: integer
            disabled:
              type: integer
            invalid:
              type: integer
            missing:
              type: integer
            fsState:
              type: string
            unmountable:
              type: integer
        parity:
          $ref: "#/components/schemas/UnraidParity"
        disks:
          type: array
          items:
            $ref: "#/components/schemas/UnraidDisk"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/UnraidShare"
        write:
          type: boolean
          description: Spinning down and notifications are switched on.
        spindownDelay:
          type: integer
          description: Default spin down delay in minutes, 0 for never.
    UnraidParity:
      type: object
      required: [running, paused, pos, size, percent, lastErrors, lastExit]
      properties:
        running:
          type: boolean
        paused:
          type: boolean
        kind:
          type: string
          enum: [check, rebuild, clear]
        action:
          type: string
          example: check P
        correct:
          type: boolean
        pos:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        percent:
          type: number
        speed:
          type: integer
          format: int64
          description: Bytes per second.
        lastSync:
          type: string
          format: date-time
        lastErrors:
          type: integer
        lastExit:
          type: integer
          description: 0 for a finished run, negative when it was cancelled.
    UnraidDisk:
      type: object
      required: [name, kind, mounted, status, size, fsSize, free, used, spundown, rotational, errors]
      properties:
        name:
          type: string
          example: disk1
        kind:
          type: string
          enum: [parity, data, pool, flash]
        pool:
          type: string
          description: Set on the second and later devices of a pool.
        mount:
          type: string
          example: /mnt/disk1
        mounted:
          type: boolean
        status:
          type: string
          example: DISK_OK
        fsStatus:
          type: string
        fsType:
          type: string
        size:
          type: integer
          format: int64
        fsSize:
          type: integer
          format: int64
        free:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        floor:
          type: integer
          format: int64
          description: Minimum free space of a pool.
        spundown:
          type: boolean
        rotational:
          type: boolean
        temp:
          type: integer
          description: Celsius, missing while the disk sleeps.
        errors:
          type: integer
        color:
          type: string
          example: green-on
    UnraidStorage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [array, pool]
        name:
          type: string
          description: The pool.
    UnraidShare:
      type: object
      required: [name, primary, allocator, splitLevel, floor, disks, free, used, exclusive]
      properties:
        name:
          type: string
        comment:
          type: string
        primary:
          $ref: "#/components/schemas/UnraidStorage"
        secondary:
          $ref: "#/components/schemas/UnraidStorage"
        mover:
          type: string
          enum: [toSecondary, toPrimary]
          description: toSecondary is "Cache to Array" in the share settings.
        allocator:
          type: string
          enum: [highwater, fillup, mostfree]
        splitLevel:
          type: string
          description: Empty splits any folder, 0 is manual, N splits the top N levels.
        floor:
          type: integer
          format: int64
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        disks:
          type: array
          description: The array disks the share may write to.
          items:
            type: string
        free:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        exclusive:
          type: boolean
    UnraidWhere:
      type: object
      required: [path, dir, "on", files, size]
      properties:
        path:
          type: string
        volume:
          type: string
          description: user, user0 or the disk or pool in the path. Empty off the array.
        share:
          type: string
        dir:
          type: boolean
        "on":
          type: array
          items:
            type: object
            required: [device, files, size, asleep]
            properties:
              device:
                type: string
              files:
                type: integer
              size:
                type: integer
                format: int64
              asleep:
                type: boolean
        files:
          type: integer
        size:
          type: integer
          format: int64
        partial:
          type: boolean
        links:
          type: object
          required: [count, paths, complete]
          properties:
            count:
              type: integer
              description: Link count of the file, this path included.
            paths:
              type: array
              items:
                type: string
            complete:
              type: boolean
    UnraidTransfer:
      type: object
      required: [kind, paths, dest]
      properties:
        kind:
          type: string
          enum: [copy, move, link]
        paths:
          type: array
          items:
            type: string
        dest:
          type: string
          description: The destination folder.
    UnraidTransferReport:
      type: object
      required: [linkable, wakes]
      properties:
        trap:
          type: object
          description: The files are the same at both ends. Copying or moving truncates them to 0 bytes.
          required: [device, count, size, files, targets]
          properties:
            device:
              type: string
            count:
              type: integer
            size:
              type: integer
              format: int64
            files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  device:
                    type: string
                  size:
                    type: integer
                    format: int64
            targets:
              type: array
              description: Other array disks for a safe copy, most free first.
              items:
                type: object
                properties:
                  disk:
                    type: string
                  free:
                    type: integer
                    format: int64
        links:
          type: object
          description: Hard links the transfer turns into separate files.
          required: [count, extra, files]
          properties:
            count:
              type: integer
            extra:
              type: integer
              format: int64
              description: Space the data takes a second time.
            files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  size:
                    type: integer
                    format: int64
                  names:
                    type: integer
                  others:
                    type: array
                    items:
                      type: string
                  complete:
                    type: boolean
        space:
          type: object
          description: Missing when the files fit.
          required: [problem, share, allocator, floor, total, room, free]
          properties:
            problem:
              type: string
              enum: [noDisk, tooMuch, bigFile, poolFull]
            share:
              type: string
            allocator:
              type: string
            floor:
              type: integer
              format: int64
            total:
              type: integer
              format: int64
            biggest:
              type: object
              properties:
                path:
                  type: string
                size:
                  type: integer
                  format: int64
            room:
              type: integer
              format: int64
            disk:
              type: string
              description: The disk Unraid would pick.
            free:
              type: integer
              format: int64
            pool:
              type: string
            roomy:
              type: string
              description: A disk of the share that holds the largest file.
            roomyFree:
              type: integer
              format: int64
        linkable:
          type: boolean
          description: Hard links can stand in for a copy.
        wakes:
          type: array
          items:
            type: string
        lands:
          type: string
          description: The disk or pool new files go to.
        partial:
          type: boolean
    UnraidGatherPlan:
      type: object
      required: [path, mode, files, size, devices, options, moves, move, short, cached]
      properties:
        path:
          type: string
        mode:
          type: string
          enum: [gather, scatter]
        disk:
          type: string
          description: Target for gather, source for scatter.
        files:
          type: integer
        size:
          type: integer
          format: int64
        devices:
          type: array
          items:
            type: object
            properties:
              device:
                type: string
              now:
                type: integer
                format: int64
              files:
                type: integer
              after:
                type: integer
                format: int64
              free:
                type: integer
                format: int64
              asleep:
                type: boolean
        options:
          type: array
          items:
            type: object
            properties:
              disk:
                type: string
              move:
                type: integer
                format: int64
              short:
                type: integer
                format: int64
        moves:
          type: integer
        move:
          type: integer
          format: int64
        short:
          type: integer
          format: int64
          description: What fits nowhere and stays.
        cached:
          type: integer
          description: Files still on a pool, the mover takes care of them.
        partial:
          type: boolean
    UnraidPermsScan:
      type: object
      required: [path, owner, files, dirs, wrong, kept]
      properties:
        path:
          type: string
        blocked:
          type: string
          enum: [appdata, system, domains, flash, archive]
        owner:
          type: string
          example: "99:100"
        files:
          type: integer
        dirs:
          type: integer
        wrong:
          type: integer
        kept:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              reason:
                type: string
                enum: [appdata, system, domains, flash]
              size:
                type: integer
                format: int64
        partial:
          type: boolean
    WatchRequest:
      type: object
      required: [clientId, paths]
      properties:
        clientId:
          type: string
        paths:
          type: array
          maxItems: 64
          items:
            type: string

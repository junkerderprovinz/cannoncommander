openapi: 3.1.0
info:
  title: CannonCommander API
  version: "1"
  description: |
    Every path in this API is an absolute path as Unraid sees it, for example
    /mnt/user/filme. A path into an archive carries "::" after the archive
    name: /mnt/user/downloads/fotos.zip::/Strand/IMG_0101.jpg.

    Errors come as application/problem+json. Operations that are part of the
    contract but not built yet answer 501.

    Server events arrive on GET /events. See the Event schema for their
    types.
servers:
  - url: /api/v1
security:
  - bearer: []
  - cookie: []
tags:
  - name: fs
    description: Reading files and folders.
  - name: fileops
    description: |
      Creating and renaming, uploads, and the check before a transfer.
      Copying, moving and deleting run as jobs (kinds copy, move, delete and
      trash on POST /jobs). A file in work is written as ".name.cc-part" next
      to its target and only takes its name once it is complete.
  - name: jobs
    description: |
      Long running tasks such as copy, move, pack and checksum. Jobs run on
      the server and go on after a restart. Their progress arrives as
      job.created, job.progress (at most four times a second), job.state,
      job.conflict and job.done events, each with the job or its progress as
      data.
  - name: undo
    description: |
      Taking back the last file operations: renaming, creating, moving,
      copying and moving to the trash. Each user has their own list of up to
      30 steps. undo.changed with the number of steps tells the client to
      reload it.
  - name: trash
    description: |
      Deleted files waiting in the trash. Every share has its own trash
      folder .cc-trash, other sources have one at their top, so moving there
      never copies. Entries go away for good after the days set here.
      Putting things into the trash is the job kind trash. trash.changed
      tells clients to reload the list.
  - name: search
    description: Search by name pattern, fields and content.
  - name: tools
    description: Compare, sync, duplicates, disk usage, clean up and checksums.
  - name: labels
    description: |
      Colour labels and tags on paths. They are shared, every user sees the
      labels of the files they may see. They follow a file when the server
      renames, moves or copies it.
  - name: prefs
    description: Settings, bookmarks, profiles and folder history of the own account.
  - name: accounts
    description: The own account, and users, groups, rules and activity for admins.
  - name: shares
    description: |
      Share links and the public share pages. A link shares one file, one
      folder, or a collection of entries from several folders, which the
      other side sees as one folder. It works with the rights of its owner,
      so it stops working when the owner loses them. Paths inside a link
      start at "/" and never show where the entries lie on the server.
  - name: unraid
    description: |
      Array state, file placement and the Unraid tools. Sizes are bytes.
      Outside Unraid the state says available false and placements stay empty.
  - name: remotes
    description: rclone remotes mounted below /mnt/remotes.
  - name: system
    description: Server state and the settings only admins change.
  - name: events
    description: The server event stream and the folders a client watches.
paths:
  /fs/list:
    get:
      operationId: fsList
      summary: List a folder
      description: |
        Lists the entries of a folder in name order. The folders / and /mnt
        are virtual and list the sources below them. Entries the user may
        not see are left out. Folders carry their entry count and total size
        where the index knows them. The ETag follows the entries only, so a
        change in free space alone still answers 304.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The folder and its entries.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsList"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/tree:
    get:
      operationId: fsTree
      summary: Subfolders for the folder tree
      description: |
        Returns the visible subfolders of one folder, one level deep. The
        tree asks again when a folder is opened. Folders where a source is
        mounted carry its name and fill level, folders where an rclone
        remote is mounted carry the remote.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The folder with its subfolders.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsTree"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/stat:
    get:
      operationId: fsStat
      summary: Details of one path
      description: |
        The same fields as a listing row, for one path. A folder also gets
        the number of files and folders anywhere below it, as far as the
        index knows them.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsStat"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/meta:
    post:
      operationId: fsMeta
      summary: Metadata columns for many paths
      description: Takes the visible rows and the wanted columns, returns the values from the metadata cache.
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/raw:
    get:
      operationId: fsRaw
      summary: File content, with range requests
      description: |
        Sends the file as it is, with Range, If-Range and conditional
        requests. Needs the download right. Pages and drawings come with a
        sandbox policy, so their scripts do not run.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: download
          in: query
          description: Ask the browser to save the file instead of showing it.
          schema:
            type: boolean
      responses:
        "200":
          description: The whole file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range.
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The range lies outside the file.
      tags: [fs]
  /fs/thumb:
    get:
      operationId: fsThumb
      summary: Thumbnail of a file or folder picture
      description: |
        A small picture of an image, video, document or album cover. For a
        folder it is the folder's poster.jpg, folder.jpg or cover.jpg. A
        client that adds the file's mtime as v may cache the answer for
        good.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: size
          in: query
          schema:
            type: string
            enum: [small, large]
            default: small
        - name: v
          in: query
          description: Any value that changes with the file, such as its mtime.
          schema:
            type: string
      responses:
        "200":
          description: The picture.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The path does not exist or has no thumbnail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fs]
  /fs/page:
    get:
      operationId: fsPage
      summary: One page of a PDF or office file as an image
      parameters:
        - $ref: "#/components/parameters/Path"
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/text:
    get:
      operationId: fsText
      summary: Text content with encoding detection
      description: |
        Reads the start of a text file and decodes it. The encoding comes
        from a byte order mark, then from valid UTF-8, and falls back to
        Windows-1252. Needs the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: max
          in: query
          description: Bytes to read at most.
          schema:
            type: integer
            minimum: 1
            maximum: 16777216
            default: 1048576
      responses:
        "200":
          description: The text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsText"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          description: The file holds binary data.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fs]
  /fs/hex:
    get:
      operationId: fsHex
      summary: A byte range for the hex view
      description: Needs the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: length
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 65536
            default: 4096
      responses:
        "200":
          description: The bytes. Fewer than asked for at the end of the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsHex"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/file:
    get:
      operationId: fsFileGet
      summary: File content for the editor
      description: |
        The whole text of a file up to 16 MiB, decoded like fs/text. The
        ETag follows the bytes, and a save sends it back in If-Match. Needs
        the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The text.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsFile"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The file is too big for the editor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The file holds binary data.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fs]
    put:
      operationId: fsFilePut
      summary: Save a file from the editor
      description: |
        Writes the text in the encoding given, by default the one the file
        has. With If-Match the save only goes through while the file is
        unchanged since it was read, with If-None-Match * only when it does
        not exist yet. The file is written next to the old one and renamed
        over it, keeping mode and owner. A file with hard links is written
        in place, so its other names keep seeing the same content. Needs
        the modify right, or the create right for a new file.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: If-Match
          in: header
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
            enum: ["*"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                encoding:
                  type: string
                  enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1252]
                eol:
                  type: string
                  enum: [lf, crlf, cr]
                  description: Rewrites every line break. Missing keeps them as sent.
      responses:
        "200":
          description: Saved.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsSaved"
        "201":
          description: Saved as a new file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The folder for a new file is missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: The file changed since it was read, or exists already for If-None-Match *.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The text is too big for the editor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The text holds characters the encoding cannot store.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fs]
  /fs/archive-stream:
    post:
      operationId: fsArchiveStream
      summary: Download several paths as one archive
      description: |
        Packs while it sends, so nothing stays behind on the server. Takes
        JSON or a plain form with one paths field per path, which lets a
        browser save the stream as it arrives. Two entries of the same
        name get a number. zip compresses everything but formats that are
        compressed already, tgz keeps mode and owner. Linked folders are
        left out, linked files come along when they point inside the
        source. Needs the download right on every path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: The archive.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
            application/gzip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/mkdir:
    post:
      operationId: fsMkdir
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathBody"
      responses:
        "201":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [fileops]
  /fs/touch:
    post:
      operationId: fsTouch
      summary: Create an empty file or update its time
      description: Answers 201 for a new file, 200 when only the time of an existing one changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                mtime:
                  type: string
                  format: date-time
                  description: The time to set, now when missing.
      responses:
        "200":
          $ref: "#/components/responses/FsChanged"
        "201":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [fileops]
  /fs/rename:
    post:
      operationId: fsRename
      summary: Rename one entry
      description: Renames inside the same folder. An existing entry of the new name is never replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name]
              properties:
                path:
                  type: string
                name:
                  type: string
                  description: The new name, without a folder.
      responses:
        "200":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [fileops]
  /fs/rename/batch:
    post:
      operationId: fsRenameBatch
      summary: Rename many entries with a pattern
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/link:
    post:
      operationId: fsLink
      summary: Create a symbolic or hard link
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/attrs:
    patch:
      operationId: fsAttrs
      summary: Change mode, owner or times
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /ops/preflight:
    post:
      operationId: opsPreflight
      summary: Check a copy or move before it starts
      description: |
        Reports the names that exist at the target, the size, the free
        space and whether a parity check would hold the job, so the
        conflict dialog can ask before the job runs. The answers go into
        the decisions of the job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TransferParams"
                - type: object
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      enum: [copy, move]
      responses:
        "200":
          description: What the transfer would run into.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preflight"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fileops]
  /uploads:
    post:
      operationId: uploadCreate
      summary: Start an upload
      description: |
        Announces a file and its size. The bytes go to ".name.cc-part" next
        to the target and the file takes its name with the last chunk.
        Missing folders on the way are created, so a dropped folder keeps
        its structure. Starting again for the same target and size picks
        up the running upload, which is how a client resumes after a reload
        and how it answers a conflict: it sends the same request with the
        rule it chose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: The running upload for this target, or the finished one when nothing was left to send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "201":
          description: A new upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "507":
          description: Not enough free space for the file.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fileops]
  /uploads/{id}:
    get:
      operationId: uploadGet
      summary: State of an upload, for resuming
      responses:
        "200":
          description: Where the upload stands.
          headers:
            Upload-Offset:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fileops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: uploadChunk
      summary: Send the next chunk
      description: |
        The body is the raw bytes. Upload-Offset, or the start of
        Content-Range, says where they go, and has to match the offset of
        the upload. A chunk may hold up to 64 MiB. When the connection
        breaks, what arrived is kept and GET tells where to go on.
      parameters:
        - name: Upload-Offset
          in: header
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The upload after the chunk. Its state is done once the file has its name.
          headers:
            Upload-Offset:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "410":
          description: The part file disappeared, the upload has to start over.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The chunk goes past the announced size.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fileops]
    delete:
      operationId: uploadCancel
      summary: Cancel an upload
      description: Removes the part file.
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fileops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs:
    get:
      operationId: jobsList
      summary: List jobs
      description: The open jobs in queue order, then the ended ones, newest first. Admins see every user's jobs.
      responses:
        "200":
          description: The jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [jobs]
    post:
      operationId: jobCreate
      summary: Start a job
      description: |
        Kinds: copy, move, delete, trash, restore, emptyTrash, pack, unpack,
        testArchive, checksum, verify, split, combine, attrsRecursive,
        fixPerms, sync, gather, scatter, contentSearch, duplicates,
        fetchUrl, reindex. Built so far: copy, move, delete, trash and
        fixPerms. Restore and emptyTrash start from the trash endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "202":
          description: The job is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [jobs]
    delete:
      operationId: jobsClear
      summary: Remove every ended job from the list
      responses:
        "200":
          description: How many jobs were removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [jobs]
  /jobs/settings:
    get:
      operationId: jobSettingsGet
      summary: Queue and speed settings
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [jobs]
    put:
      operationId: jobSettingsPut
      summary: Change queue and speed settings
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSettings"
      responses:
        "200":
          description: The settings as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [jobs]
  /jobs/{id}:
    get:
      operationId: jobGet
      summary: One job with its items
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    patch:
      operationId: jobChange
      summary: Move a job in the queue or limit its speed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: integer
                  description: New index among the open jobs, from 0.
                cap:
                  type: integer
                  format: int64
                  description: Bytes per second for this job, 0 for no limit.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: jobRemove
      summary: Remove an ended job from the list
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/pause:
    post:
      operationId: jobPause
      summary: Pause a job
      description: A running job stops at its next pause point, at most one MiB later.
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/resume:
    post:
      operationId: jobResume
      summary: Resume a paused job
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/cancel:
    post:
      operationId: jobCancel
      summary: Cancel a job
      description: What is done stays done. A half written file is removed.
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/retry:
    post:
      operationId: jobRetry
      summary: Retry the failed items of a job
      description: Runs the failed and unfinished items of a failed or cancelled job again. Done items stay done.
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/decide:
    post:
      operationId: jobDecide
      summary: Answer a conflict the job is waiting on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                key:
                  type: string
                  description: Key of the conflict, from job.conflict. Empty means the one the job waits on.
                choice:
                  type: string
                  enum: [skip, replace, both, newer]
                all:
                  type: boolean
                  description: Use the choice for every later conflict of this job as well.
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /undo:
    get:
      operationId: undoList
      summary: Steps that can be taken back
      responses:
        "200":
          description: The steps, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps:
                    type: array
                    items:
                      $ref: "#/components/schemas/UndoStep"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [undo]
    post:
      operationId: undoLast
      summary: Take back the latest step
      description: |
        Takes back the step with the given id, or the newest one without a
        body. Renaming and creating are taken back right away and answer
        200. Moving, copying and the trash run as a job and answer 202
        with the job.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/UndoTaken"
        "202":
          $ref: "#/components/responses/UndoTaken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Nothing to take back.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [undo]
  /trash:
    get:
      operationId: trashList
      summary: List the trash
      description: Admins see every user's entries.
      responses:
        "200":
          description: The entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, count, bytes, days]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrashItem"
                  count:
                    type: integer
                  bytes:
                    type: integer
                    format: int64
                  days:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [trash]
  /trash/restore:
    post:
      operationId: trashRestore
      summary: Put entries back where they came from
      description: Runs as a job. Missing folders are created again, a name taken meanwhile gets a number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashIds"
      responses:
        "202":
          $ref: "#/components/responses/JobAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [trash]
  /trash/empty:
    post:
      operationId: trashEmpty
      summary: Empty the trash
      description: Deletes the given entries for good, or every entry the user sees without a body. Runs as a job.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashIds"
      responses:
        "202":
          $ref: "#/components/responses/JobAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [trash]
  /trash/{id}:
    delete:
      operationId: trashDelete
      summary: Delete one entry for good
      description: Runs as a job.
      responses:
        "202":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [trash]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /trash/settings:
    get:
      operationId: trashSettingsGet
      summary: How long the trash keeps entries
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [trash]
    put:
      operationId: trashSettingsPut
      summary: Change how long the trash keeps entries
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashSettings"
      responses:
        "200":
          description: The settings as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [trash]

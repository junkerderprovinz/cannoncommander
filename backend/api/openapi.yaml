            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs/{id}/cancel:
    post:
      operationId: jobCancel
      summary: Cancel a job
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true

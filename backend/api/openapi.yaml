openapi: 3.1.0
info:
  title: CannonCommander API
  version: "1"
  description: |
    Every path in this API is an absolute path as Unraid sees it, for example
    /mnt/user/filme. A path into an archive carries "::" after the archive
    name: /mnt/user/downloads/fotos.zip::/Strand/IMG_0101.jpg.

    Errors come as application/problem+json. Operations that are part of the
    contract but not built yet answer 501.

    Server events arrive on GET /events. See the Event schema for their
    types.
servers:
  - url: /api/v1
security:
  - bearer: []
  - cookie: []
tags:
  - name: fs
    description: Reading files and folders.
  - name: fileops
    description: |
      Creating and renaming, uploads, and the check before a transfer.
      Copying, moving and deleting run as jobs (kinds copy, move, delete and
      trash on POST /jobs). A file in work is written as ".name.cc-part" next
      to its target and only takes its name once it is complete.
  - name: jobs
    description: |
      Long running tasks such as copy, move, pack and checksum. Jobs run on
      the server and go on after a restart. Their progress arrives as
      job.created, job.progress (at most four times a second), job.state,
      job.conflict and job.done events, each with the job or its progress as
      data.
  - name: undo
    description: |
      Taking back the last file operations: renaming, creating, moving,
      copying and moving to the trash. Each user has their own list of up to
      30 steps. undo.changed with the number of steps tells the client to
      reload it.
  - name: trash
    description: |
      Deleted files waiting in the trash. Every share has its own trash
      folder .cc-trash, other sources have one at their top, so moving there
      never copies. Entries go away for good after the days set here.
      Putting things into the trash is the job kind trash. trash.changed
      tells clients to reload the list.
  - name: search
    description: Search by name pattern, fields and content.
  - name: tools
    description: |
      Compare, sync, diff, clean up, checksums, archives and the hand over to
      ArrowLoop. The long runs are jobs: pack, unpack, testArchive, checksum,
      verify, split, combine, attrsRecursive, sync and fetchUrl, started with
      POST /jobs. Their params are described under the schemas Pack, Unpack,
      TestArchive, Checksum, Verify, Split, Combine, Sync and FetchUrl. An
      archive password goes into the params but not into the job table, so a
      job resumed after a restart fails and has to be started again.
  - name: labels
    description: |
      Colour labels and tags on paths. They are shared, every user sees the
      labels of the files they may see. They follow a file when the server
      renames, moves or copies it.
  - name: prefs
    description: Settings, bookmarks, profiles and folder history of the own account.
  - name: accounts
    description: The own account, and users, groups, rules and activity for admins.
  - name: shares
    description: Share links and the public share pages.
  - name: unraid
    description: |
      Array state, file placement and the Unraid tools. Sizes are bytes.
      Outside Unraid the state says available false and placements stay empty.
  - name: remotes
    description: rclone remotes mounted below /mnt/remotes.
  - name: system
    description: Server state and the settings only admins change.
  - name: events
    description: The server event stream and the folders a client watches.
paths:
  /fs/list:
    get:
      operationId: fsList
      summary: List a folder
      description: |
        Lists the entries of a folder in name order. The folders / and /mnt
        are virtual and list the sources below them. Entries the user may
        not see are left out. Folders carry their entry count and total size
        where the index knows them. The ETag follows the entries only, so a
        change in free space alone still answers 304.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The folder and its entries.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsList"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/tree:
    get:
      operationId: fsTree
      summary: Subfolders for the folder tree
      description: |
        Returns the visible subfolders of one folder, one level deep. The
        tree asks again when a folder is opened. Folders where a source is
        mounted carry its name and fill level, folders where an rclone
        remote is mounted carry the remote.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The folder with its subfolders.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsTree"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/stat:
    get:
      operationId: fsStat
      summary: Details of one path
      description: |
        The same fields as a listing row, for one path. A folder also gets
        the number of files and folders anywhere below it, as far as the
        index knows them.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsStat"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/meta:
    post:
      operationId: fsMeta
      summary: Metadata columns for many paths
      description: Takes the visible rows and the wanted columns, returns the values from the metadata cache.
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/raw:
    get:
      operationId: fsRaw
      summary: File content, with range requests
      description: |
        Sends the file as it is, with Range, If-Range and conditional
        requests. Needs the download right. Pages and drawings come with a
        sandbox policy, so their scripts do not run.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: download
          in: query
          description: Ask the browser to save the file instead of showing it.
          schema:
            type: boolean
      responses:
        "200":
          description: The whole file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range.
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The range lies outside the file.
      tags: [fs]
  /fs/thumb:
    get:
      operationId: fsThumb
      summary: Thumbnail of a file or folder picture
      description: |
        A small picture of an image, video, document or album cover. For a
        folder it is the folder's poster.jpg, folder.jpg or cover.jpg. A
        client that adds the file's mtime as v may cache the answer for
        good.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: size
          in: query
          schema:
            type: string
            enum: [small, large]
            default: small
        - name: v
          in: query
          description: Any value that changes with the file, such as its mtime.
          schema:
            type: string
      responses:
        "200":
          description: The picture.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The path does not exist or has no thumbnail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fs]
  /fs/page:
    get:
      operationId: fsPage
      summary: One page of a PDF or office file as an image
      parameters:
        - $ref: "#/components/parameters/Path"
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/text:
    get:
      operationId: fsText
      summary: Text content with encoding detection
      description: |
        Reads the start of a text file and decodes it. The encoding comes
        from a byte order mark, then from valid UTF-8, and falls back to
        Windows-1252. Needs the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: max
          in: query
          description: Bytes to read at most.
          schema:
            type: integer
            minimum: 1
            maximum: 16777216
            default: 1048576
      responses:
        "200":
          description: The text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsText"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          description: The file holds binary data.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [fs]
  /fs/hex:
    get:
      operationId: fsHex
      summary: A byte range for the hex view
      description: Needs the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: length
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 65536
            default: 4096
      responses:
        "200":
          description: The bytes. Fewer than asked for at the end of the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsHex"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fs]
  /fs/file:
    get:
      operationId: fsFileGet
      summary: File content for the editor
      parameters:
        - $ref: "#/components/parameters/Path"
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: fsFilePut
      summary: Save a file from the editor
      parameters:
        - $ref: "#/components/parameters/Path"
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/archive-stream:
    post:
      operationId: fsArchiveStream
      summary: Download several paths as one archive
      tags: [fs]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /fs/mkdir:
    post:
      operationId: fsMkdir
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathBody"
      responses:
        "201":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [fileops]
  /fs/touch:
    post:
      operationId: fsTouch
      summary: Create an empty file or update its time
      description: Answers 201 for a new file, 200 when only the time of an existing one changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                mtime:
                  type: string
                  format: date-time
                  description: The time to set, now when missing.
      responses:
        "200":
          $ref: "#/components/responses/FsChanged"
        "201":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [fileops]
  /fs/rename:
    post:
      operationId: fsRename
      summary: Rename one entry
      description: Renames inside the same folder. An existing entry of the new name is never replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name]
              properties:
                path:
                  type: string
                name:
                  type: string
                  description: The new name, without a folder.
      responses:
        "200":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [fileops]
  /fs/rename/batch:
    post:
      operationId: fsRenameBatch
      summary: Rename many entries with a pattern
      description: |
        Takes either a mask, with the tokens of the rename dialog, or the
        new names in the order of the paths, as the editor sends them. With
        dryRun nothing is renamed and the rows show what would happen.
        Errors per row are empty, invalid, exists and duplicate, compared
        without case. Nothing is renamed while a row has an error. Names
        can trade places. The tools package serves this route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameBatch"
      responses:
        "200":
          description: The rows, renamed unless dryRun was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenameBatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A row has an error, so nothing was renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenameBatchResult"
      tags: [fileops]
  /fs/link:
    post:
      operationId: fsLink
      summary: Create a symbolic or hard link
      description: |
        A symbolic link may point to something that does not exist yet,
        but only to a place inside a source the user may see. A hard link
        needs an existing file on the same source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, path]
              properties:
                target:
                  type: string
                  description: What the link points to, as a full path.
                path:
                  type: string
                  description: Where the link is created.
                hard:
                  type: boolean
      responses:
        "201":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [fileops]
  /fs/attrs:
    patch:
      operationId: fsAttrs
      summary: Change mode, owner or times
      description: |
        Fields left out stay as they are. Owner and group take a name or a
        number. With recursive the change also covers everything inside
        the folders and runs as an attrsRecursive job, answered with 202.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  items:
                    type: string
                mode:
                  type: string
                  example: "0775"
                owner:
                  type: string
                  example: nobody
                group:
                  type: string
                  example: users
                mtime:
                  type: string
                  format: date-time
                recursive:
                  type: boolean
      responses:
        "200":
          description: How many entries changed.
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed:
                    type: integer
        "202":
          description: The change runs as a job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fileops]
  /ops/preflight:
    post:
      operationId: opsPreflight
      summary: Check a copy or move before it starts
      description: |
        Reports the names that exist at the target, the size, the free
        space and whether a parity check would hold the job, so the
        conflict dialog can ask before the job runs. The answers go into
        the decisions of the job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TransferParams"
                - type: object
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      enum: [copy, move]
      responses:
        "200":
          description: What the transfer would run into.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preflight"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [fileops]
  /uploads:
    post:
      operationId: uploadCreate
      summary: Start an upload
      tags: [fileops]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /uploads/{id}:
    get:
      operationId: uploadGet
      summary: State of an upload, for resuming
      tags: [fileops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: uploadChunk
      summary: Send the next chunk
      tags: [fileops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: uploadCancel
      summary: Cancel an upload
      tags: [fileops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /jobs:
    get:
      operationId: jobsList
      summary: List jobs
      description: The open jobs in queue order, then the ended ones, newest first. Admins see every user's jobs.
      responses:
        "200":
          description: The jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [jobs]
    post:
      operationId: jobCreate
      summary: Start a job
      description: |
        Kinds: copy, move, delete, trash, restore, emptyTrash, pack, unpack,
        testArchive, checksum, verify, split, combine, attrsRecursive,
        fixPerms, sync, gather, scatter, contentSearch, duplicates,
        fetchUrl, reindex. Built so far: copy, move, delete, trash,
        fixPerms, pack, unpack, testArchive, checksum, verify, split,
        combine, attrsRecursive, sync and fetchUrl, whose params the tools
        part describes. Restore and emptyTrash start from the trash
        endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "202":
          description: The job is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [jobs]
    delete:
      operationId: jobsClear
      summary: Remove every ended job from the list
      responses:
        "200":
          description: How many jobs were removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [jobs]
  /jobs/settings:
    get:
      operationId: jobSettingsGet
      summary: Queue and speed settings
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [jobs]
    put:
      operationId: jobSettingsPut
      summary: Change queue and speed settings
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSettings"
      responses:
        "200":
          description: The settings as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [jobs]
  /jobs/{id}:
    get:
      operationId: jobGet
      summary: One job with its items
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    patch:
      operationId: jobChange
      summary: Move a job in the queue or limit its speed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: integer
                  description: New index among the open jobs, from 0.
                cap:
                  type: integer
                  format: int64
                  description: Bytes per second for this job, 0 for no limit.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: jobRemove
      summary: Remove an ended job from the list
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/pause:
    post:
      operationId: jobPause
      summary: Pause a job
      description: A running job stops at its next pause point, at most one MiB later.
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/resume:
    post:
      operationId: jobResume
      summary: Resume a paused job
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/cancel:
    post:
      operationId: jobCancel
      summary: Cancel a job
      description: What is done stays done. A half written file is removed.
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/retry:
    post:
      operationId: jobRetry
      summary: Retry the failed items of a job
      description: Runs the failed and unfinished items of a failed or cancelled job again. Done items stay done.
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/decide:
    post:
      operationId: jobDecide
      summary: Answer a conflict the job is waiting on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                key:
                  type: string
                  description: Key of the conflict, from job.conflict. Empty means the one the job waits on.
                choice:
                  type: string
                  enum: [skip, replace, both, newer]
                all:
                  type: boolean
                  description: Use the choice for every later conflict of this job as well.
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /undo:
    get:
      operationId: undoList
      summary: Steps that can be taken back
      responses:
        "200":
          description: The steps, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps:
                    type: array
                    items:
                      $ref: "#/components/schemas/UndoStep"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [undo]
    post:
      operationId: undoLast
      summary: Take back the latest step
      description: |
        Takes back the step with the given id, or the newest one without a
        body. Renaming and creating are taken back right away and answer
        200. Moving, copying and the trash run as a job and answer 202
        with the job.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/UndoTaken"
        "202":
          $ref: "#/components/responses/UndoTaken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Nothing to take back.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [undo]
  /trash:
    get:
      operationId: trashList
      summary: List the trash
      description: Admins see every user's entries.
      responses:
        "200":
          description: The entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, count, bytes, days]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrashItem"
                  count:
                    type: integer
                  bytes:
                    type: integer
                    format: int64
                  days:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [trash]
  /trash/restore:
    post:
      operationId: trashRestore
      summary: Put entries back where they came from
      description: Runs as a job. Missing folders are created again, a name taken meanwhile gets a number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashIds"
      responses:
        "202":
          $ref: "#/components/responses/JobAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [trash]
  /trash/empty:
    post:
      operationId: trashEmpty
      summary: Empty the trash
      description: Deletes the given entries for good, or every entry the user sees without a body. Runs as a job.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashIds"
      responses:
        "202":
          $ref: "#/components/responses/JobAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [trash]
  /trash/{id}:
    delete:
      operationId: trashDelete
      summary: Delete one entry for good
      description: Runs as a job.
      responses:
        "202":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [trash]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /trash/settings:
    get:
      operationId: trashSettingsGet
      summary: How long the trash keeps entries
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [trash]
    put:
      operationId: trashSettingsPut
      summary: Change how long the trash keeps entries
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashSettings"
      responses:
        "200":
          description: The settings as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [trash]
  /search:
    get:
      operationId: search
      summary: Search below a folder
      tags: [search]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /search/saved:
    get:
      operationId: savedSearchesList
      summary: Saved searches
      description: The own saved searches, oldest first.
      responses:
        "200":
          description: The saved searches.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedSearch"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [search]
    post:
      operationId: savedSearchCreate
      summary: Save a search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchInput"
      responses:
        "201":
          description: The new saved search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: There are 200 saved searches already.
      tags: [search]
  /search/saved/{id}:
    put:
      operationId: savedSearchUpdate
      summary: Change a saved search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchInput"
      responses:
        "200":
          description: The changed saved search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [search]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: savedSearchDelete
      summary: Delete a saved search
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [search]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /tools/compare:
    post:
      operationId: toolsCompare
      summary: Compare two folders
      description: |
        States are same, newerL, newerR, differ, onlyL and onlyR. Two files
        are the same with the same size and times less than two seconds
        apart, or with content the same bytes. With top, folders are
        compared by their total size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareRequest"
      responses:
        "200":
          description: Every name with its state, and how many of each.
          content:
            application/json:
              schema:
                type: object
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Compared"
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [tools]
  /tools/sync/plan:
    post:
      operationId: toolsSyncPlan
      summary: Plan a sync between two folders
      description: |
        A dry run that writes nothing. A step that would overwrite something
        newer starts switched off and says why. The steps the user keeps go
        to a sync job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [left, right, direction]
              properties:
                left:
                  type: string
                right:
                  type: string
                direction:
                  type: string
                  enum: [right, left, both]
                content:
                  type: boolean
                recursive:
                  type: boolean
                mirror:
                  type: boolean
                  description: Delete on the target what the source lacks. Only with one direction.
                hidden:
                  type: boolean
      responses:
        "200":
          description: The steps.
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncStep"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [tools]
  /tools/diff:
    post:
      operationId: toolsDiff
      summary: Compare two files line by line
      description: |
        Rows pair a line of the left file with one of the right by index.
        Binary files are compared as hex lines of 16 bytes, up to 1 MiB.
        Text files are compared up to 8 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [left, right]
              properties:
                left:
                  type: string
                right:
                  type: string
      responses:
        "200":
          description: Both files and the rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/ToolFailed"
        "422":
          $ref: "#/components/responses/ToolFailed"
      tags: [tools]
  /tools/duplicates:
    post:
      operationId: toolsDuplicates
      summary: Find duplicate files
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/diskusage:
    get:
      operationId: toolsDiskUsage
      summary: Sizes below a folder for the treemap
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /tools/cleanup/scan:
    post:
      operationId: toolsCleanupScan
      summary: Find files that can go
      description: |
        Groups are emptyDir, emptyFile, temp and link, which go to the trash,
        and ext and name, which get the name in to. Each group holds at most
        5000 finds, capped says when that cut something off. Removing and
        renaming go through the trash job and POST /fs/rename/batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "200":
          description: The finds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupScan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [tools]
  /tools/checksum/parse:
    post:
      operationId: toolsChecksumParse
      summary: Read a checksum file
      description: Reads GNU lines such as sha256sum writes and BSD lines such as SHA256 (name) = hash, from a file or from pasted text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                text:
                  type: string
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    items:
                      $ref: "#/components/schemas/SumLine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [tools]
  /tools/archives:
    get:
      operationId: toolsArchiveFormats
      summary: Archive formats this server reads and writes
      description: 7z needs 7zz and rar needs the rar program, which is not part of the image.
      responses:
        "200":
          description: The formats.
          content:
            application/json:
              schema:
                type: object
                required: [read, pack]
                properties:
                  read:
                    type: array
                    items:
                      type: string
                  pack:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [tools]
  /tools/archive:
    get:
      operationId: toolsArchiveInfo
      summary: What an archive holds
      description: The password of an encrypted archive goes in the header X-Archive-Password. Without the right one the answer is 428.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: Entries and the unpacked size.
          content:
            application/json:
              schema:
                type: object
                required: [path, format, entries, unpacked, encrypted]
                properties:
                  path:
                    type: string
                  format:
                    type: string
                  entries:
                    type: integer
                  unpacked:
                    type: integer
                    format: int64
                  encrypted:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ToolFailed"
        "428":
          $ref: "#/components/responses/ToolFailed"
      tags: [tools]
  /tools/arrowloop:
    post:
      operationId: toolsArrowLoop
      summary: Hand a folder pair to ArrowLoop as a job
      description: |
        Creates a job in the ArrowLoop set up under Integrations through its
        POST /api/jobs, with the token from the same place. Paths are
        renamed by the path map of the integration. The user needs the
        rights here that the job will use there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, left, right, direction, every]
              properties:
                name:
                  type: string
                left:
                  type: string
                right:
                  type: string
                direction:
                  type: string
                  enum: [right, left, both]
                mirror:
                  type: boolean
                every:
                  type: string
                  enum: [hourly, daily, weekly]
                at:
                  type: string
                  example: "03:00"
      responses:
        "201":
          description: The job as ArrowLoop stored it, and ArrowLoop's address.
          content:
            application/json:
              schema:
                type: object
                required: [job, url]
                properties:
                  job:
                    type: object
                  url:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"
        "502":
          $ref: "#/components/responses/ToolFailed"
        "503":
          $ref: "#/components/responses/ToolFailed"
      tags: [tools]
  /labels:
    get:
      operationId: labelsGet
      summary: Colours and tags with their names
      description: The colours in their order and every tag in German alphabetical order, each with the number of paths carrying it.
      responses:
        "200":
          description: The colour and tag lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelLists"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [labels]
  /labels/colours:
    put:
      operationId: labelColoursPut
      summary: Rename or recolour the colour labels
      description: |
        Replaces the colour list, in the given order. An entry with an id
        changes that colour, one without is a new colour. Colours left out
        are taken off every path. Sends labels.changed to everyone.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [colours]
              properties:
                colours:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required: [name, hex]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                        description: Empty keeps the name the app gives its own colours.
                      hex:
                        type: string
                        example: "#2ec4b6"
      responses:
        "200":
          description: The new lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelLists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
  /labels/tags:
    put:
      operationId: labelTagsPut
      summary: Change the list of tags
      description: |
        Replaces the tag list. An entry with from renames that tag on every
        path, and two tags renamed to the same name become one. An entry
        without from is a tag no file needs to carry yet. Tags left out are
        taken off every path. Sends labels.changed to everyone.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [name]
                    properties:
                      from:
                        type: string
                      name:
                        type: string
      responses:
        "200":
          description: The new lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelLists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
  /labels/items:
    get:
      operationId: labelItemsGet
      summary: Labels of the entries in a folder
      description: |
        The labelled entries of a folder the user may see, keyed by name.
        With deep=true everything below the folder, keyed by the path
        relative to it, for the flat view and search results.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: deep
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The labels.
          content:
            application/json:
              schema:
                type: object
                required: [path, items]
                properties:
                  path:
                    type: string
                  items:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/Label"
                example:
                  path: /mnt/user/dokumente
                  items:
                    Mietvertrag.pdf: {colour: red, tags: [wichtig]}
                    Rechnung-Oktober.pdf: {tags: [Steuer]}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
    put:
      operationId: labelItemsPut
      summary: Set colour and tags on paths
      description: |
        Changes the labels of up to 10000 paths at once. colour sets the
        colour, an empty colour clears it. tags replaces the tags, add and
        remove adjust them. Fields left out stay as they are. Needs the
        right to change each path, so read only places carry no labels.
        Sends labels.changed to the watchers of each folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: string
                colour:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                add:
                  type: array
                  items:
                    type: string
                remove:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The labels the paths carry after the change, keyed by path. An empty object means no label.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
  /me/prefs:
    get:
      operationId: prefsGet
      summary: Own settings
      description: |
        Returns the settings as one flat object, as the interface keeps
        them. Settings never saved are left out, so the client keeps its
        own defaults for them. With a device the device settings (dual,
        side, fkeys, colWidths) of that device lie on top of the others.
      parameters:
        - $ref: "#/components/parameters/Device"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    put:
      operationId: prefsPut
      summary: Save own settings
      description: |
        Replaces the settings with the given object. With a device the
        device settings are stored for that device and the rest for the
        user. Without one everything is stored for the user, and the user's
        values serve devices that have none of their own. Known settings
        have to keep their JSON type. Sends prefs.changed to the user.
      parameters:
        - $ref: "#/components/parameters/Device"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prefs"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The settings are larger than 256 KiB.
      tags: [prefs]
  /me/bookmarks:
    get:

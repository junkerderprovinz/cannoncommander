  /me/rename-presets:
    get:
      operationId: renamePresetsGet
      summary: Saved rename patterns
      description: The user's own presets. The presets that come with the app live in the client.
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenamePresetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    put:
      operationId: renamePresetsPut
      summary: Save rename patterns
      description: Replaces the list. Names have to be unique.
      requestBody:
        required: true

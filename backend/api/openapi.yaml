      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSettings"
      responses:
        "200":
          description: The settings as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [jobs]
  /jobs/{id}:
    get:
      operationId: jobGet
      summary: One job with its items
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [jobs]
      parameters:
        - name: id
          in: path

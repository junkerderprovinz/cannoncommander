  /shares:
    get:
      operationId: sharesList
      summary: Own share links
      responses:
        "200":
          description: The links, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Share"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [shares]
    post:
      operationId: shareCreate
      summary: Create a share link
      description: |
        Needs the share right and the download right on every path. One
        path makes a file or folder link, several make a collection, which
        needs a name. Uploads work only for a link to one folder and need
        the create right there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareCreate"
      responses:
        "201":
          description: The new link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The address is taken.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [shares]
  /shares/{id}:
    get:
      operationId: shareGet
      summary: One share link
      description: For its owner and for admins.
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [shares]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    patch:
      operationId: shareUpdate
      summary: Change a share link
      description: |
        Fields left out stay as they are. An expiry of null makes the link
        last, an empty password removes it. Setting a password or a new
        one closes the link in every browser that unlocked it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareUpdate"
      responses:
        "200":
          description: The link as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The address is taken.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [shares]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: shareDelete
      summary: Delete a share link
      description: The address leads nowhere afterwards, and uploads running through it stop.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [shares]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /admin/shares:
    get:
      operationId: adminSharesList
      summary: Every share link on the server
      x-access: admin
      responses:
        "200":
          description: The links of all users, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Share"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [shares]
  /s/{slug}:
    get:
      operationId: publicShareGet
      summary: What a share link shows
      description: |
        A link with a password tells only that it is locked until the
        visitor unlocks it. Opening a link counts as a view and sends
        share.opened to its owner, once per visitor within half an hour,
        and with notify on also a notice to Unraid.
      x-access: public
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicShare"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/ShareGone"
        "429":
          $ref: "#/components/responses/TooManyTries"
      tags: [shares]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      security: []
  /s/{slug}/unlock:
    post:
      operationId: publicShareUnlock
      summary: Open a share link with its password
      description: |
        Answers a token for twelve hours and sets it as a cookie as well.
        Apps send it in X-Share-Token, plain links to files in the token
        query. Five wrong passwords make the address wait a few minutes.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareUnlocked"
        "403":
          description: The password is wrong.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/ShareGone"
        "429":
          $ref: "#/components/responses/TooManyTries"
      tags: [shares]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      security: []
  /s/{slug}/list:
    get:
      operationId: publicShareList
      summary: List a folder inside a share
      description: |
        The root of a collection lists its entries, two of the same name
        with a number. Entries starting with a dot are left out.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/SharePath"
        - $ref: "#/components/parameters/ShareToken"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/ShareGone"
      tags: [shares]
      security: []
  /s/{slug}/raw:
    get:
      operationId: publicShareRaw
      summary: Download a file from a share
      description: |
        A file is sent with range requests. With download it counts
        against the download limit, unless it goes on with a download that
        broke off. Viewing in the browser is free. A folder, or the root of
        a collection, comes as one zip or tar.gz and always counts.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/SharePath"
        - $ref: "#/components/parameters/ShareToken"
        - name: download
          in: query
          schema:
            type: boolean
        - name: format
          in: query
          description: Archive format for a folder.
          schema:
            type: string
            enum: [zip, tgz]
            default: zip
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file or the archive.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range.
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/ShareGone"
      tags: [shares]
      security: []
  /s/{slug}/upload:
    post:
      operationId: publicShareUpload
      summary: Drop a file into a collecting share
      description: |
        Starts an upload like POST /uploads, into a folder link that takes
        uploads. A link adds files but never replaces one: a name that
        exists gets a number, or with skip the file is left out. The chunks
        go to /s/{slug}/upload/{id}, and a visitor resumes by that id. The
        link's upload limit counts the uploads still running as well, and
        at most 20 can run at once.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                path:
                  type: string
                  description: Folder inside the link.
                  default: /
                name:
                  type: string
                  description: File name, with folders in front for a dropped folder.
                  example: Urlaub/IMG_0101.jpg
                size:
                  type: integer
                  format: int64
                  minimum: 0
                mtime:
                  type: string
                  format: date-time
                rule:
                  type: string
                  enum: [both, skip]
                  default: both
      responses:
        "200":
          description: Nothing was left to send, see state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "201":
          description: The upload, with its path inside the link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ShareLocked"
        "403":
          description: The link takes no uploads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/ShareGone"
        "413":
          description: The file does not fit into the upload limit of the link.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many uploads are running through the link.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "507":
          description: Not enough free space for the file.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [shares]
      security: []
  /s/{slug}/upload/{id}:
    get:
      operationId: publicShareUploadGet
      summary: State of an upload into a share
      x-access: public
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Where the upload stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [shares]
      security: []
    put:
      operationId: publicShareUploadChunk
      summary: Send the next chunk of an upload into a share
      description: Works like PUT /uploads/{id}.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: Upload-Offset
          in: header
          schema:
            type: integer
            format: int64
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The upload after the chunk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "413":
          description: The chunk goes past the announced size.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [shares]
      security: []
    delete:
      operationId: publicShareUploadCancel
      summary: Cancel an upload into a share
      x-access: public
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [shares]
      security: []
  /unraid/state:
    get:
      operationId: unraidState
      summary: Disks, shares, pools and parity
      description: |
        Read from emhttp's disks.ini, shares.ini and var.ini, the share
        settings on the flash drive and /proc/mdstat. Empty array slots are
        left out.
      responses:
        "200":
          description: The server state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidState"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [unraid]
  /unraid/where:
    get:
      operationId: unraidWhere
      summary: On which disks a path lies
      description: |
        A path in /mnt/user is looked up on every disk and pool. A folder
        reports its size per disk, a file with several hard links also the
        other names the user may see. Very large folders answer with
        partial true.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: Where the path lies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidWhere"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [unraid]
  /unraid/transfer:
    post:
      operationId: unraidTransfer
      summary: Check a copy, move or link against Unraid
      description: |
        Finds files that are the same at both ends through a disk share and
        the user share above it, hard links the transfer breaks, whether the
        files fit onto the disk Unraid would pick, and which sleeping disks
        it wakes. ops/preflight carries the same report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnraidTransfer"
      responses:
        "200":
          description: What Unraid adds to the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidTransferReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [unraid]
  /unraid/spindown:
    post:
      operationId: unraidSpindown
      summary: Spin disks down
      description: Needs write access to Unraid, which is off by default. Without disks every disk spins down.
      x-access: admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disks:
                  type: array
                  items:
                    type: string
                  example: [disk1, disk3]
      responses:
        "200":
          description: The disks told to spin down.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [unraid]
  /unraid/gather/plan:
    post:
      operationId: unraidGatherPlan
      summary: Plan moving a folder onto one disk
      description: |
        gather brings the folder onto one disk, scatter empties one disk of
        it onto the others with whole subfolders kept together. Without disk
        the plan suggests one.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, mode]
              properties:
                path:
                  type: string
                  example: /mnt/user/medien/Filme
                mode:
                  type: string
                  enum: [gather, scatter]
                disk:
                  type: string
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidGatherPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [unraid]
  /unraid/fixperms/scan:
    post:
      operationId: unraidFixpermsScan
      summary: Find entries with the wrong owner or mode
      description: |
        Counts what the fixPerms job would change. appdata, system, the VM
        folders and the flash drive keep their owners and are listed in
        kept, or named in blocked when the folder itself is one of them.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "200":
          description: The scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidPermsScan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [unraid]
  /unraid/notify/test:
    post:
      operationId: unraidNotifyTest
      summary: Send a test notification
      description: |
        Needs write access to Unraid. The notice shows in the Unraid web
        interface, the notification agents do not run for it.
      x-access: admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                description:
                  type: string
      responses:
        "204":
          description: The notice was written.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [unraid]
  /remotes:
    get:
      operationId: remotesList
      summary: Configured remotes
      description: |
        mounted is the live state, mountOnStart what the server mounts when
        it starts. Admins also get the parameters, without secrets.
      responses:
        "200":
          description: The remotes and the state of rclone.
          content:
            application/json:
              schema:
                type: object
                required: [remotes, rclone]
                properties:
                  remotes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Remote"
                  rclone:
                    $ref: "#/components/schemas/RcloneStatus"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [remotes]
    post:
      operationId: remoteCreate
      summary: Add a remote
      description: |
        Adds the remote to rclone.conf and mounts it, below /mnt/remotes
        unless mount says otherwise. A mount that fails leaves the remote in
        place with the reason in error.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteInput"
      responses:
        "201":
          description: The new remote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/RemoteConflict"
        "503":
          $ref: "#/components/responses/RcloneUnavailable"
      tags: [remotes]
  /remotes/types:
    get:
      operationId: remoteTypes
      summary: Remote types rclone knows
      description: |
        SFTP, SMB, WebDAV, S3, Google Drive, OneDrive and Dropbox come first
        with featured set. Types with oauth log in through rclone authorize
        on a computer with a browser, authorize is the command for it.
      parameters:
        - name: advanced
          in: query
          description: Include the advanced options.
          schema:
            type: boolean
      responses:
        "200":
          description: The types.
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items:
                      $ref: "#/components/schemas/RemoteType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/RcloneUnavailable"
      tags: [remotes]
  /remotes/test:
    post:
      operationId: remoteTest
      summary: Try a remote configuration
      description: |
        Lists the folder of the remote without saving anything. With the
        name of a saved remote of the same type, its saved parameters fill
        in what the body leaves out, such as an unchanged password. A remote
        that does not answer is a result with ok false, not an error.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteInput"
      responses:
        "200":
          description: What the test found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/RcloneUnavailable"
      tags: [remotes]
  /remotes/oauth:
    post:
      operationId: remoteOAuth
      summary: Store a token from rclone authorize
      description: |
        token is what rclone authorize printed, the lines around the token
        may stay. With name the token goes into that remote, which is
        mounted again if it was. Without name the checked token comes back
        for params.token of the remote the add dialog creates.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                type:
                  type: string
                  example: drive
                token:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: The checked token, or the remote that took it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiry:
                    type: string
                    format: date-time
                  remote:
                    $ref: "#/components/schemas/Remote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/RcloneUnavailable"
      tags: [remotes]
  /remotes/{name}:
    get:
      operationId: remoteGet
      summary: One remote
      responses:
        "200":
          description: The remote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remote"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: remoteUpdate
      summary: Change a remote
      description: |
        Fields left out stay. A parameter with an empty value is removed,
        except a secret, which then stays. The type stays, a new name moves
        the remote over. A mounted remote is mounted again afterwards.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteInput"
      responses:
        "200":
          description: The changed remote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RemoteConflict"
        "503":
          $ref: "#/components/responses/RcloneUnavailable"
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: remoteDelete
      summary: Remove a remote
      description: Unmounts the remote and forgets it with its credentials. The files at the remote stay.
      x-access: admin
      responses:
        "204":
          description: The remote is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RemoteConflict"
        "503":
          $ref: "#/components/responses/RcloneUnavailable"
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
  /remotes/{name}/mount:
    post:
      operationId: remoteMount
      summary: Mount a remote
      description: Mounts the remote with the cache settings of admin/app and keeps it mounted across restarts.
      x-access: admin
      responses:
        "200":
          description: The mounted remote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RemoteConflict"
        "503":
          $ref: "#/components/responses/RcloneUnavailable"
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
  /remotes/{name}/unmount:
    post:
      operationId: remoteUnmount
      summary: Unmount a remote
      description: Unmounts the remote and leaves it unmounted across restarts.
      x-access: admin
      responses:
        "200":
          description: The unmounted remote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RemoteConflict"
        "503":
          $ref: "#/components/responses/RcloneUnavailable"
      tags: [remotes]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
  /system:
    get:
      operationId: systemGet
      summary: Version, uptime and available features
      description: |
        The helper programs are looked up once per start. Office tells the
        viewers where office files open, without the secret. The ETag leaves
        the uptime out.
      responses:
        "200":
          description: The server state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [system]
  /admin/sources:
    get:
      operationId: sourcesGet
      summary: Configured sources
      description: |
        The saved sources, or the ones from the config file while nothing
        was saved. restartNeeded is set while the saved ones differ from the
        ones the server runs with.
      x-access: admin
      responses:
        "200":
          description: The sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSources"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [system]
    put:
      operationId: sourcesPut
      summary: Save sources
      description: |
        Replaces the whole list. The sources are saved in sources.json next
        to the config file and take over from the config on the next start.
        Every folder has to exist, names and folders are unique. An exclude
        pattern is a name, a path below the source, or a name with a star at
        its start or end, such as *.tmp or backup-*.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sources]
              properties:
                sources:
                  type: array
                  items:
                    $ref: "#/components/schemas/AdminSource"
      responses:
        "200":
          description: The saved sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSources"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [system]
  /admin/index:
    get:
      operationId: indexState
      summary: State of the index per source
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: indexRebuild
      summary: Rebuild the index of a source
      x-access: admin
      tags: [system]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /admin/integrations/test:
    post:
      operationId: integrationsTest
      summary: Try an integration such as an office server
      description: |
        Asks the server for its health and version and checks the secret or
        token. No file and no user data are sent. Without secret or token
        the saved one is used when the address is the saved one. A server
        that cannot be reached is a result with reachable false, not an
        error.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationTest"
      responses:
        "200":
          description: What the test found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [system]
  /admin/app:
    get:
      operationId: appSettingsGet
      summary: Server wide settings
      description: Secrets are never sent, secretSet and tokenSet say whether one is saved.
      x-access: admin
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [system]
    put:
      operationId: appSettingsPut
      summary: Save server wide settings
      description: |
        Only the fields in the body change, so a page can save one switch
        at a time. A secret or token left out stays, an empty one is
        removed. Office, previews and the log level apply at once, WebDAV
        and the update check on the next start.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettings"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [system]
  /system/update:
    post:
      operationId: systemUpdate
      summary: Look for a new release
      description: |
        Asks GitHub for the newest release, at most every ten minutes. The
        image itself is updated on Unraid's Docker tab.
      responses:
        "200":
          description: The installed and the newest version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: GitHub could not be asked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [system]
  /admin/app/restart:
    post:
      operationId: appRestart
      summary: Restart the server
      description: |
        The server shuts down as on a stop, unmounting the remotes, and
        starts itself again in the same container. Running jobs stop and
        continue after the start.
      x-access: admin
      responses:
        "202":
          description: The restart begins in a moment.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [system]
  /admin/app/export:
    get:
      operationId: appExportGet
      summary: Download the settings file
      description: Passwords, tokens, passkeys and the credentials of remotes never go into it.
      x-access: admin
      parameters:
        - name: users
          in: query
          description: Take users, groups and rules along.
          schema:
            type: boolean
      responses:
        "200":
          description: The settings file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [system]
    post:
      operationId: appExport
      summary: Write the settings file on the server
      description: |
        Writes the file to a path below a source, such as
        /mnt/user/appdata/cannoncommander/exports/settings.json. An existing
        file is never replaced.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsFileRequest"
      responses:
        "201":
          description: The file is written.
          content:
            application/json:
              schema:
                type: object
                required: [path, size]
                properties:
                  path:
                    type: string
                  size:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: There is a file of that name already.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [system]
  /admin/app/import:
    post:
      operationId: appImport
      summary: Take the settings from a settings file on the server
      description: |
        Sources and app settings replace the ones here, passwords and
        secrets saved here stay. Remotes this server lacks are added without
        credentials and stay unmounted, the ones it has stay as they are.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsFileRequest"
      responses:
        "200":
          description: What was taken over.
          content:
            application/json:
              schema:
                type: object
                required: [sections, notes, restartNeeded]
                properties:
                  sections:
                    type: array
                    items:
                      type: string
                    example: [sources, app, remotes]
                  notes:
                    type: array
                    items:
                      type: string
                    description: What was left out and why, in English.
                  restartNeeded:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [system]
  /office/config:
    get:
      operationId: officeConfig
      summary: What the viewer needs to open a file in the office server
      description: |
        For OnlyOffice and Euro-Office the editor config, signed with the
        server's JWT secret when one is set. Users who may not change the
        file get it in view mode. For Collabora the editor address with
        WOPISrc, the access token and its end in milliseconds, to post into
        the editor frame as access_token and access_token_ttl.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: mode
          in: query
          description: view opens the file read only, for a preview.
          schema:
            type: string
            enum: [edit, view]
      responses:
        "200":
          description: How to open the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No office server is set up.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Collabora did not answer its discovery.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [office]
  /office/file:
    get:
      operationId: officeFile
      summary: The document for OnlyOffice and Euro-Office
      x-access: public
      parameters:
        - $ref: "#/components/parameters/OfficeToken"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [office]
      security: []
  /office/callback:
    post:
      operationId: officeCallback
      summary: Where OnlyOffice and Euro-Office report and save a document
      description: |
        With a JWT secret only signed callbacks count. On status 2 and 6
        the document is fetched from the document server, only from its
        own address, and replaces the file. The answer is always
        {"error":0} or {"error":1}, as the document server expects.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/OfficeToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                status:
                  type: integer
                url:
                  type: string
                token:
                  type: string
      responses:
        "200":
          description: The answer for the document server.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: integer
                    enum: [0, 1]
      tags: [office]
      security: []
  /wopi/files/{id}:
    get:
      operationId: wopiCheckFileInfo
      summary: WOPI CheckFileInfo
      x-access: public
      parameters:
        - $ref: "#/components/parameters/WopiToken"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Name, size, version and the user's rights.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [office]
      security: []
    post:
      operationId: wopiLock
      summary: WOPI LOCK, GET_LOCK, REFRESH_LOCK and UNLOCK
      description: The operation comes in X-WOPI-Override, the lock in X-WOPI-Lock. A lock holds 30 minutes.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/WopiToken"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Done, X-WOPI-Lock carries the lock.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another lock is in the way, X-WOPI-Lock names it.
      tags: [office]
      security: []
  /wopi/files/{id}/contents:
    get:
      operationId: wopiGetFile
      summary: WOPI GetFile
      x-access: public
      parameters:
        - $ref: "#/components/parameters/WopiToken"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [office]
      security: []
    post:
      operationId: wopiPutFile
      summary: WOPI PutFile
      description: |
        Replaces the file with the body. A file locked by someone else, or
        changed since the time in X-COOL-WOPI-Timestamp, answers 409.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/WopiToken"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  LastModifiedTime:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Locked by someone else, or changed meanwhile.
      tags: [office]
      security: []
  /events:
    get:
      operationId: eventsStream
      summary: Server events as SSE
      description: |
        Opens a text/event-stream. Each frame has "id:", "event:" and a
        "data:" line holding an Event. Heartbeats come every 25 seconds
        without an id. After a reconnect with Last-Event-ID the missed
        events follow first, or a single resync event when they are gone.
      parameters:
        - name: clientId
          in: query
          description: Chosen by the client once per tab, it ties the watched folders to this stream. Without it the stream carries only the events that are not about watched folders.
          schema:
            type: string
            maxLength: 64
        - name: lastEventId
          in: query
          description: Same as the Last-Event-ID header, for clients that cannot set headers.
          schema:
            type: integer
            format: int64
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [events]
  /events/watch:
    put:
      operationId: eventsWatch
      summary: Set the folders a client watches
      description: |
        Replaces the watched folders of a client. For each of them the stream
        delivers fs.changed with topic fs:<path>. Folders stay watched for two
        minutes after the stream closes, so a reconnect keeps them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRequest"
      responses:
        "200":
          description: The watched folders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [events]
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token or a session token.
    cookie:
      type: apiKey
      in: cookie
      name: filebrowser_quantum_jwt
      description: The session cookie the web app gets on login.
  parameters:
    Path:
      name: path
      in: query
      required: true
      description: Absolute path.
      schema:
        type: string
        example: /mnt/user/filme
    Device:
      name: device
      in: query
      description: An id the client picks once per device and keeps, up to 64 letters, digits, - and _.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
    SharePath:
      name: path
      in: query
      description: Path inside the link, "/" for its root.
      schema:
        type: string
        default: /
    ShareToken:
      name: token
      in: query
      description: Unlock token of a link with a password, for when no header or cookie can carry it.
      schema:
        type: string
    OfficeToken:
      name: token
      in: query
      required: true
      schema:
        type: string
    WopiToken:
      name: access_token
      in: query
      required: true
      schema:
        type: string
  responses:
    NotImplemented:
      description: Part of the contract, not built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed for this user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The path does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UploadConflict:
      description: |
        Either a file of this name exists and the rule is ask, then
        conflict tells both sides, or the chunk does not start at the
        offset of the upload, then upload tells where it stands. A start
        for a target another upload is writing answers 409 as well.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  upload:
                    $ref: "#/components/schemas/Upload"
                  conflict:
                    $ref: "#/components/schemas/JobConflict"
    FsChanged:
      description: The entry as it is now, and the undo step for it.
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path:
                type: string
              created:
                type: boolean
              undo:
                type: string
                description: Id of the undo step, for POST /undo.
    JobAnswer:
      description: The job after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Job"
    StateConflict:
      description: The request does not fit the current state, for example a name that exists already.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UndoTaken:
      description: The step that was taken back, and the job doing it.
      content:
        application/json:
          schema:
            type: object
            required: [step]
            properties:
              step:
                $ref: "#/components/schemas/UndoStep"
              job:
                $ref: "#/components/schemas/Job"
    ToolFailed:
      description: The tool cannot do it, the detail says why, such as a file too big, a missing password or ArrowLoop not answering.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ShareGone:
      description: The link expired, used up its downloads, or its owner may no longer share.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ShareLocked:
      description: The link has a password and was not unlocked.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyTries:
      description: Too many wrong passwords or unknown addresses. Retry-After says when to go on.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RemoteConflict:
      description: The name is taken, or a mount is busy or failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RcloneUnavailable:
      description: rclone is not installed or not running yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Event:
      type: object
      description: |
        One server event. The SSE frame carries the type as "event:" and the
        id as "id:", and this object as "data:". Reconnect with the
        Last-Event-ID header (or lastEventId query) to receive what was
        missed. A resync event means the gap was too large and the client
        should reload its state.
      required: [id, type, time]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - heartbeat
            - resync
            - notify
            - job.created
            - job.progress
            - job.state
            - job.conflict
            - job.done
            - fs.changed
            - trash.changed
            - labels.changed
            - undo.changed
            - share.opened
            - unraid.parity
            - unraid.spin
            - index.progress
            - search.hits
            - prefs.changed
        topic:
          type: string
          description: Set for events that only subscribers see, for example fs:/mnt/user/filme.
        time:
          type: string
          format: date-time
        data:
          description: Payload, its shape depends on the type.
    FsItem:
      type: object
      required: [name, dir, size, mtime, mode]
      properties:
        name:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
          description: Bytes. For a folder the total size from the index, 0 while the index has not measured it.
        mtime:
          type: string
          format: date-time
          description: Modification time in UTC with milliseconds.
        btime:
          type: string
          format: date-time
          description: Creation time, where the file system records it.
        mode:
          type: string
          description: Permission bits in octal, with setuid, setgid and sticky in front.
          example: "0664"
        owner:
          type: string
          description: User name, or the number when the container does not know it.
        group:
          type: string
        uid:
          type: integer
        gid:
          type: integer
        ino:
          type: integer
          format: int64
          description: Inode number. Missing below /mnt/user in a listing, because the share reports numbers of its own. fs/stat gives the one on the disk.
        nlink:
          type: integer
          format: int64
          description: Number of hard links.
        hidden:
          type: boolean
          description: The name starts with a dot.
        link:
          type: string
          description: Target of a symbolic link.
        items:
          type: integer
          description: Entries directly inside a folder. Missing when neither the index nor a quick look could count them.
        format:
          type: string
          description: Format group of a file, an id from formats.json such as video or archive.
        picture:
          type: string
          description: Name of the folder's poster.jpg, folder.jpg or cover.jpg, for the card views.
        pool:
          type: string
          description: Under /mnt/user, the Unraid pool that holds the entry, such as cache.
        remote:
          type: string
          description: The rclone remote mounted at this folder.
    Volume:
      type: object
      required: [path, free, total]
      properties:
        path:
          type: string
          description: Where the source is mounted.
        label:
          type: string
          description: Name of the source.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FsList:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsItem"
        volume:
          $ref: "#/components/schemas/Volume"
          description: Missing for the virtual folders / and /mnt.
    FsTreeItem:
      type: object
      required: [name, path, hasDirs]
      properties:
        name:
          type: string
        path:
          type: string
        hasDirs:
          type: boolean
          description: The folder has visible subfolders.
        label:
          type: string
          description: Name of the source mounted here.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        remote:
          type: string
          description: The rclone remote mounted here.
    FsTree:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsTreeItem"
    FsStat:
      allOf:
        - $ref: "#/components/schemas/FsItem"
        - type: object
          required: [path]
          properties:
            path:
              type: string
            files:
              type: integer
              format: int64
              description: Files anywhere below a folder.
            dirs:
              type: integer
              format: int64
              description: Folders anywhere below a folder.
            devices:
              type: array
              items:
                type: string
              description: Below /mnt/user, the disks and pools that hold the path, such as cache or disk2.
            volume:
              $ref: "#/components/schemas/Volume"
    FsText:
      type: object
      required: [path, size, mtime, encoding, text]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        encoding:
          type: string
          enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1252]
        eol:
          type: string
          enum: [lf, crlf, cr, mixed]
          description: Missing for text without line breaks.
        text:
          type: string
        truncated:
          type: boolean
          description: The file goes on after max bytes.
    FsFile:
      type: object
      required: [path, size, mtime, encoding, text, etag, writable]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        encoding:
          type: string
          enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1252]
        eol:
          type: string
          enum: [lf, crlf, cr, mixed]
        text:
          type: string
        etag:
          type: string
          description: The same as the ETag header, for If-Match on the save.
        writable:
          type: boolean
          description: The user may save the file.
    FsSaved:
      type: object
      required: [path, size, mtime, etag]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        etag:
          type: string
        created:
          type: boolean
    ArchiveRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
        format:
          type: string
          enum: [zip, tgz]
          default: zip
        name:
          type: string
          description: File name of the download. Made from the paths when missing.
    FsHex:
      type: object
      required: [path, size, offset, data]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
          description: Size of the whole file.
        offset:
          type: integer
          format: int64
        data:
          type: string
          format: byte
          description: The bytes, base64.
    UploadRequest:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
          description: The file to create.
        size:
          type: integer
          format: int64
          minimum: 0
        mtime:
          type: string
          format: date-time
          description: Modification time the file gets, usually lastModified of the browser file.
        rule:
          type: string
          enum: [ask, skip, replace, both, newer]
          default: ask
          description: |
            What happens when the name exists. ask answers 409 with the
            conflict, replace moves the old file to the trash, both keeps
            the new one as "name (1).ext", newer replaces only an older
            file. The rule is applied again when the last chunk arrives.
    Upload:
      type: object
      required: [id, path, size, offset, state, rule, chunk]
      properties:
        id:
          type: string
        path:
          type: string
          description: The target, and once done the file it became, which differs when both were kept.
        size:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
          description: Bytes received so far, where the next chunk starts.
        state:
          type: string
          enum: [open, done, skipped]
        rule:
          type: string
        mtime:
          type: string
          format: date-time
        chunk:
          type: integer
          description: The chunk size the server asks for.
    PermsParams:
      type: object
      description: Params of the job kind fixPerms. Admins only.
      required: [path]
      properties:
        path:
          type: string
    PathBody:
      type: object
      required: [path]
      properties:
        path:
          type: string
    PathsParams:
      type: object
      description: Params of the job kinds delete and trash.
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
    TransferParams:
      type: object
      description: Params of the job kinds copy and move.
      required: [sources, dest]
      properties:
        sources:
          type: array
          description: Files and folders, also from different folders.
          items:
            type: string
        dest:
          type: string
          description: The folder they go into.
        names:
          type: array
          description: Names at the target, in the order of the sources.
          items:
            type: string
        rule:
          type: string
          enum: [ask, skip, replace, both, newer]
          default: ask
          description: |
            Answers every conflict without a decision. ask waits for
            POST /jobs/{id}/decide after job.conflict. replace moves the
            old entry to the trash, both gives the new one a number,
            newer replaces only older files. Folders on both sides are
            merged for replace and newer.
        decisions:
          type: object
          description: Answers keyed by conflict key, for example from the preflight.
          additionalProperties:
            type: string
            enum: [skip, replace, both, newer]
        verify:
          type: boolean
          description: Read every copied file back and compare checksums.
        keepAttrs:
          type: boolean
          default: true
          description: Keep owner, mode and times. Without it new entries belong to the user the server runs as.
    Preflight:
      type: object
      required: [dest, count, bytes, files, conflicts, sameDevice, big, parityBusy]
      properties:
        dest:
          type: string
        count:
          type: integer
        bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/JobConflict"
        sameDevice:
          type: boolean
          description: A move that only renames and needs no free space.
        space:
          $ref: "#/components/schemas/Space"
        big:
          type: boolean
          description: From 2 GiB on the job waits for a running parity check.
        parityBusy:
          type: boolean
          description: Unraid checks parity right now. For small jobs the client asks whether to wait.
        unraid:
          $ref: "#/components/schemas/UnraidTransferReport"
          description: Trap, broken hard links, space after the allocation rules and disks that wake up. Missing where Unraid has nothing to say.
    Space:
      type: object
      required: [free, need, enough]
      properties:
        free:
          type: integer
          format: int64
        need:
          type: integer
          format: int64
        enough:
          type: boolean
    JobCreate:
      type: object
      required: [kind, params]
      properties:
        kind:
          type: string
          example: copy
        params:
          description: |
            Depends on the kind. copy and move take TransferParams, delete
            and trash take PathsParams, fixPerms takes PermsParams.
          oneOf:
            - $ref: "#/components/schemas/TransferParams"
            - $ref: "#/components/schemas/PathsParams"
            - $ref: "#/components/schemas/PermsParams"
        cap:
          type: integer
          format: int64
          description: Bytes per second for this job, 0 for no limit.
        waitForParity:
          type: boolean
          description: Wait for a running parity check even if the job is small.
    JobSettings:
      type: object
      required: [mode, cap, parityWait, notifyUnraid, notifyAfter]
      properties:
        mode:
          type: string
          enum: [serial, parallel]
          description: serial runs one job at a time in queue order, parallel lets them share the speed.
        cap:
          type: integer
          format: int64
          description: Bytes per second for all jobs together, 0 for no limit.
        parityWait:
          type: boolean
          description: Copies and moves from 2 GiB on wait while Unraid checks parity or rebuilds.
        notifyUnraid:
          type: boolean
          description: Send a notice to Unraid when a long job ends. Needs write access to Unraid in the template.
        notifyAfter:
          type: integer
          format: int64
          description: Seconds a job has to run before its end is worth a notice.
          example: 60
    Job:
      type: object
      required: [id, kind, owner, state, position, name, count, totalBytes, doneBytes, totalFiles, doneFiles, rate, left, cap, waitForParity, failedItems, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
        owner:
          type: string
        state:
          type: string
          enum: [queued, running, paused, asking, done, failed, cancelled]
        reason:
          type: string
          enum: [parity]
          description: Why a queued job does not run. Missing while it only waits for its turn.
        place:
          type: integer
          description: Place in the waiting line, from 1.
        position:
          type: integer
        name:
          type: string
          description: Name of the first item.
        count:
          type: integer
          description: Number of items.
        dest:
          type: string
        totalBytes:
          type: integer
          format: int64
        doneBytes:
          type: integer
          format: int64
        totalFiles:
          type: integer
          format: int64
          description: Entries below and at the items, folders included.
        doneFiles:
          type: integer
          format: int64
        rate:
          type: number
          description: Bytes per second right now.
        left:
          type: [number, "null"]
          description: Seconds left at the current rate.
        current:
          type: string
          description: The entry in work, relative to the items.
        cap:
          type: integer
          format: int64
        waitForParity:
          type: boolean
        failedItems:
          type: integer
        error:
          type: string
        conflict:
          $ref: "#/components/schemas/JobConflict"
        undo:
          type: string
          description: Id of the undo step that takes the finished job back.
        result:
          description: What the job found out, for kinds that report more than done or failed.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Only in GET /jobs/{id}.
          items:
            $ref: "#/components/schemas/JobItem"
    JobItem:
      type: object
      required: [seq, path, state, bytes, files]
      properties:
        seq:
          type: integer
        path:
          type: string
        name:
          type: string
          description: Name at the target when it differs.
        state:
          type: string
          enum: [pending, running, done, skipped, failed]
        bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        error:
          type: string
    JobConflict:
      type: object
      description: A name that exists at the target already. Also the data of job.conflict, together with the job id.
      required: [key, source, target]
      properties:
        key:
          type: string
          description: Path relative to the target folder. An answer for a folder covers everything inside it.
        source:
          $ref: "#/components/schemas/ConflictSide"
        target:
          $ref: "#/components/schemas/ConflictSide"
        newer:
          type: string
          enum: [source, target]
          description: The side changed more than a second later. Missing when both are equally old.
    ConflictSide:
      type: object
      required: [path, dir, size, mtime]
      properties:
        path:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        entries:
          type: integer
          description: Entries directly inside a folder.
    JobProgress:
      type: object
      description: Data of job.progress.
      required: [id, totalBytes, doneBytes, totalFiles, doneFiles, rate, left]
      properties:
        id:
          type: string
        totalBytes:
          type: integer
          format: int64
        doneBytes:
          type: integer
          format: int64
        totalFiles:
          type: integer
          format: int64
        doneFiles:
          type: integer
          format: int64
        rate:
          type: number
        left:
          type: [number, "null"]
        current:
          type: string
    UndoStep:
      type: object
      required: [id, kind, at, name, count]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [rename, mkdir, touch, copy, move, trash]
        at:
          type: string
          format: date-time
        name:
          type: string
          description: The first name the step touched, the old one for a rename.
        count:
          type: integer
        path:
          type: string
          description: The folder the step happened in.
        to:
          type: string
          description: The new name of a rename, or the folder a copy or move went to.
    TrashIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
    TrashSettings:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 3650
          example: 30
    TrashItem:
      type: object
      required: [id, name, origin, from, dir, size, files, by, deletedAt, expiresAt]
      properties:
        id:
          type: string
        name:
          type: string
        origin:
          type: string
          description: Where the entry was.
        from:
          type: string
          description: The folder it was in.
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
          description: Entries at and below it, folders included.
        by:
          type: string
          description: Who deleted it.
        deletedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When it goes away for good.
    SavedSearchInput:
      type: object
      required: [name, query]
      properties:
        name:
          type: string
        query:
          type: object
          description: |
            The search as the search window sends it, stored as given. When
            it has a field in, that has to be a folder path.
          additionalProperties: true
          example: {text: "", in: /mnt/user, name: "*.iso *.img", min: 1 GB, when: any, type: all, hidden: false}
    SavedSearch:
      allOf:
        - $ref: "#/components/schemas/SavedSearchInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    RenameMask:
      type: object
      required: [name, ext]
      description: |
        Tokens: [N] name, [E] ending, [D] date, [P] folder, [C] counter, [C3]
        with three digits, [A] taken, [K] camera, [I] artist, [T] title, [R]
        resolution, [S2] season and [F2] episode.
      properties:
        name:
          type: string
          example: "[A]_[C3]"
        ext:
          type: string
          example: "[E]"
        start:
          type: integer
        step:
          type: integer
        find:
          type: string
        repl:
          type: string
        regex:
          type: boolean
        case:
          type: string
          enum: [keep, lower, upper, title]
    RenameBatch:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
        mask:
          $ref: "#/components/schemas/RenameMask"
        names:
          type: array
          items:
            type: string
        dryRun:
          type: boolean
    RenameBatchResult:
      type: object
      required: [rows, changed, errors, done]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [path, old, new]
            properties:
              path:
                type: string
              old:
                type: string
              new:
                type: string
              error:
                type: string
                enum: [empty, invalid, exists, duplicate]
              missing:
                type: array
                items:
                  type: string
        changed:
          type: integer
        errors:
          type: integer
        done:
          type: boolean
        undo:
          type: string
    CompareRequest:
      type: object
      required: [left, right]
      properties:
        left:
          type: string
        right:
          type: string
        content:
          type: boolean
        recursive:
          type: boolean
        top:
          type: boolean
        hidden:
          type: boolean
    CompareSide:
      type: object
      required: [dir, size, mtime]
      properties:
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
    Compared:
      type: object
      required: [rel, name, state]
      properties:
        rel:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [same, newerL, newerR, differ, onlyL, onlyR]
        left:
          $ref: "#/components/schemas/CompareSide"
        right:
          $ref: "#/components/schemas/CompareSide"
    SyncStep:
      type: object
      required: [key, rel, act, to, size]
      properties:
        key:
          type: string
        rel:
          type: string
        act:
          type: string
          enum: [copy, replace, delete]
        to:
          type: string
          enum: [L, R]
        dir:
          type: boolean
        "off":
          type: boolean
        why:
          type: string
          enum: [rightNewer, leftNewer, sameAge]
        size:
          type: integer
          format: int64
    Diff:
      type: object
      required: [left, right, binary, rows, hunks]
      properties:
        left:
          $ref: "#/components/schemas/DiffSide"
        right:
          $ref: "#/components/schemas/DiffSide"
        binary:
          type: boolean
        hunks:
          type: integer
        rows:
          type: array
          items:
            type: object
            required: [t]
            properties:
              t:
                type: string
                enum: [eq, chg, del, add]
              l:
                type: integer
                nullable: true
              r:
                type: integer
                nullable: true
    DiffSide:
      type: object
      required: [path, size, mtime, lines]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        lines:
          type: array
          items:
            type: string
    CleanupScan:
      type: object
      required: [path, scanned, groups]
      properties:
        path:
          type: string
        scanned:
          type: integer
        capped:
          type: boolean
        groups:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                note:
                  type: string
                  description: Size of a leftover, link target, the real kind or the reason for a bad name.
                size:
                  type: integer
                  format: int64
                to:
                  type: string
    SumLine:
      type: object
      required: [name]
      properties:
        name:
          type: string
        hash:
          type: string
        algo:
          type: string
          enum: [md5, sha1, sha256, sha512, b3]
        bad:
          type: string
          description: A line that is neither GNU nor BSD style.
    Pack:
      type: object
      required: [sources, dest, name, format]
      description: Params of pack. The sources lie in one folder.
      properties:
        sources:
          type: array
          items:
            type: string
        dest:
          type: string
        name:
          type: string
          description: Without the ending.
        format:
          type: string
          enum: [zip, tar.gz, tar.zst, 7z, rar]
        level:
          type: integer
          minimum: 0
          maximum: 9
        password:
          type: string
          description: AES-256 for zip, 7z and rar.
    Unpack:
      type: object
      required: [archives, dest]
      description: Params of unpack. An archive path with a folder after "::" unpacks only that folder, and items picks names in it.
      properties:
        archives:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            type: string
        dest:
          type: string
        own:
          type: boolean
          description: A folder named after each archive.
        clash:
          type: string
          enum: [skip, both, replace]
        password:
          type: string
        charset:
          type: string
          description: Encoding of zip names without the UTF-8 flag.
    TestArchive:
      type: object
      required: [paths]
      description: Params of testArchive. Every member is read to its end, nothing is unpacked.
      properties:
        paths:
          type: array
          items:
            type: string
        password:
          type: string
    Checksum:
      type: object
      required: [sources]
      description: Params of checksum. Lists are left out of a folder.
      properties:
        sources:
          type: array
          items:
            type: string
        algo:
          type: string
          enum: [md5, sha1, sha256, sha512, b3]
        save:
          type: string
          description: The sum file to write, names relative to its folder.
        bsd:
          type: boolean
    Verify:
      type: object
      description: Params of verify, a sum file or pasted lines with their folder. Line states are ok, mismatch, missing and bad.
      properties:
        file:
          type: string
        text:
          type: string
        dir:
          type: string
    Split:
      type: object
      required: [path, dest, partSize]
      description: Params of split. Parts are named file.001 and on.
      properties:
        path:
          type: string
        dest:
          type: string
        partSize:
          type: integer
          format: int64
        sum:
          type: boolean
          description: Lay a .sha256 of the whole file beside the parts.
    Combine:
      type: object
      required: [path, dest]
      description: Params of combine. Path is any of the parts.
      properties:
        path:
          type: string
        name:
          type: string
        dest:
          type: string
        check:
          type: boolean
        drop:
          type: boolean
          description: Move the parts to the trash once the result is complete.
    Sync:
      type: object
      required: [left, right, steps]
      description: Params of sync, the steps of the plan that are switched on. Deleted entries go to the trash.
      properties:
        left:
          type: string
        right:
          type: string
        steps:
          type: array
          items:
            type: object
            required: [rel, act, to]
            properties:
              rel:
                type: string
              act:
                type: string
                enum: [copy, replace, delete]
              to:
                type: string
                enum: [L, R]
    FetchUrl:
      type: object
      required: [url, dest]
      description: Params of fetchUrl. Addresses in the local network and on the server itself are refused, after every redirect as well.
      properties:
        url:
          type: string
        name:
          type: string
        dest:
          type: string
    Label:
      type: object
      properties:
        colour:
          type: string
          description: Id of the colour.
        tags:
          type: array
          items:
            type: string
    LabelLists:
      type: object
      required: [colours, tags]
      properties:
        colours:
          type: array
          items:
            type: object
            required: [id, name, hex, count]
            properties:
              id:
                type: string
                example: red
              name:
                type: string
                description: Empty for the colours the app comes with, which the client names in its language.
              hex:
                type: string
                example: "#ff6b72"
              count:
                type: integer
        tags:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name:
                type: string
              count:
                type: integer
    LabelsChanged:
      type: object
      description: |
        Payload of labels.changed. Kind colours or tags reaches everyone,
        kind items reaches the watchers of the folder in path.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [colours, tags, items]
        path:
          type: string
    Prefs:
      type: object
      description: Settings by name. The interface defines the names, see DEFAULT_PREFS in the frontend.
      additionalProperties: true
    Bookmark:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
        g:
          type: string
          description: Glyph name, for example IconDownload.
    BookmarkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Bookmark"
    ProfileInput:
      type: object
      required: [name, panels]
      properties:
        name:
          type: string
        dual:
          type: boolean
        columns:
          type: array
          items:
            type: string
        panels:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [cur, tabs]
            properties:
              cur:
                type: integer
                description: Index of the active tab.
              tabs:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: string
                  description: Folder of the tab.
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    RenamePresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name, options]
            properties:
              name:
                type: string
              options:
                type: object
                description: The fields of the multi rename window.
                properties:
                  name:
                    type: string
                    example: "[A]_[C3]"
                  ext:
                    type: string
                    example: "[E]"
                  find:
                    type: string
                  repl:
                    type: string
                  regex:
                    type: boolean
                  case:
                    type: string
                    enum: [keep, lower, upper, title]
    FrequentFolder:
      type: object
      required: [path, visits, last, rank]
      properties:
        path:
          type: string
        visits:
          type: integer
        last:
          type: string
          format: date-time
        rank:
          type: number
    PrefsChanged:
      type: object
      description: Payload of prefs.changed, sent only to the user it concerns.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [settings, bookmarks, profiles, renamePresets, savedSearches]
        device:
          type: string
          description: The device whose settings were saved.
    Session:
      type: object
      required: [id, created, seen, userAgent, ip, current]
      properties:
        id:
          type: string
        created:
          type: string
          format: date-time
          description: First request of the session.
        seen:
          type: string
          format: date-time
          description: Last request, to the minute.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: The session this request came with.
    Share:
      type: object
      required: [id, slug, kind, name, paths, owner, created, expires, password, limit, downloads, views, uploads, uploadLimit, uploaded, notify, state]
      properties:
        id:
          type: string
        slug:
          type: string
          description: The end of the address, /s/{slug}.
          example: k3x9qa-urlaub
        kind:
          type: string
          enum: [file, folder, collection]
        name:
          type: string
          description: The folder name of a collection, otherwise the name of the file or folder.
        paths:
          type: array
          items:
            type: string
          description: What the link shares. Follows renames and moves made in the app.
        owner:
          type: string
        created:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
          nullable: true
        password:
          type: boolean
        limit:
          type: integer
          description: Downloads until the link leads nowhere, 0 for no limit.
        downloads:
          type: integer
        views:
          type: integer
        uploads:
          type: boolean
        uploadLimit:
          type: integer
          format: int64
          description: Bytes visitors may upload through the link in all, 0 for no limit.
        uploaded:
          type: integer
          format: int64
        notify:
          type: boolean
          description: Opening the link sends a notice, in the app and to Unraid.
        state:
          type: string
          enum: [active, expired, exhausted]
    ShareCreate:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
        name:
          type: string
          description: Needed for a collection.
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,39}$"
          description: Missing picks one that is hard to guess.
        expires:
          type: string
          format: date-time
          nullable: true
        password:
          type: string
          minLength: 6
        limit:
          type: integer
          minimum: 0
        uploads:
          type: boolean
        uploadLimit:
          type: integer
          format: int64
          minimum: 0
        notify:
          type: boolean
    ShareUpdate:
      type: object
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,39}$"
        reroll:
          type: boolean
          description: Gives the link a fresh address, the old one leads nowhere.
        name:
          type: string
        expires:
          type: string
          format: date-time
          nullable: true
        password:
          type: string
          description: A new password, or empty to remove it.
        limit:
          type: integer
          minimum: 0
        uploads:
          type: boolean
        uploadLimit:
          type: integer
          format: int64
          minimum: 0
        notify:
          type: boolean
    PublicShare:
      type: object
      required: [slug, locked]
      properties:
        slug:
          type: string
        locked:
          type: boolean
          description: The link needs its password. Nothing else is told then.
        kind:
          type: string
          enum: [file, folder, collection]
        name:
          type: string
        expires:
          type: string
          format: date-time
        uploads:
          type: boolean
        uploadRoom:
          type: integer
          format: int64
          description: Bytes the link still takes, when it has an upload limit.
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        count:
          type: integer
          description: Entries of a collection.
    ShareUnlocked:
      type: object
      required: [token, expires]
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
    PublicItem:
      type: object
      required: [name, dir, size, mtime]
      properties:
        name:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        format:
          type: string
    PublicListing:
      type: object
      required: [path, name, items]
      properties:
        path:
          type: string
        name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicItem"
    UnraidState:
      type: object
      required: [available, array, parity, disks, shares, write, spindownDelay]
      properties:
        available:
          type: boolean
        version:
          type: string
          example: 7.3.4
        name:
          type: string
        array:
          type: object
          properties:
            state:
              type: string
              example: STARTED
            started:
              type: boolean
            disks:
              type: integer
            disabled:
              type: integer
            invalid:
              type: integer
            missing:
              type: integer
            fsState:
              type: string
            unmountable:
              type: integer
        parity:
          $ref: "#/components/schemas/UnraidParity"
        disks:
          type: array
          items:
            $ref: "#/components/schemas/UnraidDisk"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/UnraidShare"
        write:
          type: boolean
          description: Spinning down and notifications are switched on.
        spindownDelay:
          type: integer
          description: Default spin down delay in minutes, 0 for never.
    UnraidParity:
      type: object
      required: [running, paused, pos, size, percent, lastErrors, lastExit]
      properties:
        running:
          type: boolean
        paused:
          type: boolean
        kind:
          type: string
          enum: [check, rebuild, clear]
        action:
          type: string
          example: check P
        correct:
          type: boolean
        pos:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        percent:
          type: number
        speed:
          type: integer
          format: int64
          description: Bytes per second.
        lastSync:
          type: string
          format: date-time
        lastErrors:
          type: integer
        lastExit:
          type: integer
          description: 0 for a finished run, negative when it was cancelled.
    UnraidDisk:
      type: object
      required: [name, kind, mounted, status, size, fsSize, free, used, spundown, rotational, errors]
      properties:
        name:
          type: string
          example: disk1
        kind:
          type: string
          enum: [parity, data, pool, flash]
        pool:
          type: string
          description: Set on the second and later devices of a pool.
        mount:
          type: string
          example: /mnt/disk1
        mounted:
          type: boolean
        status:
          type: string
          example: DISK_OK
        fsStatus:
          type: string
        fsType:
          type: string
        size:
          type: integer
          format: int64
        fsSize:
          type: integer
          format: int64
        free:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        floor:
          type: integer
          format: int64
          description: Minimum free space of a pool.
        spundown:
          type: boolean
        rotational:
          type: boolean
        temp:
          type: integer
          description: Celsius, missing while the disk sleeps.
        errors:
          type: integer
        color:
          type: string
          example: green-on
    UnraidStorage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [array, pool]
        name:
          type: string
          description: The pool.
    UnraidShare:
      type: object
      required: [name, primary, allocator, splitLevel, floor, disks, free, used, exclusive]
      properties:
        name:
          type: string
        comment:
          type: string
        primary:
          $ref: "#/components/schemas/UnraidStorage"
        secondary:
          $ref: "#/components/schemas/UnraidStorage"
        mover:
          type: string
          enum: [toSecondary, toPrimary]
          description: toSecondary is "Cache to Array" in the share settings.
        allocator:
          type: string
          enum: [highwater, fillup, mostfree]
        splitLevel:
          type: string
          description: Empty splits any folder, 0 is manual, N splits the top N levels.
        floor:
          type: integer
          format: int64
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        disks:
          type: array
          description: The array disks the share may write to.
          items:
            type: string
        free:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        exclusive:
          type: boolean
    UnraidWhere:
      type: object
      required: [path, dir, "on", files, size]
      properties:
        path:
          type: string
        volume:
          type: string
          description: user, user0 or the disk or pool in the path. Empty off the array.
        share:
          type: string
        dir:
          type: boolean
        "on":
          type: array
          items:
            type: object
            required: [device, files, size, asleep]
            properties:
              device:
                type: string
              files:
                type: integer
              size:
                type: integer
                format: int64
              asleep:
                type: boolean
        files:
          type: integer
        size:
          type: integer
          format: int64
        partial:
          type: boolean
        links:
          type: object
          required: [count, paths, complete]
          properties:
            count:
              type: integer
              description: Link count of the file, this path included.
            paths:
              type: array
              items:
                type: string
            complete:
              type: boolean
    UnraidTransfer:
      type: object
      required: [kind, paths, dest]
      properties:
        kind:
          type: string
          enum: [copy, move, link]
        paths:
          type: array
          items:
            type: string
        dest:
          type: string
          description: The destination folder.
    UnraidTransferReport:
      type: object
      required: [linkable, wakes]
      properties:
        trap:
          type: object
          description: The files are the same at both ends. Copying or moving truncates them to 0 bytes.
          required: [device, count, size, files, targets]
          properties:
            device:
              type: string
            count:
              type: integer
            size:
              type: integer
              format: int64
            files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  device:
                    type: string
                  size:
                    type: integer
                    format: int64
            targets:
              type: array
              description: Other array disks for a safe copy, most free first.
              items:
                type: object
                properties:
                  disk:
                    type: string
                  free:
                    type: integer
                    format: int64
        links:
          type: object
          description: Hard links the transfer turns into separate files.
          required: [count, extra, files]
          properties:
            count:
              type: integer
            extra:
              type: integer
              format: int64
              description: Space the data takes a second time.
            files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  size:
                    type: integer
                    format: int64
                  names:
                    type: integer
                  others:
                    type: array
                    items:
                      type: string
                  complete:
                    type: boolean
        space:
          type: object
          description: Missing when the files fit.
          required: [problem, share, allocator, floor, total, room, free]
          properties:
            problem:
              type: string
              enum: [noDisk, tooMuch, bigFile, poolFull]
            share:
              type: string
            allocator:
              type: string
            floor:
              type: integer
              format: int64
            total:
              type: integer
              format: int64
            biggest:
              type: object
              properties:
                path:
                  type: string
                size:
                  type: integer
                  format: int64
            room:
              type: integer
              format: int64
            disk:
              type: string
              description: The disk Unraid would pick.
            free:
              type: integer
              format: int64
            pool:
              type: string
            roomy:
              type: string
              description: A disk of the share that holds the largest file.
            roomyFree:
              type: integer
              format: int64
        linkable:
          type: boolean
          description: Hard links can stand in for a copy.
        wakes:
          type: array
          items:
            type: string
        lands:
          type: string
          description: The disk or pool new files go to.
        partial:
          type: boolean
    UnraidGatherPlan:
      type: object
      required: [path, mode, files, size, devices, options, moves, move, short, cached]
      properties:
        path:
          type: string
        mode:
          type: string
          enum: [gather, scatter]
        disk:
          type: string
          description: Target for gather, source for scatter.
        files:
          type: integer
        size:
          type: integer
          format: int64
        devices:
          type: array
          items:
            type: object
            properties:
              device:
                type: string
              now:
                type: integer
                format: int64
              files:
                type: integer
              after:
                type: integer
                format: int64
              free:
                type: integer
                format: int64
              asleep:
                type: boolean
        options:
          type: array
          items:
            type: object
            properties:
              disk:
                type: string
              move:
                type: integer
                format: int64
              short:
                type: integer
                format: int64
        moves:
          type: integer
        move:
          type: integer
          format: int64
        short:
          type: integer
          format: int64
          description: What fits nowhere and stays.
        cached:
          type: integer
          description: Files still on a pool, the mover takes care of them.
        partial:
          type: boolean
    UnraidPermsScan:
      type: object
      required: [path, owner, files, dirs, wrong, kept]
      properties:
        path:
          type: string
        blocked:
          type: string
          enum: [appdata, system, domains, flash, archive]
        owner:
          type: string
          example: "99:100"
        files:
          type: integer
        dirs:
          type: integer
        wrong:
          type: integer
        kept:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              reason:
                type: string
                enum: [appdata, system, domains, flash]
              size:
                type: integer
                format: int64
        partial:
          type: boolean
    Remote:
      type: object
      required: [name, type, path, mount, label, mounted, mountOnStart]
      properties:
        name:
          type: string
          example: gdrive
        type:
          type: string
          description: The rclone backend.
          example: drive
        path:
          type: string
          description: The folder at the remote that is mounted, the share for SMB, the bucket for S3.
        mount:
          type: string
          example: /mnt/remotes/gdrive
        label:
          type: string
          description: What listings and the tree show on the mounted folder.
          example: "rclone: gdrive"
        mounted:
          type: boolean
        mountOnStart:
          type: boolean
        error:
          type: string
          description: Why the last mount failed.
        params:
          type: object
          description: The rclone parameters without secrets, for admins.
          additionalProperties:
            type: string
        secrets:
          type: array
          description: Secret parameters that are set, for admins.
          items:
            type: string
          example: [pass]
    RemoteInput:
      type: object
      properties:
        name:
          type: string
          description: Small letters, digits, _ and -.
          example: nas-keller
        type:
          type: string
          example: smb
        path:
          type: string
          example: archiv
        mount:
          type: string
          example: /mnt/remotes/nas-keller
        params:
          type: object
          description: rclone parameters of the type. Passwords are sent in clear and obscured on the server.
          additionalProperties:
            type: string
          example:
            host: keller
            user: jdp
            pass: geheim
    RcloneStatus:
      type: object
      required: [installed, running]
      properties:
        installed:
          type: boolean
        running:
          type: boolean
        version:
          type: string
          example: 1.75.2
        error:
          type: string
          description: Why rclone last stopped.
    RemoteType:
      type: object
      required: [id, description, featured, oauth, pathHint, options]
      properties:
        id:
          type: string
          example: drive
        description:
          type: string
          example: Google Drive
        featured:
          type: boolean
        oauth:
          type: boolean
        authorize:
          type: string
          example: rclone authorize "drive"
        pathHint:
          type: string
          enum: [folder, share, bucket]
        options:
          type: array
          items:
            $ref: "#/components/schemas/RemoteOption"
    RemoteOption:
      type: object
      required: [name, help, type, required, secret, advanced, exclusive]
      properties:
        name:
          type: string
        help:
          type: string
        type:
          type: string
        default:
          type: string
        provider:
          type: string
          description: For S3, the providers the option applies to.
        required:
          type: boolean
        secret:
          type: boolean
        advanced:
          type: boolean
        exclusive:
          type: boolean
          description: Only the examples are allowed.
        examples:
          type: array
          items:
            type: object
            required: [value, help]
            properties:
              value:
                type: string
              help:
                type: string
              provider:
                type: string
    RemoteTestResult:
      type: object
      required: [ok, entries]
      properties:
        ok:
          type: boolean
        entries:
          type: integer
          description: Entries in the folder of the remote.
        total:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        free:
          type: integer
          format: int64
        error:
          type: string
          description: What rclone said, in English.
    UpdateCheck:
      type: object
      required: [version, latest, updateAvailable]
      properties:
        version:
          type: string
          example: 0.1.0
        latest:
          type: string
          example: 0.2.0
        updateAvailable:
          type: boolean
        releaseUrl:
          type: string
    SettingsFileRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          example: /mnt/user/appdata/cannoncommander/exports/cannoncommander-settings-2026-11-04.json
        users:
          type: boolean
          description: Take users, groups and rules along.
    SettingsFile:
      type: object
      required: [app, version, exported, sections]
      properties:
        app:
          type: string
          enum: [cannoncommander]
        version:
          type: string
        exported:
          type: string
          format: date-time
        sections:
          type: object
          description: One entry per part, such as sources, app and remotes.
          additionalProperties: true
    SystemInfo:
      type: object
      required: [version, go, os, arch, started, uptime, tools, unraid, features]
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
        go:
          type: string
          example: go1.27.0
        os:
          type: string
          example: linux
        arch:
          type: string
          example: amd64
        started:
          type: string
          format: date-time
        uptime:
          type: integer
          format: int64
          description: Seconds since the start.
        tools:
          type: object
          description: ffmpeg, ffprobe, mutool, 7zz and rclone.
          additionalProperties:
            $ref: "#/components/schemas/SystemTool"
        unraid:
          type: object
          required: [available, socket]
          properties:
            available:
              type: boolean
            socket:
              type: boolean
              description: Whether writing to Unraid (spin down, notifications) is switched on.
        features:
          type: object
          required: [office, thumbs, videoPreview, webdav, mupdf]
          properties:
            office:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [none, onlyoffice, eurooffice, collabora]
                url:
                  type: string
            thumbs:
              type: boolean
            videoPreview:
              type: boolean
            webdav:
              type: boolean
            mupdf:
              type: boolean
    SystemTool:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        path:
          type: string
          example: /usr/local/bin/ffmpeg
        version:
          type: string
          example: 7.1.1
    AdminSource:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          example: Shares
        path:
          type: string
          example: /mnt/user
        readOnly:
          type: boolean
        indexed:
          type: boolean
        skipHidden:
          type: boolean
        exclude:
          type: array
          items:
            type: string
          example: ["*.tmp", appdata/plex/cache]
    AdminSources:
      type: object
      required: [sources, restartNeeded]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AdminSource"
        restartNeeded:
          type: boolean
    IntegrationTest:
      type: object
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [onlyoffice, eurooffice, collabora, arrowloop]
        url:
          type: string
          example: https://office.tower.lan
        secret:
          type: string
          description: The JWT secret of an OnlyOffice or Euro-Office server.
        token:
          type: string
          description: The ArrowLoop API token.
    IntegrationResult:
      type: object
      required: [kind, ok, reachable]
      properties:
        kind:
          type: string
        ok:
          type: boolean
        reachable:
          type: boolean
        token:
          type: string
          enum: [ok, rejected, missing, "off", none]
          description: |
            ok, rejected, missing when the server wants one and none was
            given, off when the server checks none, none for Collabora,
            which has no shared secret.
        version:
          type: string
        error:
          type: string
          description: What went wrong, in English.
    AppSettings:
      type: object
      properties:
        office:
          type: object
          properties:
            kind:
              type: string
              enum: [none, onlyoffice, eurooffice, collabora]
            url:
              type: string
            secret:
              type: string
              writeOnly: true
            secretSet:
              type: boolean
              readOnly: true
        arrowloop:
          type: object
          properties:
            url:
              type: string
            token:
              type: string
              writeOnly: true
            tokenSet:
              type: boolean
              readOnly: true
            paths:
              type: object
              description: The start of a path here mapped to the same folder in ArrowLoop's container, as /mnt/user to /data.
              additionalProperties:
                type: string
        previews:
          type: object
          properties:
            thumbs:
              type: boolean
            video:
              type: boolean
              description: Transcode formats such as MKV for the browser.
        webdav:
          type: boolean
        remotes:
          type: object
          properties:
            automount:
              type: boolean
            cache:
              type: string
              enum: ["off", writes, full]
            cacheSize:
              type: integer
              description: Cap of the VFS cache of all mounts together, in GB.
              example: 50
        updates:
          type: object
          properties:
            autoCheck:
              type: boolean
        logLevel:
          type: string
          enum: [error, info, debug]
        restartNeeded:
          type: boolean
          readOnly: true
    OfficeConfig:
      type: object
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [onlyoffice, eurooffice, collabora]
        url:
          type: string
          description: The document server, or for Collabora the editor address with WOPISrc.
        config:
          type: object
          description: The editor config for DocsAPI.DocEditor.
          additionalProperties: true
        token:
          type: string
          description: The WOPI access token.
        ttl:
          type: integer
          format: int64
          description: When the access token ends, in milliseconds since 1970.
    WatchRequest:
      type: object
      required: [clientId, paths]
      properties:
        clientId:
          type: string
        paths:
          type: array
          maxItems: 64
          items:
            type: string

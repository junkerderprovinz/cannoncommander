      operationId: toolsArrowLoop
      summary: Hand a folder to ArrowLoop as a job
      tags: [tools]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /labels:
    get:
      operationId: labelsGet
      summary: Colours and tags with their names
      tags: [labels]
      responses:
        "501":
          $ref: '#/components/responses/NotImplemented'
  /labels/colours:

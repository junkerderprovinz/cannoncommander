  /events:
    get:
      operationId: eventsStream
      summary: Server events as SSE
      description: |
        Opens a text/event-stream. Each frame has "id:", "event:" and a
        "data:" line holding an Event. Heartbeats come every 25 seconds
        without an id. After a reconnect with Last-Event-ID the missed
        events follow first, or a single resync event when they are gone.
      parameters:
        - name: clientId
          in: query
          description: Chosen by the client once per tab, it ties the watched folders to this stream. Without it the stream carries only the events that are not about watched folders.
          schema:
            type: string
            maxLength: 64
        - name: lastEventId
          in: query
          description: Same as the Last-Event-ID header, for clients that cannot set headers.
          schema:
            type: integer
            format: int64
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [events]
  /events/watch:
    put:
      operationId: eventsWatch
      summary: Set the folders a client watches
      description: |
        Replaces the watched folders of a client. For each of them the stream
        delivers fs.changed with topic fs:<path>. Folders stay watched for two
        minutes after the stream closes, so a reconnect keeps them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRequest"
      responses:
        "200":
          description: The watched folders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [events]
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token or a session token.
    cookie:
      type: apiKey
      in: cookie
      name: filebrowser_quantum_jwt
      description: The session cookie the web app gets on login.
  parameters:
    Path:
      name: path
      in: query
      required: true
      description: Absolute path.
      schema:
        type: string
        example: /mnt/user/filme
  responses:
    NotImplemented:
      description: Part of the contract, not built yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed for this user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The path does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Event:
      type: object
      description: |
        One server event. The SSE frame carries the type as "event:" and the
        id as "id:", and this object as "data:". Reconnect with the
        Last-Event-ID header (or lastEventId query) to receive what was
        missed. A resync event means the gap was too large and the client
        should reload its state.
      required: [id, type, time]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - heartbeat
            - resync
            - notify
            - job.created
            - job.progress
            - job.state
            - job.conflict
            - job.done
            - fs.changed
            - trash.changed
            - labels.changed
            - undo.changed
            - share.opened
            - unraid.parity
            - unraid.spin
            - index.progress
            - search.hits
            - prefs.changed
        topic:
          type: string
          description: Set for events that only subscribers see, for example fs:/mnt/user/filme.
        time:
          type: string
          format: date-time
        data:
          description: Payload, its shape depends on the type.
    FsItem:
      type: object
      required: [name, dir, size, mtime, mode]
      properties:
        name:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
          description: Bytes, 0 for folders.
        mtime:
          type: string
          format: date-time
          description: Modification time in UTC with milliseconds.
        mode:
          type: string
          description: Permission bits in octal.
          example: "0664"
        owner:
          type: string
          description: User name, or the number when the container does not know it.
        group:
          type: string
        hidden:
          type: boolean
          description: The name starts with a dot.
        link:
          type: string
          description: Target of a symbolic link.
    Volume:
      type: object
      required: [path, free, total]
      properties:
        path:
          type: string
          description: Where the source is mounted.
        label:
          type: string
          description: Name of the source.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FsList:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsItem"
        volume:
          $ref: "#/components/schemas/Volume"
          description: Missing for the virtual folders / and /mnt.
    FsTreeItem:
      type: object
      required: [name, path, hasDirs]
      properties:
        name:
          type: string
        path:
          type: string
        hasDirs:
          type: boolean
          description: The folder has visible subfolders.
        label:
          type: string
          description: Name of the source mounted here.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FsTree:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsTreeItem"
    UnraidState:
      type: object
      required: [available, array, parity, disks, shares, write, spindownDelay]
      properties:
        available:
          type: boolean
        version:
          type: string
          example: 7.3.4
        name:
          type: string
        array:
          type: object
          properties:
            state:
              type: string
              example: STARTED
            started:
              type: boolean
            disks:
              type: integer
            disabled:
              type: integer
            invalid:
              type: integer
            missing:
              type: integer
            fsState:
              type: string
            unmountable:
              type: integer
        parity:
          $ref: "#/components/schemas/UnraidParity"
        disks:
          type: array
          items:
            $ref: "#/components/schemas/UnraidDisk"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/UnraidShare"
        write:
          type: boolean
          description: Spinning down and notifications are switched on.
        spindownDelay:
          type: integer
          description: Default spin down delay in minutes, 0 for never.
    UnraidParity:
      type: object
      required: [running, paused, pos, size, percent, lastErrors, lastExit]
      properties:
        running:
          type: boolean
        paused:
          type: boolean
        kind:
          type: string
          enum: [check, rebuild, clear]
        action:
          type: string
          example: check P
        correct:
          type: boolean
        pos:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        percent:
          type: number
        speed:
          type: integer
          format: int64
          description: Bytes per second.
        lastSync:
          type: string
          format: date-time
        lastErrors:
          type: integer
        lastExit:
          type: integer
          description: 0 for a finished run, negative when it was cancelled.
    UnraidDisk:
      type: object
      required: [name, kind, mounted, status, size, fsSize, free, used, spundown, rotational, errors]
      properties:
        name:
          type: string
          example: disk1
        kind:
          type: string
          enum: [parity, data, pool, flash]
        pool:
          type: string
          description: Set on the second and later devices of a pool.
        mount:
          type: string
          example: /mnt/disk1
        mounted:
          type: boolean
        status:
          type: string
          example: DISK_OK
        fsStatus:
          type: string
        fsType:
          type: string
        size:
          type: integer
          format: int64
        fsSize:
          type: integer
          format: int64
        free:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        floor:
          type: integer
          format: int64
          description: Minimum free space of a pool.
        spundown:
          type: boolean
        rotational:
          type: boolean
        temp:
          type: integer
          description: Celsius, missing while the disk sleeps.
        errors:
          type: integer
        color:
          type: string
          example: green-on
    UnraidStorage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [array, pool]
        name:
          type: string
          description: The pool.
    UnraidShare:
      type: object
      required: [name, primary, allocator, splitLevel, floor, disks, free, used, exclusive]
      properties:
        name:
          type: string
        comment:
          type: string
        primary:
          $ref: "#/components/schemas/UnraidStorage"
        secondary:
          $ref: "#/components/schemas/UnraidStorage"
        mover:
          type: string
          enum: [toSecondary, toPrimary]
          description: toSecondary is "Cache to Array" in the share settings.
        allocator:
          type: string
          enum: [highwater, fillup, mostfree]
        splitLevel:
          type: string
          description: Empty splits any folder, 0 is manual, N splits the top N levels.
        floor:
          type: integer
          format: int64
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        disks:
          type: array
          description: The array disks the share may write to.
          items:
            type: string
        free:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        exclusive:
          type: boolean
    UnraidWhere:
      type: object
      required: [path, dir, "on", files, size]
      properties:
        path:
          type: string
        volume:
          type: string
          description: user, user0 or the disk or pool in the path. Empty off the array.
        share:
          type: string
        dir:
          type: boolean
        "on":
          type: array
          items:
            type: object
            required: [device, files, size, asleep]
            properties:
              device:
                type: string
              files:
                type: integer
              size:
                type: integer
                format: int64
              asleep:
                type: boolean
        files:
          type: integer
        size:
          type: integer
          format: int64
        partial:
          type: boolean
        links:
          type: object
          required: [count, paths, complete]
          properties:
            count:
              type: integer
              description: Link count of the file, this path included.
            paths:
              type: array
              items:
                type: string
            complete:
              type: boolean
    UnraidTransfer:
      type: object
      required: [kind, paths, dest]
      properties:
        kind:
          type: string
          enum: [copy, move, link]
        paths:
          type: array
          items:
            type: string
        dest:
          type: string
          description: The destination folder.
    UnraidTransferReport:
      type: object
      required: [linkable, wakes]
      properties:
        trap:
          type: object
          description: The files are the same at both ends. Copying or moving truncates them to 0 bytes.
          required: [device, count, size, files, targets]
          properties:
            device:
              type: string
            count:
              type: integer
            size:
              type: integer
              format: int64
            files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  device:
                    type: string
                  size:
                    type: integer
                    format: int64
            targets:
              type: array
              description: Other array disks for a safe copy, most free first.
              items:
                type: object
                properties:
                  disk:
                    type: string
                  free:
                    type: integer
                    format: int64
        links:
          type: object
          description: Hard links the transfer turns into separate files.
          required: [count, extra, files]
          properties:
            count:
              type: integer
            extra:
              type: integer
              format: int64
              description: Space the data takes a second time.
            files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  size:
                    type: integer
                    format: int64
                  names:
                    type: integer
                  others:
                    type: array
                    items:
                      type: string
                  complete:
                    type: boolean
        space:
          type: object
          description: Missing when the files fit.
          required: [problem, share, allocator, floor, total, room, free]
          properties:
            problem:
              type: string
              enum: [noDisk, tooMuch, bigFile, poolFull]
            share:
              type: string
            allocator:
              type: string
            floor:
              type: integer
              format: int64
            total:
              type: integer
              format: int64
            biggest:
              type: object
              properties:
                path:
                  type: string
                size:
                  type: integer
                  format: int64
            room:
              type: integer
              format: int64
            disk:
              type: string
              description: The disk Unraid would pick.
            free:
              type: integer
              format: int64
            pool:
              type: string
            roomy:
              type: string
              description: A disk of the share that holds the largest file.
            roomyFree:
              type: integer
              format: int64
        linkable:
          type: boolean
          description: Hard links can stand in for a copy.
        wakes:
          type: array
          items:
            type: string
        lands:
          type: string
          description: The disk or pool new files go to.
        partial:
          type: boolean
    UnraidGatherPlan:
      type: object
      required: [path, mode, files, size, devices, options, moves, move, short, cached]
      properties:
        path:
          type: string
        mode:
          type: string
          enum: [gather, scatter]
        disk:
          type: string
          description: Target for gather, source for scatter.
        files:
          type: integer
        size:
          type: integer
          format: int64
        devices:
          type: array
          items:
            type: object
            properties:
              device:
                type: string
              now:
                type: integer
                format: int64
              files:
                type: integer
              after:
                type: integer
                format: int64
              free:
                type: integer
                format: int64
              asleep:
                type: boolean
        options:
          type: array
          items:
            type: object
            properties:
              disk:
                type: string
              move:
                type: integer
                format: int64
              short:
                type: integer
                format: int64
        moves:
          type: integer
        move:
          type: integer
          format: int64
        short:
          type: integer
          format: int64
          description: What fits nowhere and stays.
        cached:
          type: integer
          description: Files still on a pool, the mover takes care of them.
        partial:
          type: boolean
    UnraidPermsScan:
      type: object
      required: [path, owner, files, dirs, wrong, kept]
      properties:
        path:
          type: string
        blocked:
          type: string
          enum: [appdata, system, domains, flash, archive]
        owner:
          type: string
          example: "99:100"
        files:
          type: integer
        dirs:
          type: integer
        wrong:
          type: integer
        kept:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              reason:
                type: string
                enum: [appdata, system, domains, flash]
              size:
                type: integer
                format: int64
        partial:
          type: boolean
    WatchRequest:
      type: object
      required: [clientId, paths]
      properties:
        clientId:
          type: string
        paths:
          type: array
          maxItems: 64
          items:
            type: string

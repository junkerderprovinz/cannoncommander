          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                key:
                  type: string
                  description: Key of the conflict, from job.conflict. Empty means the one the job waits on.
                choice:
                  type: string
                  enum: [skip, replace, both, newer]
                all:
                  type: boolean
                  description: Use the choice for every later conflict of this job as well.
      responses:
        "200":
          $ref: "#/components/responses/JobAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]

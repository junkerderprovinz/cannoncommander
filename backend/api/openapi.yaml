        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: jobRemove
      summary: Remove an ended job from the list
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /jobs/{id}/pause:
    post:
      operationId: jobPause

        "200":
          $ref: "#/components/responses/JobAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
      tags: [jobs]

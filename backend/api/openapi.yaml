  /labels:
    get:
      operationId: labelsGet
      summary: Colours and tags with their names
      description: The colours in their order and every tag in German alphabetical order, each with the number of paths carrying it.
      responses:
        "200":
          description: The colour and tag lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelLists"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [labels]
  /labels/colours:
    put:
      operationId: labelColoursPut
      summary: Rename or recolour the colour labels
      description: |
        Replaces the colour list, in the given order. An entry with an id
        changes that colour, one without is a new colour. Colours left out
        are taken off every path. Sends labels.changed to everyone.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [colours]
              properties:
                colours:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required: [name, hex]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                        description: Empty keeps the name the app gives its own colours.
                      hex:
                        type: string
                        example: "#2ec4b6"
      responses:
        "200":
          description: The new lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelLists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
  /labels/tags:
    put:
      operationId: labelTagsPut
      summary: Change the list of tags
      description: |
        Replaces the tag list. An entry with from renames that tag on every
        path, and two tags renamed to the same name become one. An entry
        without from is a tag no file needs to carry yet. Tags left out are
        taken off every path. Sends labels.changed to everyone.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [name]
                    properties:
                      from:
                        type: string
                      name:
                        type: string
      responses:
        "200":
          description: The new lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelLists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
  /labels/items:
    get:
      operationId: labelItemsGet
      summary: Labels of the entries in a folder
      description: |
        The labelled entries of a folder the user may see, keyed by name.
        With deep=true everything below the folder, keyed by the path
        relative to it, for the flat view and search results.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: deep
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The labels.
          content:
            application/json:
              schema:
                type: object
                required: [path, items]
                properties:
                  path:
                    type: string
                  items:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/Label"
                example:
                  path: /mnt/user/dokumente
                  items:
                    Mietvertrag.pdf: {colour: red, tags: [wichtig]}
                    Rechnung-Oktober.pdf: {tags: [Steuer]}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
    put:
      operationId: labelItemsPut
      summary: Set colour and tags on paths
      description: |
        Changes the labels of up to 10000 paths at once. colour sets the
        colour, an empty colour clears it. tags replaces the tags, add and
        remove adjust them. Fields left out stay as they are. Needs the
        right to change each path, so read only places carry no labels.
        Sends labels.changed to the watchers of each folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: string
                colour:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                add:
                  type: array
                  items:
                    type: string
                remove:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The labels the paths carry after the change, keyed by path. An empty object means no label.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [labels]
  /me/prefs:
    get:
      operationId: prefsGet
      summary: Own settings
      description: |
        Returns the settings as one flat object, as the interface keeps
        them. Settings never saved are left out, so the client keeps its
        own defaults for them. With a device the device settings (dual,
        side, fkeys, colWidths) of that device lie on top of the others.
      parameters:
        - $ref: "#/components/parameters/Device"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    put:
      operationId: prefsPut
      summary: Save own settings
      description: |
        Replaces the settings with the given object. With a device the
        device settings are stored for that device and the rest for the
        user. Without one everything is stored for the user, and the user's
        values serve devices that have none of their own. Known settings
        have to keep their JSON type. Sends prefs.changed to the user.
      parameters:
        - $ref: "#/components/parameters/Device"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prefs"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The settings are larger than 256 KiB.
      tags: [prefs]
  /me/bookmarks:
    get:
      operationId: bookmarksGet
      summary: Pinned folders
      description: |
        The pinned folders in their order. A user who never saved any gets
        the usual shares that exist and that the user may open.
      responses:
        "200":
          description: The bookmarks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    put:
      operationId: bookmarksPut
      summary: Save pinned folders
      description: Replaces the list. Paths have to be unique and may not point into an archive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkList"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The same path is pinned twice.
      tags: [prefs]
  /me/profiles:
    get:
      operationId: profilesList
      summary: Saved panel profiles
      responses:
        "200":
          description: The profiles, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    post:
      operationId: profileCreate
      summary: Save a panel profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: The new profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: There are 100 profiles already.
      tags: [prefs]
  /me/profiles/{id}:
    put:
      operationId: profileUpdate
      summary: Change a panel profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: The changed profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [prefs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: profileDelete
      summary: Delete a panel profile
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [prefs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /me/rename-presets:
    get:
      operationId: renamePresetsGet
      summary: Saved rename patterns
      description: The user's own presets. The presets that come with the app live in the client.
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenamePresetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    put:
      operationId: renamePresetsPut
      summary: Save rename patterns
      description: Replaces the list. Names have to be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePresetList"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Two presets share a name.
      tags: [prefs]
  /me/frequent:
    get:
      operationId: frequentGet
      summary: Often visited folders
      description: |
        The folders ranked like zoxide: the number of visits, weighted by
        how recent the last one was (four times within the hour, twice
        within the day, half within the week, a quarter after that).
        Folders that are gone or out of reach are left out.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
        - name: skip
          in: query
          description: A folder to leave out, usually the one that is open.
          schema:
            type: string
      responses:
        "200":
          description: The best ranked folders first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FrequentFolder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [prefs]
    post:
      operationId: frequentVisit
      summary: Count a visit to a folder
      description: Folders inside an archive are not counted. The history keeps the 500 folders visited last.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "204":
          description: Counted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [prefs]
  /me:
    get:
      operationId: meGet
      summary: The logged in user
      description: With an API token, token names it and its rights.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [accounts]
  /me/password:
    put:
      operationId: mePassword
      summary: Change the own password, which ends the other sessions
      description: |
        Needs the current password. Every other session of the account is
        logged out, this one stays. API tokens keep working. Not possible
        with an API token. Five wrong current passwords block the change
        for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, next]
              properties:
                current:
                  type: string
                next:
                  type: string
                  minLength: 12
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended:
                    type: integer
                    description: How many other sessions were logged out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The current password is wrong, the password is locked, or the request came with an API token.
        "409":
          description: The account signs in somewhere else, such as OIDC.
        "429":
          description: Too many wrong passwords.
      tags: [accounts]
  /me/sessions:
    get:
      operationId: sessionsList
      summary: Open sessions
      description: |
        The logins of the own account that are still valid, the one used
        last first. A session shows up once it made a request to this API.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [accounts]
  /me/sessions/{id}:
    delete:
      operationId: sessionEnd
      summary: End a session
      description: Logs that session out at once. Ending the current session logs out this client.
      responses:
        "204":
          description: Ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /me/tokens:
    get:
      operationId: tokensList
      summary: API tokens
      description: The tokens of the own account by name, without their secrets.
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [accounts]
    post:
      operationId: tokenCreate
      summary: Create an API token with limited rights
      description: |
        A token never has more rights than its owner. One with the rights r
        may only read: it cannot change files, and every other method than
        GET and HEAD is refused. The secret is in this answer only. Not
        possible with an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, rights]
              properties:
                name:
                  type: string
                  maxLength: 64
                rights:
                  type: string
                  enum: [r, rw]
                  description: r reads, rw also writes.
                days:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 3650
                  description: How long the token lives. Null, 0 or left out means it never runs out.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A token with this name exists.
      tags: [accounts]
  /me/tokens/{id}:
    delete:
      operationId: tokenDelete
      summary: Revoke an API token
      description: The id comes from the list. Whatever uses the token loses access at once.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /me/passkeys:
    get:
      operationId: passkeysList
      summary: Passkeys
      responses:
        "200":
          description: The passkeys, and whether the server takes passkeys.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, items]
                properties:
                  enabled:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Passkey"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [accounts]
    post:
      operationId: passkeyRegister
      summary: Register a passkey
      description: |
        Two steps on the same path. With a name alone the answer carries
        the options for navigator.credentials.create, good for five
        minutes. Sending the same name with the credential the browser
        returned, as JSON, adds the passkey. It only works under the host
        it was registered on. Not possible with an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 64
                credential:
                  type: object
                  description: The PublicKeyCredential of the browser, for the second step.
      responses:
        "200":
          description: The first step, with the options.
          content:
            application/json:
              schema:
                type: object
                required: [options]
                properties:
                  options:
                    type: object
                    description: CredentialCreationOptions with a publicKey member, binary fields as base64url.
        "201":
          description: The passkey was added.
          content:
            application/json:
              schema:
                type: object
                required: [passkey]
                properties:
                  passkey:
                    $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Passkeys are turned off, the name or the passkey is taken, or the first step ran out.
      tags: [accounts]
  /me/passkeys/{id}:
    delete:
      operationId: passkeyDelete
      summary: Remove a passkey
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /me/totp:
    post:
      operationId: totpSetup
      summary: Turn on two factor login
      description: |
        Three steps on the same path. An empty object starts the setup with
        a fresh secret. The first code from the app within ten minutes
        turns two factor login on, and the answer holds eight recovery
        codes, each of which logs in once instead of a code. A code with
        regenerate replaces the recovery codes with new ones. Codes are
        shown this once. Not possible with an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Six digits from the app. With regenerate, a recovery code works too.
                regenerate:
                  type: boolean
      responses:
        "200":
          description: The secret when starting, the recovery codes otherwise.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TotpSetup"
                  - $ref: "#/components/schemas/RecoveryCodes"
        "400":
          description: The code does not match.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Two factor login is on already or off, the setup ran out, or the account signs in somewhere else.
        "429":
          description: Too many wrong codes.
      tags: [accounts]
    delete:
      operationId: totpDisable
      summary: Turn off two factor login
      description: Needs a code from the app or a recovery code. The recovery codes go with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInput"
      responses:
        "204":
          description: Off.
        "400":
          description: The code does not work.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Two factor login is off already, or the server asks everyone for it.
        "429":
          description: Too many wrong codes.
      tags: [accounts]
  /auth/reset-code:
    post:
      operationId: resetCodeRequest
      summary: Ask for a code to reset a forgotten password
      description: |
        Writes a code to the container log, where only the admin of the
        server can read it. It works for ten minutes. The answer is the
        same for every name, so it cannot be used to find accounts.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        "202":
          description: Taken.
        "400":
          $ref: "#/components/responses/BadRequest"
      tags: [accounts]
      security: []
  /auth/reset:
    post:
      operationId: passwordReset
      summary: Set a new password with a code from the log
      description: |
        Also ends every session, turns off two factor login and revokes
        every API token of the account. Passkeys stay. The client is
        logged in with a new session cookie afterwards. Five wrong codes
        from one address block it for 15 minutes.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code:
                  type: string
                  example: K7QM-3XRP-9DTA
                password:
                  type: string
                  minLength: 12
      responses:
        "200":
          description: The new password counts, and this is the account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: The code is wrong or ran out, or the password is too short.
        "429":
          description: Too many wrong codes.
      tags: [accounts]
      security: []
  /admin/users:
    get:
      operationId: usersList
      summary: List users
      x-access: admin
      responses:
        "200":
          description: Every user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [accounts]
    post:
      operationId: userCreate
      summary: Create a user
      x-access: admin
      description: The user signs in with the password. Login name, scopes and password are needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The login name is taken.
      tags: [accounts]
  /admin/users/{id}:
    get:
      operationId: userGet
      summary: One user
      description: The id in the path may also be the login name, which always starts with a letter.
      x-access: admin
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    patch:
      operationId: userUpdate
      summary: Change a user
      x-access: admin
      description: |
        Fields left out stay as they are. A new password logs the user out
        everywhere. Renaming moves the user's rules along. Nobody can change
        their own login name or password here, or take away their own admin
        role, so there is always an admin left.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The login name is taken, or an admin tried to give up the own admin role.
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: userDelete
      summary: Delete a user
      x-access: admin
      description: |
        Removes the account with its shares, jobs, rules, settings,
        sessions and tokens. Files stay where they are. Nobody can delete
        themselves.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /admin/groups:
    get:
      operationId: groupsList
      summary: List groups
      x-access: admin
      responses:
        "200":
          description: Every group.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [accounts]
    post:
      operationId: groupCreate
      summary: Create a group
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The group exists.
      tags: [accounts]
  /admin/groups/{name}:
    patch:
      operationId: groupUpdate
      summary: Change a group
      x-access: admin
      description: Fields left out stay as they are. Renaming moves the group's rules along.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A group with the new name exists.
      tags: [accounts]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: groupDelete
      summary: Delete a group
      x-access: admin
      description: The group and its rules go, its members stay users.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [accounts]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
  /admin/rules:
    get:
      operationId: rulesGet
      summary: Access rules
      x-access: admin
      description: The rules in order. For a path, the first rule that matches decides.
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [accounts]
    put:
      operationId: rulesPut
      summary: Save access rules
      x-access: admin
      description: |
        Replaces every rule with the list, in its order. A path has to
        exist, a pattern has a star. They count at once for every request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleList"
      responses:
        "200":
          description: Saved, with the paths in their stored form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "400":
          description: A rule is wrong. The detail names it, counted from 1.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [accounts]
  /admin/rules/test:
    post:
      operationId: rulesTest
      summary: Show what a user may do on a path
      x-access: admin
      description: |
        Asks the file system as that user, so the answer takes the scope,
        the role, read only sources and the rules into account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, path]
              properties:
                user:
                  type: string
                  description: Login name.
                path:
                  type: string
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: There is no such user.
      tags: [accounts]
  /admin/activity:
    get:
      operationId: activityList
      summary: Activity log
      x-access: admin
      description: Who did what and when, the newest first. Without from, the last seven days.
      parameters:
        - name: from
          in: query
          schema:
            type: integer
          description: Unix seconds.
        - name: to
          in: query
          schema:
            type: integer
          description: Unix seconds.
        - name: username
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
          description: One or more event types, separated by commas, such as login,upload.
        - name: path
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityEntry"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [accounts]
  /shares:
    get:
      operationId: sharesList
      summary: Own share links
      responses:
        "200":
          description: The links, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Share"
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [shares]
    post:
      operationId: shareCreate
      summary: Create a share link
      description: |
        Needs the share right and the download right on every path. One
        path makes a file or folder link, several make a collection, which
        needs a name. Uploads work only for a link to one folder and need
        the create right there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareCreate"
      responses:
        "201":
          description: The new link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The address is taken.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [shares]
  /shares/{id}:
    get:
      operationId: shareGet
      summary: One share link
      description: For its owner and for admins.
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [shares]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    patch:
      operationId: shareUpdate
      summary: Change a share link
      description: |
        Fields left out stay as they are. An expiry of null makes the link
        last, an empty password removes it. Setting a password or a new
        one closes the link in every browser that unlocked it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareUpdate"
      responses:
        "200":
          description: The link as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The address is taken.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [shares]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: shareDelete
      summary: Delete a share link
      description: The address leads nowhere afterwards, and uploads running through it stop.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [shares]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /admin/shares:
    get:
      operationId: adminSharesList
      summary: Every share link on the server
      x-access: admin
      responses:
        "200":
          description: The links of all users, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Share"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [shares]
  /s/{slug}:
    get:
      operationId: publicShareGet
      summary: What a share link shows
      description: |
        A link with a password tells only that it is locked until the
        visitor unlocks it. Opening a link counts as a view and sends
        share.opened to its owner, once per visitor within half an hour,
        and with notify on also a notice to Unraid.
      x-access: public
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicShare"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/ShareGone"
        "429":
          $ref: "#/components/responses/TooManyTries"
      tags: [shares]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      security: []
  /s/{slug}/unlock:
    post:
      operationId: publicShareUnlock
      summary: Open a share link with its password
      description: |
        Answers a token for twelve hours and sets it as a cookie as well.
        Apps send it in X-Share-Token, plain links to files in the token
        query. Five wrong passwords make the address wait a few minutes.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareUnlocked"
        "403":
          description: The password is wrong.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/ShareGone"
        "429":
          $ref: "#/components/responses/TooManyTries"
      tags: [shares]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      security: []
  /s/{slug}/list:
    get:
      operationId: publicShareList
      summary: List a folder inside a share
      description: |
        The root of a collection lists its entries, two of the same name
        with a number. Entries starting with a dot are left out.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/SharePath"
        - $ref: "#/components/parameters/ShareToken"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/ShareGone"
      tags: [shares]
      security: []
  /s/{slug}/raw:
    get:
      operationId: publicShareRaw
      summary: Download a file from a share
      description: |
        A file is sent with range requests. With download it counts
        against the download limit, unless it goes on with a download that
        broke off. Viewing in the browser is free. A folder, or the root of
        a collection, comes as one zip or tar.gz and always counts.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/SharePath"
        - $ref: "#/components/parameters/ShareToken"
        - name: download
          in: query
          schema:
            type: boolean
        - name: format
          in: query
          description: Archive format for a folder.
          schema:
            type: string
            enum: [zip, tgz]
            default: zip
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file or the archive.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range.
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/ShareGone"
      tags: [shares]
      security: []
  /s/{slug}/upload:
    post:
      operationId: publicShareUpload
      summary: Drop a file into a collecting share
      description: |
        Starts an upload like POST /uploads, into a folder link that takes
        uploads. A link adds files but never replaces one: a name that
        exists gets a number, or with skip the file is left out. The chunks
        go to /s/{slug}/upload/{id}, and a visitor resumes by that id. The
        link's upload limit counts the uploads still running as well, and
        at most 20 can run at once.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                path:
                  type: string
                  description: Folder inside the link.
                  default: /
                name:
                  type: string
                  description: File name, with folders in front for a dropped folder.
                  example: Urlaub/IMG_0101.jpg
                size:
                  type: integer
                  format: int64
                  minimum: 0
                mtime:
                  type: string
                  format: date-time
                rule:
                  type: string
                  enum: [both, skip]
                  default: both
      responses:
        "200":
          description: Nothing was left to send, see state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "201":
          description: The upload, with its path inside the link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ShareLocked"
        "403":
          description: The link takes no uploads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/ShareGone"
        "413":
          description: The file does not fit into the upload limit of the link.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many uploads are running through the link.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "507":
          description: Not enough free space for the file.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [shares]
      security: []
  /s/{slug}/upload/{id}:
    get:
      operationId: publicShareUploadGet
      summary: State of an upload into a share
      x-access: public
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Where the upload stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [shares]
      security: []
    put:
      operationId: publicShareUploadChunk
      summary: Send the next chunk of an upload into a share
      description: Works like PUT /uploads/{id}.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: Upload-Offset
          in: header
          schema:
            type: integer
            format: int64
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The upload after the chunk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "413":
          description: The chunk goes past the announced size.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [shares]
      security: []
    delete:
      operationId: publicShareUploadCancel
      summary: Cancel an upload into a share
      x-access: public
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/ShareLocked"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [shares]
      security: []
  /unraid/state:
    get:
      operationId: unraidState
      summary: Disks, shares, pools and parity
      description: |
        Read from emhttp's disks.ini, shares.ini and var.ini, the share
        settings on the flash drive and /proc/mdstat. Empty array slots are
        left out.
      responses:
        "200":
          description: The server state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidState"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags: [unraid]
  /unraid/where:
    get:
      operationId: unraidWhere
      summary: On which disks a path lies
      description: |
        A path in /mnt/user is looked up on every disk and pool. A folder
        reports its size per disk, a file with several hard links also the
        other names the user may see. Very large folders answer with
        partial true.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: Where the path lies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidWhere"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [unraid]
  /unraid/transfer:
    post:
      operationId: unraidTransfer
      summary: Check a copy, move or link against Unraid
      description: |
        Finds files that are the same at both ends through a disk share and
        the user share above it, hard links the transfer breaks, whether the
        files fit onto the disk Unraid would pick, and which sleeping disks
        it wakes. ops/preflight carries the same report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnraidTransfer"
      responses:
        "200":
          description: What Unraid adds to the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidTransferReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [unraid]
  /unraid/spindown:
    post:
      operationId: unraidSpindown
      summary: Spin disks down
      description: Needs write access to Unraid, which is off by default. Without disks every disk spins down.
      x-access: admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disks:
                  type: array
                  items:
                    type: string
                  example: [disk1, disk3]
      responses:
        "200":
          description: The disks told to spin down.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [unraid]
  /unraid/gather/plan:
    post:
      operationId: unraidGatherPlan
      summary: Plan moving a folder onto one disk
      description: |
        gather brings the folder onto one disk, scatter empties one disk of
        it onto the others with whole subfolders kept together. Without disk
        the plan suggests one.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, mode]
              properties:
                path:
                  type: string
                  example: /mnt/user/medien/Filme
                mode:
                  type: string
                  enum: [gather, scatter]
                disk:
                  type: string
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidGatherPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [unraid]
  /unraid/fixperms/scan:
    post:
      operationId: unraidFixpermsScan
      summary: Find entries with the wrong owner or mode
      description: |
        Counts what the fixPerms job would change. appdata, system, the VM
        folders and the flash drive keep their owners and are listed in
        kept, or named in blocked when the folder itself is one of them.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "200":
          description: The scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnraidPermsScan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags: [unraid]
  /unraid/notify/test:
    post:
      operationId: unraidNotifyTest
      summary: Send a test notification
      description: |
        Needs write access to Unraid. The notice shows in the Unraid web
        interface, the notification agents do not run for it.
      x-access: admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                description:
                  type: string
      responses:
        "204":
          description: The notice was written.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags: [unraid]
  /remotes:

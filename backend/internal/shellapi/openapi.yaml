tag:
  name: shell
  description: |
    What the computer's own file manager offers for files, only in the
    desktop app, which runs on the user's own computer: Explorer's context
    menu and properties dialog on Windows, the actions other file managers
    add on Linux, starting a program as administrator, and the system's
    icons. The rows other programs put into the menu are kept, so a person
    can hide the ones they never want to see.
paths:
  /shell:
    get:
      operationId: shellOffers
      summary: What the computer's file manager offers here
      description: |
        menu is native where the system draws its own context menu, as
        Windows does, and actions where the app lists what other file
        managers add. runAs lists the file types the computer starts as
        administrator. thumbnails says on Linux how the system's
        thumbnails come about.
      responses:
        "200":
          description: What is offered.
          content:
            application/json:
              schema:
                type: object
                required: [menu, properties, runAs]
                properties:
                  menu:
                    type: string
                    enum: [native, actions]
                  properties:
                    type: boolean
                  runAs:
                    type: array
                    items:
                      type: string
                      example: .exe
                  thumbnails:
                    $ref: "#/components/schemas/ShellThumbnails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ShellDesktopOnly"
  /shell/menu:
    post:
      operationId: shellMenu
      summary: Show the system's context menu
      description: |
        Shows the computer's own menu for the items, which share a folder,
        over the window at x and y, counted in pixels of the screen from the
        top left of the window's inside. The rows the person hid are left
        out. The answer comes once the menu has closed and the picked row
        has started. extended adds the rows Windows shows only with Shift.
        background asks for the menu of the empty space of the one folder
        in paths.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths, x, y]
              properties:
                paths:
                  type: array
                  items:
                    type: string
                  example: [/C/Users/jdp/Documents/notes.txt]
                x:
                  type: integer
                y:
                  type: integer
                extended:
                  type: boolean
                background:
                  type: boolean
      responses:
        "204":
          description: The menu has closed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not the desktop app (desktopOnly), a computer without a menu of its own (noSystemMenu), or no such item.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Another program's window is in front (windowNotInFront).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/ShellFailed"
  /shell/actions:
    get:
      operationId: shellActions
      summary: List what other file managers add for the items
      description: |
        The Dolphin service menus, Nemo actions, Nautilus scripts and
        Thunar custom actions that fit the items, without the hidden ones.
        A computer that draws its own menu has none.
      parameters:
        - name: path
          in: query
          required: true
          description: An item, once for each.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: The actions.
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShellAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShellDesktopOnly"
        "502":
          $ref: "#/components/responses/ShellFailed"
    post:
      operationId: shellRunAction
      summary: Run an action another file manager adds
      description: |
        The action has to be one the list names for the items. It runs the
        way its own file manager runs it, never through a shell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths, key]
              properties:
                paths:
                  type: array
                  items:
                    type: string
                key:
                  type: string
      responses:
        "204":
          description: The action has started.
        "400":
          description: No such action for the items (unknownAction), or a bad request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShellDesktopOnly"
        "502":
          $ref: "#/components/responses/ShellFailed"
  /shell/properties:
    post:
      operationId: shellProperties
      summary: Open the system's properties dialog
      description: |
        Explorer's properties dialog on Windows, with security, details and
        previous versions, or the dialog of another file manager on Linux.
        The answer comes once the dialog is open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  items:
                    type: string
      responses:
        "204":
          description: The dialog is open.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not the desktop app (desktopOnly), no such dialog on this computer (noPropertiesDialog), or no such item.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/ShellFailed"
  /shell/runas:
    post:
      operationId: shellRunAs
      summary: Start a program as administrator
      description: |
        Windows asks the person first. A no there is no failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "204":
          description: The program started, or the person said no.
        "400":
          description: Not a program the computer starts as administrator (notAProgram), or a bad request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShellDesktopOnly"
        "502":
          $ref: "#/components/responses/ShellFailed"
  /shell/icon:
    get:
      operationId: shellIcon
      summary: The system's icon of an item or a type
      description: |
        With path the icon of that item, which for a program, a shortcut or
        a folder may be its own. With name the icon of files of that type,
        or of folders with dir=true, without looking at any file. A PNG, or
        an SVG from a Linux icon theme. With v, the item's change time, the
        icon may be kept for good.
      parameters:
        - name: path
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: dir
          in: query
          schema:
            type: boolean
        - name: size
          in: query
          required: true
          schema:
            type: string
            enum: ["16", "32", "48", "256"]
        - name: v
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The icon.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not the desktop app (desktopOnly), or no icon.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /shell/thumbnails:
    post:
      operationId: shellThumbnails
      summary: Let thumbnailers into the sandbox, or not
      description: |
        Where the kernel keeps user namespaces from programs without an
        AppArmor profile, as Ubuntu does since 24.04, bwrap cannot shut the
        system's thumbnailers in. With allow the app puts a profile for its
        own program in place, after the computer asked for administrator
        rights, and takes it away without. It answers how thumbnails come
        about afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow]
              properties:
                allow:
                  type: boolean
      responses:
        "200":
          description: How thumbnails come about now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellThumbnails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The prompt for administrator rights was turned down (elevationDeclined).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/ShellDesktopOnly"
        "409":
          description: The profile could not be put in place or loaded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /shell/entries:
    get:
      operationId: shellEntries
      summary: List the rows other programs put into the system's menu
      description: |
        Every row the app has seen in the system's menu or among the
        actions, with its picture and whether the person hid it.
      responses:
        "200":
          description: The rows, by label.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShellEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ShellDesktopOnly"
  /shell/entries/hidden:
    put:
      operationId: shellHideEntries
      summary: Choose the rows to hide
      description: |
        The rows named by keys are hidden and every other one shows again,
        so an empty list shows them all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: array
                  items:
                    type: string
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ShellDesktopOnly"
components:
  responses:
    ShellDesktopOnly:
      description: Not the desktop app (desktopOnly), or no such item.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ShellFailed:
      description: The computer could not do it (systemFailed).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ShellThumbnails:
      type: object
      required: [way, restricted, allowed, restart]
      properties:
        way:
          type: string
          enum: [sandbox, service, cache]
          description: |
            sandbox where thumbnailers run in bwrap, service where the
            desktop's thumbnail service draws them, cache where only the
            pictures other file managers drew show.
        restricted:
          type: boolean
          description: The kernel keeps the sandbox out, which the app's AppArmor profile lifts.
        allowed:
          type: boolean
          description: The app's AppArmor profile is in place.
        restart:
          type: boolean
          description: |
            The profile came or went after the app started. The app keeps
            the AppArmor label it started with until it starts again.
    ShellEntry:
      type: object
      required: [key, label, hidden]
      properties:
        key:
          type: string
          description: The row's verb where it has one, its text otherwise.
          example: verb:7-zip.compress
        label:
          type: string
        icon:
          type: string
          description: A data URL, left out when the row has no picture.
        hidden:
          type: boolean
    ShellAction:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
        icon:
          type: string
        group:
          type: string
          description: The submenu the action sits in.

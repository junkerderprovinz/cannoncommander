tag:
  name: filemanager
  description: |
    The desktop app in the place of the computer's own file manager, on
    Windows and Linux. Folders that other programs, Explorer, Win+E or the
    desktop open then come to the app, and it stays in the tray after its
    window closes so they show quickly.
paths:
  /filemanager:
    get:
      operationId: fileManagerGet
      summary: Whether the computer opens its folders in the app
      responses:
        "200":
          description: The switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileManagerState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not the desktop app on Windows or Linux (desktopOnly).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [filemanager]
    put:
      operationId: fileManagerSet
      summary: Make the app the computer's file manager or give the place back
      description: |
        On Windows the app writes its entry for folders and drives and for
        Win+E below HKCU\Software\Classes; on Linux the default for
        inode/directory and the D-Bus service org.freedesktop.FileManager1.
        Off gives the place back to the program that had it before. The
        words name the app in the folder's context menu and in its tray
        menu, in the language of the window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on:
                  type: boolean
                words:
                  type: object
                  properties:
                    open:
                      type: string
                      example: In CannonCommander öffnen
                    show:
                      type: string
                    quit:
                      type: string
      responses:
        "200":
          description: The switch as the computer has it now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileManagerState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not the desktop app on Windows or Linux (desktopOnly).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The computer did not take the change (fileManagerNotSet).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [filemanager]
components:
  schemas:
    FileManagerState:
      type: object
      required: [on]
      properties:
        on:
          type: boolean

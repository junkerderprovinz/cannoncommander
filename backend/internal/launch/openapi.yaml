tag:
  name: launch
  description: |
    Opening a file the way a double click in the computer's own file
    manager does, only in the desktop app, which runs on the user's own
    computer: a document in its program, a program by running it.
paths:
  /launch:
    post:
      operationId: launchOpen
      summary: Open a file in its program or run it
      description: |
        A document opens in the program the computer has for its type, on
        Windows through the shell as Explorer opens it, elsewhere through
        gio or xdg-open. A program starts, after the warnings Windows shows
        for files from the internet. On Linux an executable file or a
        desktop entry starts only with run, as the file managers there ask
        first, and without it the answer is 409 askRun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  example: /C/Users/jdp/Documents/notes.txt
                run:
                  type: boolean
                  description: The person chose to run the program.
      responses:
        "204":
          description: The file is open or the program started.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not the desktop app (desktopOnly), or no such file.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The file is a program and run was not set (askRun).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The file did not open (notStarted).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [launch]

tag:
  name: fileops
  description: |
    Creating and renaming, uploads, and the check before a transfer.
    Copying, moving and deleting run as jobs (kinds copy, move, delete and
    trash on POST /jobs). A file in work is written as ".name.cc-part" next
    to its target and only takes its name once it is complete.
paths:
  /fs/mkdir:
    post:
      operationId: fsMkdir
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathBody"
      responses:
        "201":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /fs/touch:
    post:
      operationId: fsTouch
      summary: Create an empty file or update its time
      description: Answers 201 for a new file, 200 when only the time of an existing one changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                mtime:
                  type: string
                  format: date-time
                  description: The time to set, now when missing.
      responses:
        "200":
          $ref: "#/components/responses/FsChanged"
        "201":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /fs/rename:
    post:
      operationId: fsRename
      summary: Rename one entry
      description: Renames inside the same folder. An existing entry of the new name is never replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name]
              properties:
                path:
                  type: string
                name:
                  type: string
                  description: The new name, without a folder.
      responses:
        "200":
          $ref: "#/components/responses/FsChanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /fs/rename/batch:
    post:
      operationId: fsRenameBatch
      summary: Rename many entries with a pattern
  /fs/link:
    post:
      operationId: fsLink
      summary: Create a symbolic or hard link
  /fs/attrs:
    patch:
      operationId: fsAttrs
      summary: Change mode, owner or times
  /ops/preflight:
    post:
      operationId: opsPreflight
      summary: Check a copy or move before it starts
      description: |
        Reports the names that exist at the target, the size, the free
        space and whether a parity check would hold the job, so the
        conflict dialog can ask before the job runs. The answers go into
        the decisions of the job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TransferParams"
                - type: object
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      enum: [copy, move]
      responses:
        "200":
          description: What the transfer would run into.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preflight"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /uploads:
    post:
      operationId: uploadCreate
      summary: Start an upload
      description: |
        Announces a file and its size. The bytes go to ".name.cc-part" next
        to the target and the file takes its name with the last chunk.
        Missing folders on the way are created, so a dropped folder keeps
        its structure. Starting again for the same target and size picks
        up the running upload, which is how a client resumes after a reload
        and how it answers a conflict: it sends the same request with the
        rule it chose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: The running upload for this target, or the finished one when nothing was left to send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "201":
          description: A new upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "507":
          description: Not enough free space for the file.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /uploads/{id}:
    get:
      operationId: uploadGet
      summary: State of an upload, for resuming
      responses:
        "200":
          description: Where the upload stands.
          headers:
            Upload-Offset:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: uploadChunk
      summary: Send the next chunk
      description: |
        The body is the raw bytes. Upload-Offset, or the start of
        Content-Range, says where they go, and has to match the offset of
        the upload. A chunk may hold up to 64 MiB. When the connection
        breaks, what arrived is kept and GET tells where to go on.
      parameters:
        - name: Upload-Offset
          in: header
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The upload after the chunk. Its state is done once the file has its name.
          headers:
            Upload-Offset:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "410":
          description: The part file disappeared, the upload has to start over.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The chunk goes past the announced size.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: uploadCancel
      summary: Cancel an upload
      description: Removes the part file.
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    UploadConflict:
      description: |
        Either a file of this name exists and the rule is ask, then
        conflict tells both sides, or the chunk does not start at the
        offset of the upload, then upload tells where it stands. A start
        for a target another upload is writing answers 409 as well.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  upload:
                    $ref: "#/components/schemas/Upload"
                  conflict:
                    $ref: "#/components/schemas/JobConflict"
    FsChanged:
      description: The entry as it is now, and the undo step for it.
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path:
                type: string
              created:
                type: boolean
              undo:
                type: string
                description: Id of the undo step, for POST /undo.
  schemas:
    UploadRequest:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
          description: The file to create.
        size:
          type: integer
          format: int64
          minimum: 0
        mtime:
          type: string
          format: date-time
          description: Modification time the file gets, usually lastModified of the browser file.
        rule:
          type: string
          enum: [ask, skip, replace, both, newer]
          default: ask
          description: |
            What happens when the name exists. ask answers 409 with the
            conflict, replace moves the old file to the trash, both keeps
            the new one as "name (1).ext", newer replaces only an older
            file. The rule is applied again when the last chunk arrives.
    Upload:
      type: object
      required: [id, path, size, offset, state, rule, chunk]
      properties:
        id:
          type: string
        path:
          type: string
          description: The target, and once done the file it became, which differs when both were kept.
        size:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
          description: Bytes received so far, where the next chunk starts.
        state:
          type: string
          enum: [open, done, skipped]
        rule:
          type: string
        mtime:
          type: string
          format: date-time
        chunk:
          type: integer
          description: The chunk size the server asks for.
    PermsParams:
      type: object
      description: Params of the job kind fixPerms. Admins only.
      required: [path]
      properties:
        path:
          type: string
    PathBody:
      type: object
      required: [path]
      properties:
        path:
          type: string
    PathsParams:
      type: object
      description: Params of the job kinds delete and trash.
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
    TransferParams:
      type: object
      description: Params of the job kinds copy and move.
      required: [sources, dest]
      properties:
        sources:
          type: array
          description: Files and folders, also from different folders.
          items:
            type: string
        dest:
          type: string
          description: The folder they go into.
        names:
          type: array
          description: Names at the target, in the order of the sources.
          items:
            type: string
        rule:
          type: string
          enum: [ask, skip, replace, both, newer]
          default: ask
          description: |
            Answers every conflict without a decision. ask waits for
            POST /jobs/{id}/decide after job.conflict. replace moves the
            old entry to the trash, both gives the new one a number,
            newer replaces only older files. Folders on both sides are
            merged for replace and newer.
        decisions:
          type: object
          description: Answers keyed by conflict key, for example from the preflight.
          additionalProperties:
            type: string
            enum: [skip, replace, both, newer]
        verify:
          type: boolean
          description: Read every copied file back and compare checksums.
        keepAttrs:
          type: boolean
          default: true
          description: Keep owner, mode and times. Without it new entries belong to the user the server runs as.
    Preflight:
      type: object
      required: [dest, count, bytes, files, conflicts, sameDevice, big, parityBusy]
      properties:
        dest:
          type: string
        count:
          type: integer
        bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/JobConflict"
        sameDevice:
          type: boolean
          description: A move that only renames and needs no free space.
        space:
          $ref: "#/components/schemas/Space"
        big:
          type: boolean
          description: From 2 GiB on the job waits for a running parity check.
        parityBusy:
          type: boolean
          description: Unraid checks parity right now. For small jobs the client asks whether to wait.
        unraid:
          $ref: "#/components/schemas/UnraidTransferReport"
          description: Trap, broken hard links, space after the allocation rules and disks that wake up. Missing where Unraid has nothing to say.
    Space:
      type: object
      required: [free, need, enough]
      properties:
        free:
          type: integer
          format: int64
        need:
          type: integer
          format: int64
        enough:
          type: boolean

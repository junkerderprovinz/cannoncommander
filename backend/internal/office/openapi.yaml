tag:
  name: office
  description: |
    Office files in OnlyOffice, Euro-Office or Collabora, as chosen in
    admin/app. The document server reaches the file and callback addresses
    and the WOPI endpoints without a session, with the token from
    office/config, which is good for one file, one user and 24 hours. The
    user's rights are checked again on every call.
paths:
  /office/config:
    get:
      operationId: officeConfig
      summary: What the viewer needs to open a file in the office server
      description: |
        For OnlyOffice and Euro-Office the editor config, signed with the
        server's JWT secret when one is set. Users who may not change the
        file get it in view mode. For Collabora the editor address with
        WOPISrc, the access token and its end in milliseconds, to post into
        the editor frame as access_token and access_token_ttl.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: mode
          in: query
          description: view opens the file read only, for a preview.
          schema:
            type: string
            enum: [edit, view]
      responses:
        "200":
          description: How to open the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No office server is set up.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Collabora did not answer its discovery.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /office/file:
    get:
      operationId: officeFile
      summary: The document for OnlyOffice and Euro-Office
      x-access: public
      parameters:
        - $ref: "#/components/parameters/OfficeToken"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /office/callback:
    post:
      operationId: officeCallback
      summary: Where OnlyOffice and Euro-Office report and save a document
      description: |
        With a JWT secret only signed callbacks count. On status 2 and 6
        the document is fetched from the document server, only from its
        own address, and replaces the file. The answer is always
        {"error":0} or {"error":1}, as the document server expects.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/OfficeToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                status:
                  type: integer
                url:
                  type: string
                token:
                  type: string
      responses:
        "200":
          description: The answer for the document server.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: integer
                    enum: [0, 1]
  /wopi/files/{id}:
    get:
      operationId: wopiCheckFileInfo
      summary: WOPI CheckFileInfo
      x-access: public
      parameters:
        - $ref: "#/components/parameters/WopiToken"
      responses:
        "200":
          description: Name, size, version and the user's rights.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: wopiLock
      summary: WOPI LOCK, GET_LOCK, REFRESH_LOCK and UNLOCK
      description: The operation comes in X-WOPI-Override, the lock in X-WOPI-Lock. A lock holds 30 minutes.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/WopiToken"
      responses:
        "200":
          description: Done, X-WOPI-Lock carries the lock.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another lock is in the way, X-WOPI-Lock names it.
  /wopi/files/{id}/contents:
    get:
      operationId: wopiGetFile
      summary: WOPI GetFile
      x-access: public
      parameters:
        - $ref: "#/components/parameters/WopiToken"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: wopiPutFile
      summary: WOPI PutFile
      description: |
        Replaces the file with the body. A file locked by someone else, or
        changed since the time in X-COOL-WOPI-Timestamp, answers 409.
      x-access: public
      parameters:
        - $ref: "#/components/parameters/WopiToken"
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  LastModifiedTime:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Locked by someone else, or changed meanwhile.
  /admin/office/found:
    get:
      operationId: officeFound
      summary: Office servers running as containers next to this one
      description: |
        Reads the Docker engine when its socket is mounted: the running
        OnlyOffice, Euro-Office and Collabora containers with the address
        that answers, the browser's host with a published port first. A
        container's JWT secret stays on the server, secret only says whether
        there is one to take. Without a socket docker is false and the list
        is empty.
      x-access: admin
      responses:
        "200":
          description: What was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeFound"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/office/probe:
    post:
      operationId: officeProbe
      summary: Look for office servers at one host
      description: |
        Asks the host on the ports office servers usually listen on, such as
        9900 for Euro-Office and 9980 for Collabora, for the OnlyOffice
        health check and the WOPI discovery. Only that host is asked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host:
                  type: string
                  description: A host name or address, without scheme or port.
      responses:
        "200":
          description: The servers that answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/office/connect:
    post:
      operationId: officeConnect
      summary: Use an office server found in Docker
      description: |
        Tests the container's server at its address with its JWT secret and,
        when it answers, saves it as the office server. The secret goes from
        the container into the settings and is not sent back.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: The container's id from office/found.
      responses:
        "200":
          description: What the test found and the office settings.
          content:
            application/json:
              schema:
                type: object
                required: [result, office]
                properties:
                  result:
                    $ref: "#/components/schemas/IntegrationResult"
                  office:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum: [none, onlyoffice, eurooffice, collabora]
                      url:
                        type: string
                      secretSet:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    OfficeToken:
      name: token
      in: query
      required: true
      schema:
        type: string
    WopiToken:
      name: access_token
      in: query
      required: true
      schema:
        type: string
  schemas:
    OfficeFound:
      type: object
      required: [docker, servers]
      properties:
        docker:
          type: boolean
          description: Whether the Docker engine could be read.
        servers:
          type: array
          items:
            $ref: "#/components/schemas/OfficeServer"
    OfficeServer:
      type: object
      required: [kind, url, reachable]
      properties:
        id:
          type: string
          description: The container's id, missing for a server a probe found.
        kind:
          type: string
          enum: [onlyoffice, eurooffice, collabora]
        name:
          type: string
          description: The container's name.
        url:
          type: string
          description: The address that answered, or the best guess when none did.
        reachable:
          type: boolean
          description: Whether this server got an answer at url.
        secret:
          type: string
          enum: [found, "off", unknown]
          description: |
            For OnlyOffice and Euro-Office in a container: found when its
            JWT_SECRET can be taken over, off when it checks no token,
            unknown when it made up its own.
        wopi:
          type: string
          enum: [open, allowed, blocked]
          description: |
            For Collabora in a container: open when its aliasgroup settings
            name no hosts, allowed when they name this server, blocked when
            they name others only.
        allow:
          type: string
          description: The address to add to Collabora's aliasgroup1 when wopi is blocked.
    OfficeConfig:
      type: object
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [onlyoffice, eurooffice, collabora]
        url:
          type: string
          description: The document server, or for Collabora the editor address with WOPISrc.
        config:
          type: object
          description: The editor config for DocsAPI.DocEditor.
          additionalProperties: true
        token:
          type: string
          description: The WOPI access token.
        ttl:
          type: integer
          format: int64
          description: When the access token ends, in milliseconds since 1970.

tag:
  name: fs
  description: Reading files and folders.
paths:
  /fs/list:
    get:
      operationId: fsList
      summary: List a folder
      description: |
        Lists the entries of a folder in name order. The folders / and /mnt
        are virtual and list the sources below them. Entries the user may
        not see are left out. Folders carry their entry count and total size
        where the index knows them. The ETag follows the entries only, so a
        change in free space alone still answers 304.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The folder and its entries.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsList"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /fs/tree:
    get:
      operationId: fsTree
      summary: Subfolders for the folder tree
      description: |
        Returns the visible subfolders of one folder, one level deep. The
        tree asks again when a folder is opened. Folders where a source is
        mounted carry its name and fill level, folders where an rclone
        remote is mounted carry the remote.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The folder with its subfolders.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsTree"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /fs/stat:
    get:
      operationId: fsStat
      summary: Details of one path
      description: |
        The same fields as a listing row, for one path. A folder also gets
        the number of files and folders anywhere below it, as far as the
        index knows them.
      parameters:
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: The path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsStat"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /fs/meta:
    post:
      operationId: fsMeta
      summary: Metadata columns for many paths
      description: |
        Takes the visible rows and the wanted columns and reads what is
        inside the files: photo details from EXIF, streams from ffprobe,
        music tags, pages and document details, archive contents, disk
        image and program details, checksums. What was read stays in the
        metadata cache until the file changes, so asking again is cheap.

        A value comes back only where the file has one. Paths the user may
        not see or that are gone are left out, so are columns this
        endpoint does not fill. Checksums are worked out for files up to
        1 GiB, bigger ones go through the checksum tool. Reading stops after
        25 seconds and answers with what it has.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsMetaRequest"
      responses:
        "200":
          description: The values by path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fs/raw:
    get:
      operationId: fsRaw
      summary: File content, with range requests
      description: |
        Sends the file as it is, with Range, If-Range and conditional
        requests. Needs the download right. Pages and drawings come with a
        sandbox policy, so their scripts do not run.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: download
          in: query
          description: Ask the browser to save the file instead of showing it.
          schema:
            type: boolean
      responses:
        "200":
          description: The whole file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range.
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The range lies outside the file.
  /fs/thumb:
    get:
      operationId: fsThumb
      summary: Thumbnail of a file or folder picture
      description: |
        A small picture of an image, video, document or album cover. For a
        folder it is the folder's poster.jpg, folder.jpg or cover.jpg. A
        client that adds the file's mtime as v may cache the answer for
        good.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: size
          in: query
          schema:
            type: string
            enum: [small, large]
            default: small
        - name: v
          in: query
          description: Any value that changes with the file, such as its mtime.
          schema:
            type: string
      responses:
        "200":
          description: The picture.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The path does not exist or has no thumbnail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /fs/page:
    get:
      operationId: fsPage
      summary: One page of a PDF or office file as an image
      description: |
        Draws a page with MuPDF as a PNG of the given width. Works for PDF,
        XPS, EPUB, CBZ, FB2 and MOBI, and for office files as far as MuPDF
        reads them. The number of pages is the pages column of fs/meta.
        Needs the download right. A client that adds the file's mtime as v
        may cache the answer for good.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: page
          in: query
          description: Page number, counted from 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: width
          in: query
          description: Width of the picture in pixels.
          schema:
            type: integer
            minimum: 64
            maximum: 4096
            default: 1200
        - name: v
          in: query
          description: Any value that changes with the file, such as its mtime.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The path or the page does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The file has no pages.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: MuPDF is not installed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /fs/text:
    get:
      operationId: fsText
      summary: Text content with encoding detection
      description: |
        Reads the start of a text file and decodes it. The encoding comes
        from a byte order mark, then from valid UTF-8, and falls back to
        Windows-1252. Needs the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: encoding
          in: query
          description: Decodes the text in this encoding instead of finding it, for a file the guess gets wrong.
          schema:
            type: string
            enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1250, windows-1251, windows-1252, iso-8859-1, iso-8859-2, iso-8859-15, koi8-r]
        - name: max
          in: query
          description: Bytes to read at most.
          schema:
            type: integer
            minimum: 1
            maximum: 16777216
            default: 1048576
      responses:
        "200":
          description: The text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsText"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          description: The file holds binary data.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /fs/hex:
    get:
      operationId: fsHex
      summary: A byte range for the hex view
      description: Needs the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: length
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 65536
            default: 4096
      responses:
        "200":
          description: The bytes. Fewer than asked for at the end of the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsHex"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /fs/file:
    get:
      operationId: fsFileGet
      summary: File content for the editor
      description: |
        The whole text of a file up to 16 MiB, decoded like fs/text and, with
        encoding, in the encoding asked for. The ETag follows the bytes, and
        a save sends it back in If-Match. Needs the download right.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: encoding
          in: query
          description: Decodes the text in this encoding instead of finding it, for a file the guess gets wrong.
          schema:
            type: string
            enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1250, windows-1251, windows-1252, iso-8859-1, iso-8859-2, iso-8859-15, koi8-r]
      responses:
        "200":
          description: The text.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsFile"
        "304":
          description: Unchanged since the ETag in If-None-Match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The file is too big for the editor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The file holds binary data.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: fsFilePut
      summary: Save a file from the editor
      description: |
        Writes the text in the encoding given, by default the one the file
        has. With If-Match the save only goes through while the file is
        unchanged since it was read, with If-None-Match * only when it does
        not exist yet. The file is written next to the old one and renamed
        over it, keeping mode and owner. A file with hard links is written
        in place, so its other names keep seeing the same content. Needs
        the modify right, or the create right for a new file.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: If-Match
          in: header
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
            enum: ["*"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                encoding:
                  type: string
                  enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1250, windows-1251, windows-1252, iso-8859-1, iso-8859-2, iso-8859-15, koi8-r]
                eol:
                  type: string
                  enum: [lf, crlf, cr]
                  description: Rewrites every line break. Missing keeps them as sent.
      responses:
        "200":
          description: Saved.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsSaved"
        "201":
          description: Saved as a new file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The folder for a new file is missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: The file changed since it was read, or exists already for If-None-Match *.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The text is too big for the editor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The text holds characters the encoding cannot store (notEncodable, with the encoding's name).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /fs/archive-stream:
    post:
      operationId: fsArchiveStream
      summary: Download several paths as one archive
      description: |
        Packs while it sends, so nothing stays behind on the server. Takes
        JSON or a plain form with one paths field per path, which lets a
        browser save the stream as it arrives. Two entries of the same
        name get a number. zip compresses everything but formats that are
        compressed already, tgz keeps mode and owner. Linked folders are
        left out, linked files come along when they point inside the
        source. Needs the download right on every path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: The archive.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
            application/gzip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    FsItem:
      type: object
      required: [name, dir, size, mtime, mode]
      properties:
        name:
          type: string
        dir:
          type: boolean
        size:
          type: integer
          format: int64
          description: Bytes. For a folder the total size from the index, 0 while sizeUnknown is set.
        sizeUnknown:
          type: boolean
          description: A folder the index has not measured yet, so its size is no total. An empty folder that was measured leaves it out.
        mtime:
          type: string
          format: date-time
          description: Modification time in UTC with milliseconds.
        btime:
          type: string
          format: date-time
          description: Creation time, where the file system records it.
        mode:
          type: string
          description: Permission bits in octal, with setuid, setgid and sticky in front.
          example: "0664"
        owner:
          type: string
          description: User name, or the number when the container does not know it. On Windows only fs/stat names the owner, with the computer or domain in front.
        group:
          type: string
        uid:
          type: integer
        gid:
          type: integer
        ino:
          type: integer
          format: int64
          description: Inode number. Missing below /mnt/user in a listing, because the share reports numbers of its own. fs/stat gives the one on the disk.
        nlink:
          type: integer
          format: int64
          description: Number of hard links.
        hidden:
          type: boolean
          description: The system's file manager hides the entry. On Windows that is the hidden attribute, elsewhere a name that starts with a dot or one listed in the folder's .hidden file.
        system:
          type: boolean
          description: A protected file of Windows, hidden and a system file at once, such as desktop.ini.
        attrs:
          type: string
          description: The attributes of Windows with the letters of Explorer's column, R read-only, H hidden, S system, A archive, C compressed, E encrypted, O offline, M fetched from the cloud on access, P kept on the device, U free to be dropped, L a link or junction.
          example: RA
        cloud:
          type: string
          enum: [online, local, pinned]
          description: The state of a file a cloud provider such as OneDrive keeps, as Explorer's status column shows it. An online file gets no thumbnail and no metadata, since reading it would download it.
        link:
          type: string
          description: Target of a symbolic link or a junction of Windows, as a path of the API when a source holds it.
        label:
          type: string
          description: The name Explorer shows for a folder, from the LocalizedResourceName of its desktop.ini, such as Dokumente for Documents.
        shortcut:
          type: object
          description: Where a .lnk or .url file of Windows or a .desktop launcher of Linux leads. Only the desktop app reads them.
          required: [kind]
          properties:
            kind:
              type: string
              enum: [lnk, url, desktop]
            target:
              type: string
              description: The path, network path, address or command the file names.
            path:
              type: string
              description: The target as a path of the API, when a source holds it.
            dir:
              type: boolean
            args:
              type: string
            name:
              type: string
              description: The name a launcher shows.
            icon:
              type: string
        items:
          type: integer
          description: Entries directly inside a folder. Missing when neither the index nor a quick look could count them.
        format:
          type: string
          description: Format group of a file, an id from formats.json such as video or archive.
        picture:
          type: string
          description: Name of the folder's poster.jpg, folder.jpg or cover.jpg, for the card views.
        pool:
          type: string
          description: Under /mnt/user, the Unraid pool that holds the entry, such as cache.
        remote:
          type: string
          description: The rclone remote mounted at this folder.
    Volume:
      type: object
      required: [path, free, total]
      properties:
        path:
          type: string
          description: Where the source is mounted.
        label:
          type: string
          description: Name of the source.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FsList:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsItem"
        volume:
          $ref: "#/components/schemas/Volume"
          description: Missing for the virtual folders / and /mnt.
    FsTreeItem:
      type: object
      required: [name, path, hasDirs]
      properties:
        name:
          type: string
        path:
          type: string
        hasDirs:
          type: boolean
          description: The folder has visible subfolders.
        label:
          type: string
          description: Name of the source mounted here, or of the drive, empty for a drive without one.
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        remote:
          type: string
          description: The rclone remote or the network share mounted here.
        kind:
          type: string
          enum: [fixed, removable, optical, network, virtual]
          description: What kind of drive of the computer this is, in the desktop app.
        eject:
          type: boolean
          description: The drive can be ejected.
        hidden:
          type: boolean
          description: The folder is hidden, as in a listing.
        system:
          type: boolean
          description: The folder is a protected folder of Windows.
    FsTree:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FsTreeItem"
    FsStat:
      allOf:
        - $ref: "#/components/schemas/FsItem"
        - type: object
          required: [path]
          properties:
            path:
              type: string
            files:
              type: integer
              format: int64
              description: Files anywhere below a folder.
            dirs:
              type: integer
              format: int64
              description: Folders anywhere below a folder.
            devices:
              type: array
              items:
                type: string
              description: Below /mnt/user, the disks and pools that hold the path, such as cache or disk2.
            volume:
              $ref: "#/components/schemas/Volume"
    FsText:
      type: object
      required: [path, size, mtime, encoding, text]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        encoding:
          type: string
          enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1250, windows-1251, windows-1252, iso-8859-1, iso-8859-2, iso-8859-15, koi8-r]
        eol:
          type: string
          enum: [lf, crlf, cr, mixed]
          description: Missing for text without line breaks.
        text:
          type: string
        truncated:
          type: boolean
          description: The file goes on after max bytes.
    FsFile:
      type: object
      required: [path, size, mtime, encoding, text, etag, writable]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        encoding:
          type: string
          enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, windows-1250, windows-1251, windows-1252, iso-8859-1, iso-8859-2, iso-8859-15, koi8-r]
        eol:
          type: string
          enum: [lf, crlf, cr, mixed]
        text:
          type: string
        etag:
          type: string
          description: The same as the ETag header, for If-Match on the save.
        writable:
          type: boolean
          description: The user may save the file.
    FsSaved:
      type: object
      required: [path, size, mtime, etag]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        mtime:
          type: string
          format: date-time
        etag:
          type: string
        created:
          type: boolean
    ArchiveRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
        format:
          type: string
          enum: [zip, tgz]
          default: zip
        name:
          type: string
          description: File name of the download. Made from the paths when missing.
    FsHex:
      type: object
      required: [path, size, offset, data]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
          description: Size of the whole file.
        offset:
          type: integer
          format: int64
        data:
          type: string
          format: byte
          description: The bytes, base64.
    FsMetaRequest:
      type: object
      required: [paths, columns]
      properties:
        paths:
          type: array
          maxItems: 5000
          items:
            type: string
        columns:
          type: array
          maxItems: 100
          description: |
            Column ids of the list. Photos: dimensions, camera, make, lens,
            focal, aperture, exposure, iso, flash, taken, place,
            orientation, depth, dpi. Film and music: duration, vcodec,
            acodec, framerate, vbitrate, aspect, hdr, audiotracks,
            subtitles, season, episode, artist, album, title, albumartist,
            track, year, genre, composer, abitrate, samplerate, channels.
            Documents: pages, author, lastauthor, doctitle, subject, words,
            lines, encoding, app, encrypted. Archives: unpacked, ratio,
            entries, method, archcrypt. Disk images: fs, volume, bootable.
            Programs: version, vendor, arch, signed. Checksums: sha256,
            crc32, md5, sha1. From the file system: accessed, statchange,
            disk.
          items:
            type: string
          example: [dimensions, camera, taken, place]
    FsMeta:
      type: object
      required: [items]
      properties:
        items:
          type: object
          description: |
            Per path as asked, the columns that have a value. Numbers are
            bytes for unpacked, milliseconds since 1970 for taken, accessed
            and statchange, whole seconds for duration, kBit/s for vbitrate
            and plain figures for the rest. Booleans answer yes or no
            columns. Words are codes for the client to name in its language:
            orientation is landscape, portrait or square, flash fired or off,
            channels mono, stereo, a layout such as 5.1 or a count, method
            none for stored entries or a number for an unknown zip method,
            arch all for packages that run anywhere. audiotracks and
            subtitles list two letter language codes where there is one,
            und for a track that names none. Numbers inside text, such as
            23.976 fps or f/2.8, have a decimal point.
          additionalProperties:
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: number
                - type: boolean
          example:
            /mnt/user/fotos/2026/IMG_0101.jpg:
              dimensions: 4032 × 3024
              camera: Pixel 9
              taken: 1767434400000
              place: Wien

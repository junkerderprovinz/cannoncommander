tag:
  name: accounts
  description: The own account, and users, groups, rules and activity for admins.
paths:
  /me:
    get:
      operationId: meGet
      summary: The logged in user
  /me/password:
    put:
      operationId: mePassword
      summary: Change the own password, which ends the other sessions
  /me/sessions:
    get:
      operationId: sessionsList
      summary: Open sessions
      description: |
        The logins of the own account that are still valid, the one used
        last first. A session shows up once it made a request to this API.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/sessions/{id}:
    delete:
      operationId: sessionEnd
      summary: End a session
      description: Logs that session out at once. Ending the current session logs out this client.
      responses:
        "204":
          description: Ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/tokens:
    get:
      operationId: tokensList
      summary: API tokens
    post:
      operationId: tokenCreate
      summary: Create an API token with limited rights
  /me/tokens/{id}:
    delete:
      operationId: tokenDelete
      summary: Revoke an API token
  /me/passkeys:
    get:
      operationId: passkeysList
      summary: Passkeys
    post:
      operationId: passkeyRegister
      summary: Register a passkey
  /me/passkeys/{id}:
    delete:
      operationId: passkeyDelete
      summary: Remove a passkey
  /me/totp:
    post:
      operationId: totpSetup
      summary: Turn on two factor login
    delete:
      operationId: totpDisable
      summary: Turn off two factor login
  /admin/users:
    get:
      operationId: usersList
      summary: List users
      x-access: admin
    post:
      operationId: userCreate
      summary: Create a user
      x-access: admin
  /admin/users/{id}:
    get:
      operationId: userGet
      summary: One user
      x-access: admin
    patch:
      operationId: userUpdate
      summary: Change a user
      x-access: admin
    delete:
      operationId: userDelete
      summary: Delete a user
      x-access: admin
  /admin/groups:
    get:
      operationId: groupsList
      summary: List groups
      x-access: admin
    post:
      operationId: groupCreate
      summary: Create a group
      x-access: admin
  /admin/groups/{name}:
    patch:
      operationId: groupUpdate
      summary: Change a group
      x-access: admin
    delete:
      operationId: groupDelete
      summary: Delete a group
      x-access: admin
  /admin/rules:
    get:
      operationId: rulesGet
      summary: Access rules
      x-access: admin
    put:
      operationId: rulesPut
      summary: Save access rules
      x-access: admin
  /admin/rules/test:
    post:
      operationId: rulesTest
      summary: Show what a user may do on a path
      x-access: admin
  /admin/activity:
    get:
      operationId: activityList
      summary: Activity log
      x-access: admin
components:
  schemas:
    Session:
      type: object
      required: [id, created, seen, userAgent, ip, current]
      properties:
        id:
          type: string
        created:
          type: string
          format: date-time
          description: First request of the session.
        seen:
          type: string
          format: date-time
          description: Last request, to the minute.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: The session this request came with.

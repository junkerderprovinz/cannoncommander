tag:
  name: accounts
  description: The own account, and users, groups, rules and activity for admins.
paths:
  /me:
    get:
      operationId: meGet
      summary: The logged in user
      description: |
        What CannonCommander keeps about the account. The sign-in tells the
        rest at /api/signin/v1/me. With an API token, token tells its rights.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/users:
    get:
      operationId: usersList
      summary: List users
      x-access: admin
      responses:
        "200":
          description: Every user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: userCreate
      summary: Create a user
      x-access: admin
      description: |
        The user signs in with the password. Login name, scopes and password
        are needed. Like every new password set by an admin it needs a fresh
        sign-in of the admin, otherwise the answer is 403 signInAgain with
        askPassword, and the page confirms at /api/signin/v1/me/confirm and
        sends the request once more.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The login name is taken.
  /admin/users/{id}:
    get:
      operationId: userGet
      summary: One user
      description: The id in the path may also be the login name, which always starts with a letter.
      x-access: admin
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: userUpdate
      summary: Change a user
      x-access: admin
      description: |
        Fields left out stay as they are. A new password logs the user out
        everywhere, API tokens and passkeys stay unless revoke is true. It
        needs a fresh sign-in of the admin, as creating a user does. blocked
        ends every session and API token of the user, and a lower role does
        too.
        revoke ends every session, API token and passkey of the user, with
        or without a new password, and is not possible with an API token.
        Renaming moves the user's rules, jobs, undo steps and trash along.
        Nobody can change their own login name or password here, revoke
        their own access, or take away their own admin role, so there is
        always an admin left. Nobody blocks themselves, and the owner keeps
        the admin role and cannot be blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The login name is taken, or an admin tried to give up the own admin role.
    delete:
      operationId: userDelete
      summary: Delete a user
      x-access: admin
      description: |
        Removes the account with its shares, jobs, undo steps, rules,
        settings, sessions and tokens. Files stay where they are. What the
        user put in the trash stays there for admins until its days are over.
        Nobody can delete themselves.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}/tokens:
    get:
      operationId: userTokensList
      summary: API tokens of a user
      description: The tokens of the user by name, without their secrets.
      x-access: admin
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}/tokens/{token}:
    delete:
      operationId: userTokenRevoke
      summary: Revoke an API token of a user
      description: Whatever uses the token loses access at once. Not possible with an API token.
      x-access: admin
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}/passkeys:
    get:
      operationId: userPasskeysList
      summary: Passkeys of a user
      x-access: admin
      responses:
        "200":
          description: The passkeys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Passkey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}/passkeys/{passkey}:
    delete:
      operationId: userPasskeyRemove
      summary: Remove a passkey of a user
      description: Not possible with an API token.
      x-access: admin
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}/sessions:
    get:
      operationId: userSessionsList
      summary: Open sessions of a user
      description: Like the own list. current is true only for the session of the admin who asks.
      x-access: admin
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}/sessions/{session}:
    delete:
      operationId: userSessionEnd
      summary: End a session of a user
      description: Logs that session out at once. Not possible with an API token.
      x-access: admin
      responses:
        "204":
          description: Ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/groups:
    get:
      operationId: groupsList
      summary: List groups
      x-access: admin
      responses:
        "200":
          description: Every group.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: groupCreate
      summary: Create a group
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The group exists.
  /admin/groups/{name}:
    patch:
      operationId: groupUpdate
      summary: Change a group
      x-access: admin
      description: Fields left out stay as they are. Renaming moves the group's rules along.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A group with the new name exists.
    delete:
      operationId: groupDelete
      summary: Delete a group
      x-access: admin
      description: The group and its rules go, its members stay users.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/rules:
    get:
      operationId: rulesGet
      summary: Access rules
      x-access: admin
      description: The rules in order. For a path, the first rule that matches decides.
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: rulesPut
      summary: Save access rules
      x-access: admin
      description: |
        Replaces every rule with the list, in its order. A path has to
        exist, a pattern has a star. They count at once for every request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleList"
      responses:
        "200":
          description: Saved, with the paths in their stored form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "400":
          description: A rule is wrong. The detail names it, counted from 1.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/rules/test:
    post:
      operationId: rulesTest
      summary: Show what a user may do on a path
      x-access: admin
      description: |
        Asks the file system as that user, so the answer takes the scope,
        the role, read only sources and the rules into account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, path]
              properties:
                user:
                  type: string
                  description: Login name.
                path:
                  type: string
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: There is no such user.
  /admin/activity:
    get:
      operationId: activityList
      summary: Activity log
      x-access: admin
      description: Who did what and when, the newest first. Without from, the last seven days.
      parameters:
        - name: from
          in: query
          schema:
            type: integer
          description: Unix seconds.
        - name: to
          in: query
          schema:
            type: integer
          description: Unix seconds.
        - name: username
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
          description: One or more event types, separated by commas, such as login,upload.
        - name: path
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityEntry"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  schemas:
    Session:
      type: object
      required: [id, created, seen, userAgent, ip, current]
      properties:
        id:
          type: string
        created:
          type: string
          format: date-time
          description: First request of the session.
        seen:
          type: string
          format: date-time
          description: Last request, to the minute.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: The session this request came with.
    Account:
      type: object
      required: [id, name, full, role, scope, groups, loginMethod, twofa, passkeys, blocked, owner, last, pwChanged]
      properties:
        id:
          type: string
          description: A number too large for JavaScript, so it comes as a string.
        name:
          type: string
          description: The login name.
        full:
          type: string
          description: The name to show. The login name when none is set.
        role:
          type: string
          enum: [admin, user, readonly]
        scope:
          type: string
          description: The folder the user sees, as an absolute path.
        groups:
          type: array
          items:
            type: string
        loginMethod:
          type: string
          enum: [password, oidc]
          description: oidc for an account without a password, which signs in through a sign-in service.
        twofa:
          type: boolean
        passkeys:
          type: integer
        blocked:
          type: boolean
          description: A blocked account signs in nowhere until an admin unblocks it.
        owner:
          type: boolean
          description: The owner set the first password. Its role stays admin, and nobody blocks or removes it.
        last:
          type: [string, "null"]
          format: date-time
          description: The last sign-in, null for never.
        pwChanged:
          type: [string, "null"]
          format: date-time
    Me:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [home, signIn, hasPassword]
          properties:
            signIn:
              type: boolean
              description: Whether this server asks anyone to sign in. Without a password on any account it opens for everyone as the admin, unless OIDC in the config guards it.
            hasPassword:
              type: boolean
              description: Whether the account has a password.
            home:
              type: string
              description: The folder the file manager opens when the user picked no start folder, the user shares or the first other source the user may open.
            token:
              type: object
              description: The API token the request came with.
              required: [rights]
              properties:
                rights:
                  type: string
                  enum: [r, rw]
    UserInput:
      type: object
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9._-]{1,31}$"
          description: The login name.
        full:
          type: string
        role:
          type: string
          enum: [admin, user, readonly]
          description: user when left out of a new user.
        scope:
          type: string
          description: |
            An existing folder as an absolute path. A folder such as /mnt
            that only leads to sources stands for all of them. The single
            disks and the cache are for admins.
        groups:
          type: array
          items:
            type: string
        password:
          type: string
          minLength: 12
        blocked:
          type: boolean
          description: In a change, blocks or unblocks the user. Blocking ends every session and API token.
        revoke:
          type: boolean
          description: In a change, ends every session, API token and passkey of the user.
    Token:
      type: object
      required: [id, name, rights, created, expires, last]
      properties:
        id:
          type: string
        name:
          type: string
        rights:
          type: string
          enum: [r, rw]
        created:
          type: string
          format: date-time
        expires:
          type: [string, "null"]
          format: date-time
          description: Null when it never runs out.
        last:
          type: [string, "null"]
          format: date-time
          description: Last use to the minute, null for never.
    Passkey:
      type: object
      required: [id, name, origin, created, last]
      properties:
        id:
          type: string
        name:
          type: string
        origin:
          type: string
          description: The host the passkey works for.
        created:
          type: string
          format: date-time
        last:
          type: [string, "null"]
          format: date-time
    Group:
      type: object
      required: [name, note, members]
      properties:
        name:
          type: string
        note:
          type: string
        members:
          type: array
          description: Login names.
          items:
            type: string
    GroupInput:
      type: object
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
        note:
          type: string
        members:
          type: array
          items:
            type: string
    Rule:
      type: object
      required: [who, path, rule]
      properties:
        who:
          type: string
          description: A login name, @ and a group name, or * for everybody.
          example: "@familie"
        path:
          type: string
          description: |
            An absolute path, which covers the folder and everything in it,
            or a pattern with a star, which matches names anywhere, such as
            *.partial*. Patterns ignore case.
        rule:
          type: string
          enum: [hide, read, allow]
          description: Allow lifts a rule further down, such as for a subfolder.
    RuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Rule"
    Verdict:
      type: object
      required: [result, reason]
      properties:
        result:
          type: string
          enum: [visible, read, hidden, missing]
        reason:
          type: string
          enum: [scope, rule, role, source, none]
          description: |
            What decided: the scope of the user, a rule, the read only
            role, a read only source, or nothing in particular.
        rule:
          type: integer
          description: The deciding rule, counted from 0.
        scope:
          type: string
          description: The folder of the user, when the scope decided.
    ActivityEntry:
      type: object
      required: [id, t, who, what, obj, details]
      properties:
        id:
          type: integer
        t:
          type: string
          format: date-time
        who:
          type: string
          description: The login name, anonymous for public links.
        what:
          type: string
          description: The event type, such as login, upload or shareCreate.
        obj:
          type: string
          description: What the event was about in a few words, such as a path or a user.
        path:
          type: string
          description: Absolute path, when the event touched files.
        target:
          type: string
          description: Where a move or copy went.
        ip:
          type: string
        authMethod:
          type: string
          description: How the person signed in for this, apiKey for an API token and mcp for an assistant with a key of the MCP server.
        tokenName:
          type: string
          description: The name of that token or key.
        details:
          type: object

tag:
  name: search
  description: Search by name pattern, fields and content.
paths:
  /search:
    get:
      operationId: search
      summary: Search below a folder
      description: |
        Finds files and folders below path by name, fields, kind, size and
        age, the way the list's filter and the search window do. The name
        line takes words that match anywhere in a name, patterns with * and
        ? for the whole name, #words for tags and colours, and field tests
        such as breite:>=3840, codec:hevc, interpret:"Queen", größe:>1GB or
        geändert:<30d. Every column name works as a field.

        The search reads the index where it holds the folder and the disk
        otherwise. Field tests on metadata read it for files the cache does
        not know yet for ten seconds, files left after that count as
        pending. Hidden entries and everything inside hidden folders are
        left out unless hidden is true.

        Hits come folders first and in name order. Total counts all of
        them, items holds the first limit. A line with unknown fields finds
        nothing and names them. A search for text inside files is the job
        kind contentSearch with the same criteria and text, its hits arrive
        as search.hits events.
      parameters:
        - $ref: "#/components/parameters/Path"
        - name: q
          in: query
          description: The name line, with field tests.
          schema:
            type: string
          example: "*.mkv breite:>=3840"
        - name: hidden
          in: query
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          schema:
            type: string
            enum: [all, dir, img, video, audio, doc, arch]
            default: all
        - name: min
          in: query
          description: Smallest size, such as 300 KB. A number alone counts in MB. Folders count with their total size.
          schema:
            type: string
        - name: max
          in: query
          description: Largest size, written like min.
          schema:
            type: string
        - name: when
          in: query
          description: Changed today, in the last 7, 30 or 365 days, or more than a year ago.
          schema:
            type: string
            enum: [any, "1", "7", "30", "365", old]
            default: any
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 2000
      responses:
        "200":
          description: The hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /search/saved:
    get:
      operationId: savedSearchesList
      summary: Saved searches
      description: The own saved searches, oldest first.
      responses:
        "200":
          description: The saved searches.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedSearch"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: savedSearchCreate
      summary: Save a search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchInput"
      responses:
        "201":
          description: The new saved search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: There are 200 saved searches already.
  /search/saved/{id}:
    put:
      operationId: savedSearchUpdate
      summary: Change a saved search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchInput"
      responses:
        "200":
          description: The changed saved search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: savedSearchDelete
      summary: Delete a saved search
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    SavedSearchInput:
      type: object
      required: [name, query]
      properties:
        name:
          type: string
        query:
          type: object
          description: |
            The search as the search window sends it, stored as given. When
            it has a field in, that has to be a folder path.
          additionalProperties: true
          example: { text: "", in: /mnt/user, name: "*.iso *.img", min: 1 GB, when: any, type: all, hidden: false }
    SavedSearch:
      allOf:
        - $ref: "#/components/schemas/SavedSearchInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    SearchHit:
      allOf:
        - $ref: "#/components/schemas/FsItem"
        - type: object
          required: [at]
          properties:
            at:
              type: string
              description: The folder the hit lies in.
            line:
              type: integer
              description: For a content search, the line of the first match, counted from 1.
    SearchResult:
      type: object
      required: [path, items, total, scanned, indexed]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        total:
          type: integer
          description: Every hit, items holds the first ones.
        more:
          type: boolean
          description: There are more hits than items.
        scanned:
          type: integer
          description: Entries looked at.
        pending:
          type: integer
          description: Files whose metadata could not be read in time, so field tests may have missed them.
        unknown:
          type: array
          items:
            type: string
          description: Field names nobody knows. The search finds nothing while there are any.
        indexed:
          type: boolean
          description: The search read the index rather than the disk.
    ContentSearchParams:
      type: object
      description: Params of the job kind contentSearch. Upper and lower case do not count, binary files are passed over.
      required: [path, text]
      properties:
        path:
          type: string
        text:
          type: string
        q:
          type: string
        hidden:
          type: boolean
        type:
          type: string
        min:
          type: string
        max:
          type: string
        when:
          type: string
    ContentSearchResult:
      type: object
      description: The result of a finished contentSearch job, the first 2000 hits in the order of GET /search.
      required: [items, total, scanned]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        total:
          type: integer
        scanned:
          type: integer
    SearchHitsEvent:
      type: object
      description: Data of search.hits, new hits of a running content search. The last one has done set.
      required: [job, items, total, scanned]
      properties:
        job:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        total:
          type: integer
        scanned:
          type: integer
        done:
          type: boolean
    IndexProgressEvent:
      type: object
      description: Data of index.progress, sent while a reindex job runs.
      required: [job, source, status, dirs, files]
      properties:
        job:
          type: string
        source:
          type: string
        status:
          type: string
          enum: [ready, indexing, unavailable]
        dirs:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        scanning:
          type: string
          description: The folder the scanner reads.
        done:
          type: boolean
    IndexState:
      type: object
      required: [source, path, status, dirs, files, size, quickScanSeconds, fullScanSeconds, metadata]
      properties:
        source:
          type: string
        path:
          type: string
          description: Where the source is mounted.
        status:
          type: string
          enum: [ready, indexing, unavailable, "off"]
        dirs:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
          description: Bytes of the files in the index.
        lastIndexed:
          type: string
          format: date-time
        quickScanSeconds:
          type: integer
        fullScanSeconds:
          type: integer
        nextScan:
          type: string
          format: date-time
          description: When the scheduler reads a folder of the source next.
        scanEverySeconds:
          type: integer
          description: |
            How often the top folder is read again. The scheduler shortens
            it while files change and stretches it while they do not,
            between 5 minutes and 12 hours.
        scanning:
          type: string
          description: The folder a scanner reads right now.
        metadata:
          type: integer
          format: int64
          description: Files below the source with cached metadata.
        job:
          type: string
          description: The open reindex job of the source.
    IndexStates:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/IndexState"
    ReindexParams:
      type: object
      description: Params of the job kind reindex and body of POST /admin/index.
      properties:
        source:
          type: string
          description: Name of the source. Without it every indexed source is read again.

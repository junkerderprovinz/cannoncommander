tag:
  name: system
  description: Server state and the settings only admins change.
paths:
  /system:
    get:
      operationId: systemGet
      summary: Version, uptime and available features
  /admin/sources:
    get:
      operationId: sourcesGet
      summary: Configured sources
      x-access: admin
    put:
      operationId: sourcesPut
      summary: Save sources
      x-access: admin
  /admin/index:
    get:
      operationId: indexState
      summary: State of the index per source
      description: |
        Per source whether it is indexed and ready, how many folders and
        files the index holds, how long the scans took, which folder is
        being read, how many files have cached metadata and the open
        rebuild, if any.
      x-access: admin
      responses:
        "200":
          description: The sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStates"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: indexRebuild
      summary: Rebuild the index of a source
      description: |
        Starts a reindex job that reads one source, or every indexed one,
        again in full and then drops the cached metadata of files that are
        gone. Its progress comes as index.progress events.
      x-access: admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexParams"
      responses:
        "202":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: The job queue is not running.
  /admin/integrations/test:
    post:
      operationId: integrationsTest
      summary: Try an integration such as an office server
      x-access: admin
  /admin/app:
    get:
      operationId: appSettingsGet
      summary: Server wide settings
      x-access: admin
    put:
      operationId: appSettingsPut
      summary: Save server wide settings
      x-access: admin

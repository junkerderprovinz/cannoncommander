http:
  port: 8080
  baseURL: "/subpath"
  trustProxyHeaders: true
server:
  logging:
    - levels: "info|error|warning|debug"
      apiFilter: 'disabled'
  sources:
    - path: "../frontend/tests/playwright-files"
      config:
        defaultEnabled: true
        createUserDir: true
        defaultPermissions:
          view: true
          download: true
          modify: true
          create: true

frontend:
  name: "CannonCommander"
auth:
  methods:
    password:
      enabled: true

userDefaults:
  account:
    permissions:
      share: true
